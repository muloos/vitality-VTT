function paintThemeMenuItem() {
  const icon = $('theme-menu-icon'), label = $('theme-menu-label'); if (!icon || !label) return;
  const light = getTheme() === 'light';
  icon.innerHTML = light ? ICON_SUN : ICON_MOON;
  label.textContent = light ? 'Tema: claro' : 'Tema: escuro';
}
paintThemeMenuItem();
const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
// ícones de linha (svgrepo-style, 24x24, stroke) reutilizados nesta página — sem emoji em nenhuma opção
const ic = (paths, attrs = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${attrs}>${paths}</svg>`;
// modal de confirmação estilizado (mesmo padrão visual do guia) — substitui confirm() nativo
function confirmModal({ title, desc, confirmLabel = 'Confirmar', danger = true } = {}) {
  return new Promise((resolve) => {
    const trigger = document.activeElement;
    const w = document.createElement('div');
    w.className = 'ui-modal';
    w.setAttribute('role', 'alertdialog');
    w.setAttribute('aria-modal', 'true');
    w.setAttribute('aria-labelledby', 'confirm-title');
    w.innerHTML = `<div class="box guide">
      <div class="ghead"><h3 id="confirm-title">${esc(title)}</h3><button class="x" aria-label="Fechar">×</button></div>
      <p class="gintro">${esc(desc)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn auto" id="cm-cancel">Cancelar</button>
        <button class="btn auto ${danger ? 'danger' : 'go'}" id="cm-ok">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    const untrap = trapFocus(w);
    const finish = (result) => { untrap(); w.remove(); document.removeEventListener('keydown', onEsc); if (trigger && trigger.focus) trigger.focus(); resolve(result); };
    const onEsc = (e) => { if (e.key === 'Escape') finish(false); };
    w.addEventListener('click', (e) => { if (e.target === w) finish(false); });
    w.querySelector('.x').onclick = () => finish(false);
    w.querySelector('#cm-cancel').onclick = () => finish(false);
    w.querySelector('#cm-ok').onclick = () => finish(true);
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(w);
    w.querySelector('#cm-ok').focus();
  });
}

  <div class="ec-title">${title}</div><div class="ec-desc">${desc}</div>${cta || ''}</div>`;
const campaignId = new URLSearchParams(location.search).get('id');

let role = null, mesa = null, character = null, currentTab = null, sys = null, myId = null, _statMap = null, _unsub = null, _unsubChat = null, _unsubItemReq = null;
let _unsubCharLive = null, _unsubMembers = null, _unsubCampaign = null, _unsubGmView = null, _unsubPresence = null;
let _unsubCombat = null, _unsubInitiative = null;

let inOnboarding = false;
// junta N chamadas rápidas (ex.: resync de classe mexendo em vários atributos de uma vez) numa só —
// evita re-renderizar a aba várias vezes em sequência quando um lote de mudanças chega em tempo real
function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

function showMsg(t, kind) { const m = $('msg'); m.textContent = t; m.className = 'msg show ' + (kind || 'err'); setTimeout(() => { if (m.textContent === t) m.className = 'msg'; }, 4000); }

  const icGroup = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c.5-3.2 3-5.5 6.2-5.5s5.7 2.3 6.2 5.5"/><path d="M16.2 6.2a3.2 3.2 0 0 1 0 6.2"/><path d="M18.5 14.6c2.3.6 4 2.6 4.4 5.2"/></svg></span>';

}

(async () => {
  if (!campaignId) { location.href = 'app.html'; return; }
  const session = await db.requireSession();
  if (!session) return;

  const [profile, user] = await Promise.all([db.getMyProfile(), db.getUser()]);
  myId = user?.id || null;
  myEmail = user?.email || null;
  myName = profile?.display_name || user?.email?.split('@')[0] || '—';
  $('who').textContent = myName;
  $('nav-av').textContent = myName.trim().charAt(0).toUpperCase() || '?';

  try {
    mesa = await db.getCampaign(campaignId);
    role = await db.getMyRole(campaignId);
  } catch (e) { $('content').innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; return; }

  if (!mesa || !role) { // não é membro / mesa inexistente
    document.querySelector('.mesa-main').innerHTML = '<div class="empty">Mesa não encontrada ou você não faz parte dela. <a href="app.html" style="color:var(--brass)">Voltar</a></div>';
    return;
  }

  if (mesa.system_id) { try { sys = await db.getSystemBundle(mesa.system_id); } catch (_) { sys = null; } }

  const sysName = sys?.system?.name;
  $('mesa-name').innerHTML = esc(mesa.name) + '<small>' + (role === 'gm' ? 'MESTRE' : 'JOGADOR') + (sysName ? ' · SISTEMA: ' + esc(sysName).toUpperCase() : '') + '</small>';
  paintMesaAvatar();

  if (role === 'player') {
    character = await db.ensureCharacter(campaignId);
    // antes de tudo — mesmo antes do formulário de criação de personagem — o jogador conhece o
    // sistema (descrição do Mestre + documentos de regra/lore). Só uma vez (intro_seen trava isso,
    // mesmo padrão de onboarding_done); depois ele consegue reabrir isso a qualquer hora na aba
    // "Sistema" da própria ficha.
    if (!character.intro_seen) {
      setMesaChromeVisible(false);
      renderSystemIntro($('content')).catch((e) => { $('content').innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; });
      return;
    }
    if (!character.onboarding_done) {
      inOnboarding = true;
      setMesaChromeVisible(false);
      renderCharSetup($('content'), true).catch((e) => { $('content').innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; });

})();

// mantém a tela sincronizada sem precisar de F5 quando outro cliente conectado (o próprio Mestre,
// ou o jogador em outra aba/dispositivo) muda algo — pontos, itens, equipar, fotos, etc. Cada papel
// assina só o que pode ver (RLS já garante isso no servidor); o callback só re-renderiza a aba atual
// se ela depender do que mudou, pra não interromper à toa uma aba sem relação com a mudança.
function mountLiveSync() {
  if (role === 'player' && character) {
    _unsubCharLive = db.subscribeCharacterLive(character.id, myId, debounce(() => {
      if (currentTab === 'ficha') { patchFichaLive(); return; }
      if (currentTab === 'inventario') { patchInventarioLive(); return; }
      if (currentTab === 'arvores') { patchArvoresLive(); return; }
    }, 300));
  }
  // o trilho de jogadores (#party) fica visível o tempo todo, pra Mestre e jogador — antes só o
  // Mestre assinava isso, e só pra atualizar a lista DENTRO da aba "Jogadores"; o trilho lateral
  // ficava mostrando gente que já tinha saído até dar F5
  _unsubMembers = db.subscribeMemberships(campaignId, debounce(() => {
    renderParty();
    if (role === 'gm') patchJogadoresLive();
  }, 300));
  // ponto de presença (online agora) — canal efêmero, não grava nada no banco
  _unsubPresence = db.subscribePresence(campaignId, myId, (online) => { _onlineIds = online; renderParty(); });
  _unsubCampaign = db.subscribeCampaign(campaignId, debounce((row) => {
    if (!row) return;
    mesa = { ...mesa, ...row };
    const sysName = sys?.system?.name;
    $('mesa-name').innerHTML = esc(mesa.name) + '<small>' + (role === 'gm' ? 'MESTRE' : 'JOGADOR') + (sysName ? ' · SISTEMA: ' + esc(sysName).toUpperCase() : '') + '</small>';
    paintMesaAvatar();
  }, 300));
}

function buildTabs() {
  $('tabs').innerHTML = tabsFor().map(([id, label]) =>
    `<button role="tab" aria-selected="false" data-tab="${id}" onclick="selectTab('${id}')">${label}</button>`).join('');
  const extra = $('mesa-extra');
  const icKey = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg></span>';
  const icLogout = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>';
  const icBack = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></span>';
  // dois lugares mostram as mesmas ações (trilho esquerdo sempre visível + dropdown do topo, útil
  // em telas onde o trilho não cabe/não tem como recolher) — mesmo HTML nos dois, só muda o atributo
  // role="menuitem" que o dropdown precisa e o trilho não
  const act = (menuitem) => role === 'gm'
    ? `<button ${menuitem ? 'role="menuitem"' : ''} onclick="copyCode()">${icKey}Código ${esc(mesa.join_code)}</button>`
    : `<button ${menuitem ? 'role="menuitem"' : ''} onclick="leaveMesa()">${icLogout}Sair desta mesa</button>`;
  if (extra) extra.innerHTML = act(false) + `<a href="app.html">${icBack}Voltar à plataforma</a>`;
  const menuDrop = $('mesa-menu-drop');
  if (menuDrop) menuDrop.innerHTML = act(true) + `<a role="menuitem" href="app.html">${icBack}Voltar à plataforma</a>`;
}
async function renderParty() {
  const box = $('party'); if (!box) return;

  if (!members.length) { box.innerHTML = ''; return; }
  const ord = { gm: 0, player: 1 };
  members.sort((a, b) => (ord[a.role] ?? 9) - (ord[b.role] ?? 9));
  box.innerHTML = `<div class="party-label">Grupo · ${members.length}</div>` + members.map((m) => {

let _lastSistemaEmbedTabRendered; // sentinela pro guard abaixo — mesmo truque de _lastArvoreRenderedId
window.openTab = async (name) => {
  // reclicar na aba Árvores enquanto a mesma árvore já está aberta não deve recriar o iframe do
  // zero — só troca de aba (currentTab muda) ou troca de árvore (_arvoreViewingId muda) precisa
  if (name === 'arvores' && currentTab === 'arvores' && _arvoreViewingId === _lastArvoreRenderedId) return;
  // mesma lógica pro construtor de sistema embutido na aba "Sistema": reclicar nela sem trocar de
  // sub-aba do sistema (Status/Itens/...) não pode recriar o iframe, senão qualquer edição em
  // andamento ali dentro se perde
  if (name === 'atributos' && currentTab === 'atributos' && _sistemaEmbedTab === _lastSistemaEmbedTabRendered) return;
  // Biografia tem campos de texto livre com "Salvar alterações" manual (saveIdentity) — sem esse
  // aviso, trocar de aba com edição pendente descartava tudo em silêncio
  if (currentTab === 'biografia' && name !== 'biografia' && _identityDirty) {
    const ok = await confirmModal({ title: 'Sair sem salvar?', desc: 'Você tem edições não salvas na Biografia — elas serão perdidas ao trocar de aba.', confirmLabel: 'Sair sem salvar' });
    if (!ok) return;
    _identityDirty = false;
  }
  // sair da visão somente-leitura do Mestre (viewPlayer) pra qualquer aba encerra a assinatura
  // daquele personagem — senão ela ficaria viva pra sempre no fundo, mesmo sem ninguém olhando
  if (_unsubGmView) { _unsubGmView(); _unsubGmView = null; }
  currentTab = name;
  [...$('tabs').children].forEach((b) => {
    const on = b.dataset.tab === name;
    b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on));
  });
  const c = $('content');
  c.innerHTML = '<div class="empty">Carregando…</div>';
  if (name === 'arvores') _lastArvoreRenderedId = _arvoreViewingId;
  if (name === 'atributos') _lastSistemaEmbedTabRendered = _sistemaEmbedTab;
  const fn = { jogadores: renderJogadores, criaturas: renderCriaturas, combate: renderCombate, atributos: renderAtributos, arvores: renderArvores,
               ficha: renderFicha, biografia: renderBiografia, inventario: renderInventario, anotacoes: renderAnotacoes,
               habilidades: renderHabilidades, sistema: renderSistemaInfo }[name];
  fn(c).catch((e) => { c.innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; });
};

// recarregar as Configurações da mesa (nome/foto) logo abaixo, que já são editadas ali mesmo
async function patchJogadoresLive() {
  if (currentTab !== 'jogadores') return;
  try {
    const members = await db.listMembers(campaignId);
    const players = members.filter((m) => m.role === 'player');
    const list = $('jogadores-list');
    if (list) {
      const existing = new Map([...list.querySelectorAll('[data-id]')].map((el) => [el.dataset.id, el]));
      const seen = new Set();
      members.forEach((m) => {
        seen.add(m.user_id);
        const fresh = memberRowHtml(m);
        const old = existing.get(m.user_id);
        if (old) old.outerHTML = fresh; else list.insertAdjacentHTML('beforeend', fresh);
      });
      existing.forEach((el, id) => { if (!seen.has(id)) el.remove(); });
    }
    const count = $('jogadores-count'); if (count) count.textContent = `(${players.length})`;
    const hint = $('jogadores-empty-hint'); if (hint) hint.style.display = players.length ? 'none' : '';
  } catch (_) {}
}

// ============================================================
// COMBATE / INICIATIVA EM TEMPO REAL — aba "Combate" visível pra Mestre e jogadores (RLS decide o
// que cada um pode escrever). mesa_combat_state é uma linha mutável por mesa (mesmo padrão do
// player de música); mesa_initiative_entries guarda sempre 1 linha "atual" por participante.
// A regra "quem inicia o combate age primeiro" é 100% derivada aqui no cliente — nunca uma escrita
// especial — pra Mestre e jogador nunca poderem dessincronizar sobre quem abriu a luta.
// ============================================================
function computeTurnOrder(entries, combatState) {
  const sorted = [...entries].sort((a, b) => Number(b.initiative_value) - Number(a.initiative_value));
  const starterRef = combatState?.started_by;
  if (starterRef) {
    const idx = sorted.findIndex((e) => e.participant_ref === starterRef);
    if (idx > 0) { const [starter] = sorted.splice(idx, 1); sorted.unshift(starter); }
  }
  return sorted;
}
async function mountCombat() {
  try { _combatState = await db.getCombatState(campaignId); } catch (_) {}
  try { _initiativeEntries = await db.listInitiativeEntries(campaignId); } catch (_) {}
  renderCombatBar();
  maybeShowInitiativeModal();
  _unsubCombat = db.subscribeCombatState(campaignId, (row) => {
    _combatState = row;
    renderCombatBar();
    maybeShowInitiativeModal();
    if (currentTab === 'combate') renderCombate($('content'));
  });
  _unsubInitiative = db.subscribeInitiativeEntries(campaignId, async () => {
    try { _initiativeEntries = await db.listInitiativeEntries(campaignId); } catch (_) { return; }
    renderCombatBar();
    if (currentTab === 'combate') renderCombate($('content'));
  });
}

  const current = order[idx];

  if (!bar) {

// moldura de raridade "premium" (mesmo padrão de app.html/sistema.html, duplicado aqui de
// propósito) — usada na mochila somente-leitura que o Mestre vê da ficha do jogador. Diferente
// do rarityFxLayers() do tabuleiro (paper doll), que é outro efeito (aura/ground/rings/rays).
function posterRarityLayers(rarity) {
  const glintSpots = {
    'Épico': [[16, 22]],
    'Lendário': [[18, 18], [80, 28], [14, 66], [84, 86]],
    'Único': [[12, 14], [82, 20], [6, 36], [90, 46], [16, 64], [86, 78], [24, 94], [72, 90], [48, 10], [46, 56], [66, 48]],
  };
  const spots = glintSpots[rarity] || [];
  let glints = '';

      ${hasProtection ? `<span class="badge mod">Proteção ${esc(String(it.protection))}${it.protection_scale ? ' + ' + esc(it.protection_scale) : ''}</span>` : ''}
      ${it.equipped ? `<span class="badge" style="border-color:var(--maq);color:var(--maq)">Equipado</span>` : ''}
    </div>
    ${it.description ? `<p class="gintro">${esc(it.description)}</p>` : `<p class="gintro" style="color:var(--ink-faint)">Sem descrição.</p>`}
    ${(it.modifiers && it.modifiers.length) ? `<div class="mods" style="margin-bottom:12px">${it.modifiers.map((m) => `<span class="badge mod">${itemModLabel(m)}</span>`).join('')}</div>` : ''}
    <div class="idet-creator">Quantidade: ${esc(String(it.qty))}</div>
  </div>`;
  const untrap = trapFocus(w);
  const close = () => { untrap(); w.remove(); document.removeEventListener('keydown', onEsc); if (trigger && trigger.focus) trigger.focus(); };
  const onEsc = (e) => { if (e.key === 'Escape') close(); };
  w.addEventListener('click', (e) => { if (e.target === w) close(); });
  w.querySelector('.x').onclick = close;
  document.addEventListener('keydown', onEsc);
  document.body.appendChild(w);
  w.querySelector('.x').focus();
};

window.gmSetTreePoints = (treeId, userId) => {
  const el = $('gm-treepts-' + treeId); if (!el) return;
  const val = Math.max(0, parseInt(el.value) || 0);
  db.setTreePoints(treeId, userId, val).then(() => showMsg('Pontos atualizados.')).catch((e) => showMsg(e.message));
};
window.gmAdjustPoints = (delta) => {
  if (!_gmViewChar) return;
  const next = Math.max(0, (_gmViewChar.stat_points || 0) + delta);
  db.updateCharacter(_gmViewChar.id, { stat_points: next }).then(() => {
    _gmViewChar.stat_points = next;
    const b = $('gm-points-badge'); if (b) b.textContent = next;
    showMsg('Pontos de status atualizados.', 'ok');
  }).catch((e) => showMsg(e.message));
};
// subir de nível concede (via RPC) os pontos de status + de árvore configurados na Progressão de
// nível do sistema — nunca retroage se o nível cair (só corrige o número, não tira pontos já dados).
window.gmAdjustLevel = (delta) => {
  if (!_gmViewChar) return;
  const next = Math.max(1, (_gmViewChar.level || 1) + delta);
  db.updateCharacter(_gmViewChar.id, { level: next }).then(async () => {
    _gmViewChar.level = next;
    let r = { stat_points: 0, tree_points: 0 };
    if (delta > 0) { try { r = await db.applyLevelRewards(_gmViewChar.id); } catch (_) {} }
    const parts = [];
    if (r.stat_points) parts.push(`+${r.stat_points} ponto(s) de status`);
    if (r.tree_points) parts.push(`+${r.tree_points} ponto(s) de árvore`);
    showMsg(parts.length ? `Nível ${next}! ${parts.join(', ')}.` : `Nível atualizado para ${next}.`, 'ok');
    viewPlayer(_gmViewUserId, _gmViewName);
  }).catch((e) => showMsg(e.message));
};
// ajuste direto do valor do status (não mexe em stat_points — pra isso existe o controle
// dedicado "Pontos de status do jogador" logo abaixo, com gmAdjustPoints). Antes o "−" também
// devolvia 1 ponto de status incondicionalmente: alternar +/− no mesmo status voltava o valor
// ao normal mas gerava +1 ponto a cada ciclo, um jeito fácil de duplicar pontos.
window.gmAdjustStat = (statId, delta) => {
  if (!_gmViewChar) return;
  const stat = _gmViewAttrs.find((a) => a.id === statId); if (!stat) return;
  const cur = Number(_gmViewValues[statId] ?? stat.default_value ?? 0) || 0;
  const next = Math.max(0, cur + delta);
  db.setCharacterAttribute(_gmViewChar.id, statId, next).then(() => {
    _gmViewValues[statId] = next;
    const el = $('gmval-' + statId); if (el) el.textContent = next;
    showMsg('Status ajustado.', 'ok');
  }).catch((e) => showMsg(e.message));
};
// mesmo atalho +/- direto que a ficha de NPC já tinha (npcAdjustResource) — faltava aqui na visão
// do Mestre sobre um jogador, único jeito de ajustar HP/recurso era abrindo a ficha do próprio jogador
window.gmAdjustResource = (statId, delta) => {
  if (!_gmViewChar) return;
  const stat = _gmViewAttrs.find((a) => a.id === statId); if (!stat) return;
  const max = evalStatIn(_gmViewAttrs, _gmViewValues, stat, _gmViewSkillBonus, new Set(), _gmViewProfCtx, _gmViewChar?.level) ?? 0;
  let cur = _gmViewResources?.[statId]; if (cur == null || cur === '') cur = max; cur = Number(cur);
  const next = Math.max(0, cur + delta);
  db.setCharacterResource(_gmViewChar.id, statId, next).then(() => {
    if (_gmViewResources) _gmViewResources[statId] = next;
    renderGmFicha($('content'));
  }).catch((e) => showMsg(e.message));
};
window.gmToggleProficiency = (proficiencyId, granted) => {
  if (!_gmViewChar) return;
  db.gmSetProficiency(_gmViewChar.id, proficiencyId, granted).then(() => {
    _gmViewProficiencies[proficiencyId] = granted;
    viewPlayer(_gmViewUserId, _gmViewName);
    showMsg(granted ? 'Proficiência concedida.' : 'Proficiência revogada.', 'ok');
  }).catch((e) => showMsg(e.message));
};

// checagem+cópia compartilhada por viewSistemaInline e viewTreeInline: se o sistema da mesa não é
// do Mestre, edita-lo aqui dentro criaria uma edição sem dono claro — em vez disso, clonamos o
// sistema inteiro (fork_system_for_campaign) pro Mestre na primeira tentativa de edição, e dali em
// diante ele edita a cópia normalmente. null = usuário cancelou (nada deve prosseguir); { treeMap }
// = pode seguir (treeMap vazio quando não precisou copiar).
async function ensureOwnSystemForEdit() {
  if (!sys || !sys.system) return null;
  if (sys.system.owner_id === myId) return { treeMap: {} };
  const ok = await confirmModal({
    title: 'Criar uma cópia deste sistema?',
    desc: 'Este sistema pertence a outro criador. Pra editar aqui dentro da mesa, criamos uma cópia independente — só sua e só desta mesa. O sistema original e qualquer outra mesa que o usa continuam intactos.',
    confirmLabel: 'Criar cópia e editar', danger: false,
  });
  if (!ok) return null;
  try {
    const { newSystemId, treeMap } = await db.forkSystemForCampaign(campaignId, mesa.system_id);
    mesa.system_id = newSystemId;
    sys = await db.getSystemBundle(newSystemId);
    return { treeMap };
  } catch (e) { showMsg('Não foi possível criar a cópia: ' + e.message); return null; }
}

// atualização leve da lista de árvores (só o create/delete de árvore mexe aqui — o jogo/edição de
// verdade acontece em arvore.html, uma página à parte); se a lista estava vazia quando a aba abriu
// (sem o #arvores-grid ainda existir), o próximo openTab natural resolve, sem forçar reload aqui.
async function patchArvoresLive() {
  if (currentTab !== 'arvores' || mesa.system_id) return;
  const grid = $('arvores-grid'); if (!grid) return;
  try {
    const trees = await db.listTrees(campaignId);
    const gm = role === 'gm';
    const existing = new Map([...grid.querySelectorAll('[data-id]')].map((el) => [el.dataset.id, el]));
    const seen = new Set();
    trees.forEach((t) => {
      seen.add(t.id);

            <button class="portrait-edit-btn" title="Trocar foto de perfil" onclick="pickAvatarQuickFile()"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>

// arrastar a foto de capa pra escolher qual parte fica visível (salva o foco vertical em % no solto)
function wireCoverDrag() {
  const img = $('char-cover-img'); if (!img) return;
  const box = img.closest('.char-cover'); if (!box) return;
  let dragging = false, startY = 0, startFocal = 50, boxHeight = 1;
  const onMove = (e) => {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const next = Math.max(0, Math.min(100, startFocal - ((y - startY) / boxHeight) * 100));
    img.style.objectPosition = `center ${next.toFixed(1)}%`;
    img.dataset.focal = next;
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    img.classList.remove('dragging');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    const finalFocal = Number(img.dataset.focal);
    if (!Number.isNaN(finalFocal) && character) {
      db.updateCharacter(character.id, { cover_focal_y: finalFocal })
        .then((updated) => { character = { ...character, ...updated }; showMsg('Posição da capa salva.', 'ok'); })
        .catch((e) => showMsg(e.message));
    }
  };
  img.addEventListener('pointerdown', (e) => {
    if (!box.classList.contains('editing')) return; // reposicionar só é permitido depois de "Editar capa"
    dragging = true;
    startY = e.clientY;
    startFocal = Number(img.dataset.focal) || 50;
    boxHeight = box.getBoundingClientRect().height || 1;
    img.classList.add('dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    e.preventDefault();
  });
}
// "Editar capa" alterna o modo de edição: só nesse modo a capa fica arrastável e o botão de trocar aparece
window.toggleCoverEdit = (btn) => {

window.pickCoverFile = () => { const el = $('cover-file'); if (el) el.click(); };
window.pickAvatarQuickFile = () => { const el = $('avatar-quick-file'); if (el) el.click(); };
window.onCoverFile = (input) => {
  const file = input.files && input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showMsg('Selecione uma imagem.'); input.value = ''; return; }
  if (file.size > 3 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 3 MB).'); input.value = ''; return; }
  db.uploadImage(file, 'characters')
    .then((url) => db.updateCharacter(character.id, { cover_url: url, cover_focal_y: 50 }))
    .then((updated) => {
      character = { ...character, ...updated }; input.value = '';
      // já tinha capa: só troca a foto no lugar. Primeira capa da ficha muda a estrutura
      // toda (bio-row vira char-cover), aí sim precisa reconstruir a seção.
      const img = $('char-cover-img');
      if (img) { img.src = updated.cover_url; img.dataset.focal = 50; img.style.objectPosition = 'center 50%'; }
      else openTab('ficha');
    })
    .catch((e) => showMsg(e.message));
};
window.onAvatarQuickFile = (input) => {
  const file = input.files && input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showMsg('Selecione uma imagem.'); input.value = ''; return; }
  if (file.size > 3 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 3 MB).'); input.value = ''; return; }
  db.uploadImage(file, 'characters').then((url) => {
    const gallery = [...(character.gallery || []), url];
    return db.updateCharacter(character.id, { avatar_url: url, gallery });
  }).then((updated) => {
    character = { ...character, ...updated }; input.value = '';
    // mesma lógica da capa: só troca o src se já existir <img> (senão era um placeholder de
    // iniciais, e virar foto de verdade muda a estrutura — aí precisa reconstruir)
    const img = document.querySelector('img.char-portrait');
    if (img) img.src = updated.avatar_url;
    else openTab('ficha');
  })
    .catch((e) => showMsg(e.message));
};

/* -------- guia rápido: fórmulas pessoais (item do inventário + status) -------- */
function evalFormulaTermIn(attrs, values, t, profCtx) {
  if (t.type === 'stat') {
    const stat = attrs.find((a) => a.id === t.statId);
    return stat ? (evalStatIn(attrs, values, stat, _fichaSkillBonus, new Set(), profCtx, character?.level) ?? 0) : 0;
  }
  if (t.type === 'level') return Number(character?.level) || 0;
  return Number(t.value) || 0; // item (valor no momento em que foi adicionado) e número fixo
}
function evalFormulaIn(attrs, values, f, profCtx) { return (f.terms || []).reduce((sum, t) => sum + (t.sign || 1) * evalFormulaTermIn(attrs, values, t, profCtx), 0); }
function evalFormulaTerm(t) { return evalFormulaTermIn(_fichaAttrs, _fichaValues, t, _fichaProfCtx); }
function evalFormula(f) { return evalFormulaIn(_fichaAttrs, _fichaValues, f, _fichaProfCtx); }
function formulaRow(f) {
  const total = Math.round(evalFormula(f) * 100) / 100;
  const breakdown = (f.terms || []).map((t, i) => (i === 0 ? (t.sign < 0 ? '−' : '') : (t.sign < 0 ? ' − ' : ' + ')) + (t.label || '?')).join('');
  return `<div class="formula-row" data-id="${f.id}"><div class="fn"><b>${esc(f.name)}</b><span class="fbreak">${esc(breakdown)}</span></div>
    <div class="fresult">${total}</div>
    <button class="btn sm danger auto" onclick="delFormula('${f.id}')" aria-label="Excluir fórmula"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
}
// insere/remove uma linha de fórmula direto no #formula-list, sem recarregar a ficha inteira
function patchFormulaList() {
  const box = $('formula-list'); if (!box) return;
  box.innerHTML = _fichaFormulas.length ? _fichaFormulas.map(formulaRow).join('') : '<div class="empty">Nenhuma fórmula ainda.</div>';
}
window.delFormula = async (id) => {
  const ok = await confirmModal({ title: 'Excluir fórmula', desc: 'Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;

window.openFormulaBuilder = () => { _builderTerms = [{ sign: 1, type: 'stat' }]; renderFormulaBuilder(); };
window.closeFormulaBuilder = () => { const b = $('formula-builder'); if (b) b.innerHTML = ''; _builderTerms = []; };

function termRow(t, i) {

function termItemModSelect(t, i) {

  const item = _fichaInventory.find((it) => it.id === t.itemId);

window.saveFormulaBuilder = () => {
  const name = $('fb-name').value.trim(); if (!name) { showMsg('Dê um nome à fórmula.'); return; }

    if (t.type === 'level') {

    }

      const item = _fichaInventory.find((it) => it.id === t.itemId);
      const modStat = t.modStatId ? _fichaAttrs.find((a) => a.id === t.modStatId) : null;
      return item ? { type: 'item', sign: t.sign || 1, value: t.value || 0, label: `${item.name}${modStat ? ' (' + modStat.name + ')' : ''}` } : null;

  const vEl = $('secval-' + statId);

    // pillar I (§2.4): um bump discreto tier-1 — confirma o clique antes mesmo do Salvar aparecer,
    // sem promover um ponto de status (rotina) a evento tier-2
    const newText = String(base + pend + (bonus ? bonus.total : 0));
    if (vEl.textContent !== newText) {
      vEl.textContent = newText;
      vEl.classList.remove('bump'); void vEl.offsetWidth; vEl.classList.add('bump');
    }

  const bEl = $('secbonus-' + statId); if (bEl) { bEl.style.display = bonus ? '' : 'none'; bEl.textContent = bonus ? `+${bonus.total}` : ''; bEl.title = bonus ? bonusTitle(bonus) : ''; }
  const minusEl = $('secminus-' + statId); if (minusEl) minusEl.disabled = pend <= 0;
  const left = pointsLeft();
  document.querySelectorAll('[id^="secbtn-"]').forEach((b) => { b.disabled = left <= 0; });
  const badge = $('stat-points-badge'); if (badge) badge.textContent = left;

// substitui/insere/remove cards de um grid de itens (por data-id), sem recriar o grid inteiro —
// preserva os cards que não mudaram (scroll, animações em andamento etc.)
function patchInvGrid(container, items, emptyHtml) {
  if (!container) return;
  const existing = new Map([...container.querySelectorAll('.poster-card[data-id]')].map((el) => [el.dataset.id, el.parentElement]));
  if (!items.length) {
    existing.forEach((frame) => frame.remove());
    if (emptyHtml && !container.querySelector('.empty')) container.insertAdjacentHTML('beforeend', emptyHtml);
    return;
  }
  container.querySelectorAll(':scope > .empty').forEach((e) => e.remove());
  const seen = new Set();
  items.forEach((it) => {
    seen.add(it.id);
    const fresh = invRow(it);
    const oldFrame = existing.get(it.id);
    if (oldFrame) oldFrame.outerHTML = fresh;
    else container.insertAdjacentHTML('beforeend', fresh);
  });
  existing.forEach((frame, id) => { if (!seen.has(id)) frame.remove(); });
}

  const sparkCount = tier >= 5 ? 9 : tier >= 4 ? 5 : tier >= 3 ? 3 : 0;
  let sparks = '';
  for (let i = 0; i < sparkCount; i++) {
    const left = (25 + Math.random() * 50).toFixed(1);
    const sx = (Math.random() * 44 - 22).toFixed(1);
    const size = (2.5 + Math.random() * 2.5).toFixed(1);
    const delay = (Math.random() * 2).toFixed(2);
    const dur = (1.6 + Math.random() * 1.3).toFixed(2);
    sparks += `<i class="rar-spark" style="left:${left}%;width:${size}px;height:${size}px;--sx:${sx}px;animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  }

  try {
    const sheet = await db.loadSheet(campaignId);

    try { _fichaSkillBonus = mergeBonusMaps(bonusMapFrom(resolveBonusAmounts(await db.getSkillBonuses(campaignId, ch.user_id), attributes, values, ch.level, profCtx)), equipBonusMap(inv, attributes), conditionBonusMap(sys?.conditions, conds)); }
    catch (_) { _fichaSkillBonus = mergeBonusMaps(equipBonusMap(inv, attributes), conditionBonusMap(sys?.conditions, conds)); }
    const map = {}; attributes.forEach((a) => { if (a.formula_key) map[a.formula_key.trim()] = evalStatIn(attributes, values, a, _fichaSkillBonus, new Set(), profCtx, ch.level) ?? 0; });
    // "nivel" é palavra reservada em toda fórmula (ver evalStatIn) mesmo não sendo um Status de
    // verdade — sem isso, rollFormula (rolagem rápida, dano de arma que escala com nível) não
    // conseguia resolver o termo, já que só existe no tokenizer de evalStatIn, não no de statMap
    map.nivel = Number(ch.level) || 0;
    _statMap = map;
    _diceStats = [{ name: 'Nível', key: 'nivel', value: map.nivel }, ...attributes.filter((a) => a.formula_key).map((a) => ({ name: a.name, key: a.formula_key.trim(), value: map[a.formula_key.trim()] }))];
    const formulas = await db.listCharacterFormulas(ch.id);
    _diceFormulas = formulas.map((f) => ({ id: f.id, name: f.name, total: Math.round(evalFormulaIn(attributes, values, f, profCtx) * 100) / 100 }));
  } catch (_) { _statMap = {}; _diceStats = []; _diceFormulas = []; }
}

// advMode ('adv'|'dis'|null) só se aplica ao PRIMEIRO termo "1d20" da fórmula (o clássico "role 2x,
// fique com o maior/menor") — não faz sentido pra grupos de dado (2d6 etc.) nem pra outros tamanhos
// de dado, então fica restrito a exatamente 1d20, igual a convenção de mesa de verdade.
function rollFormula(input, statMap, advMode) {
  const f = (input || '').trim(); if (!f) throw new Error('Digite uma fórmula (ex.: 1d20+3).');
  const re = /([+\-]?)\s*(\d*d\d+|\d+\.?\d*|[A-Za-zÀ-ú_][A-Za-zÀ-ú0-9_]*)/gi;
  let m, total = 0, parts = [], count = 0, usedAdv = false;
  while ((m = re.exec(f))) {
    count++; const sign = m[1] === '-' ? -1 : 1; const term = m[2];
    const dm = /^(\d*)d(\d+)$/i.exec(term);
    if (dm) {
      const n = Math.min(Math.max(parseInt(dm[1] || '1'), 1), 100), faces = parseInt(dm[2]);
      if (faces < 1) throw new Error('Dado inválido: ' + term);
      if (advMode && !usedAdv && n === 1 && faces === 20) {
        usedAdv = true;
        const r1 = 1 + Math.floor(Math.random() * 20), r2 = 1 + Math.floor(Math.random() * 20);
        const kept = advMode === 'dis' ? Math.min(r1, r2) : Math.max(r1, r2);
        const discarded = kept === r1 ? r2 : r1;
        total += sign * kept;
        // formatado como "1d20[kept]" de propósito — é o mesmo formato que rollExtremity() já
        // reconhece pra destacar crítico/falha crítica, só que só com o dado QUE FICOU (não os 2),
        // senão um [7, 20] com vantagem nunca acenderia o crítico por causa do 7 descartado
        parts.push({ sign, text: `1d20[${kept}] (${advMode === 'dis' ? 'desvantagem' : 'vantagem'} — descartado ${discarded})` });
        continue;
      }
      const rolls = []; for (let i = 0; i < n; i++) rolls.push(1 + Math.floor(Math.random() * faces));
      total += sign * rolls.reduce((a, b) => a + b, 0);
      parts.push({ sign, text: `${n}d${faces}[${rolls.join(', ')}]` });
    } else if (/^[A-Za-zÀ-ú_]/.test(term)) {
      const v = Number(statMap[term.trim()]); if (isNaN(v)) throw new Error(`"${term}" não é um status seu`);
      total += sign * v; parts.push({ sign, text: `${term}(${v})` });
    } else { const v = Number(term); total += sign * v; parts.push({ sign, text: `${v}` }); }
  }
  if (!count) throw new Error('Fórmula inválida.');
  const detail = parts.map((p, i) => (i === 0 ? (p.sign < 0 ? '−' : '') : (p.sign < 0 ? ' − ' : ' + ')) + p.text).join('');
  return { total: Math.round(total * 100) / 100, detail };
}
function doRoll(f, label, advMode) {
  try { const { total, detail } = rollFormula(f, _statMap || {}, advMode);
    const finalDetail = label ? `${detail} (${label})` : detail;
    // no bloco da rolagem quem aparece é o personagem, não a conta — o Mestre não tem
    // personagem nesta mesa, então continua caindo no nome de perfil (fallback do addRoll)
    const rollerName = (role === 'player' && character && character.name) ? character.name : undefined;
    db.addRoll(campaignId, { formula: f, detail: finalDetail, total, is_private: false, rollerName }).then(addRollToLog).catch((e) => showMsg(e.message));
  } catch (e) { showMsg(e.message); }
}

// pillar III (§4.3): heurística visual pra nat-max/nat-min — lê os grupos de dado embutidos no
// `detail` (ex.: "1d20[20]") sem precisar de coluna nova no banco; não afeta o total, só a ênfase
function rollExtremity(detail) {
  const re = /(\d+)d(\d+)\[([\d,\s]+)\]/g;
  let m, sawDie = false, allMax = true, allMin = true;
  while ((m = re.exec(detail || ''))) {
    const faces = parseInt(m[2]);
    m[3].split(',').forEach((s) => { const v = parseInt(s.trim()); sawDie = true; if (v !== faces) allMax = false; if (v !== 1) allMin = false; });
  }
  if (!sawDie) return null;
  if (allMax) return 'max';
  if (allMin) return 'min';
  return null;
}
function rollEl(r, justLanded) {
  const mine = r.user_id === myId;
  const when = new Date(r.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const extremity = rollExtremity(r.detail);
  const critClass = extremity === 'max' ? ' crit-max' : extremity === 'min' ? ' crit-min' : '';
  const critLabel = extremity === 'max' ? 'Crítico natural' : extremity === 'min' ? 'Falha crítica' : '';
  const critTagHtml = critLabel ? `<span class="crit-tag ${extremity}">${critLabel}</span>` : '';
  const div = document.createElement('div');
  // .mine (§3.2) é persistente; .landing (§4.3) é um tier-2 único aplicado só quando a rolagem
  // acabou de chegar — renderRolls (carga inicial do log) não passa justLanded de propósito
  div.className = 'roll' + (mine ? ' mine' : '') + (r.is_private ? ' secret' : '') + (justLanded ? ' landing' : '');
  div.setAttribute('data-id', r.id);
  div.innerHTML = `<div class="rtop"><span class="who">${esc(r.roller_name || '—')}${r.is_private ? ` <span class="ic">${ICONS.lock}</span>` : ''}</span><span class="ftxt">${esc(r.formula)} · ${when}</span></div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="tot${critClass}">${r.total ?? '—'}</span>${critTagHtml}<span class="det">${esc(r.detail || '')}</span></div>`;
  if (justLanded) div.addEventListener('animationend', () => div.classList.remove('landing'), { once: true });
  return div;
}
function renderRolls(rolls) {
  const log = $('dice-log'); if (!log) return; log.innerHTML = '';
  if (!rolls.length) { log.innerHTML = '<div class="empty" style="border:0">Sem rolagens ainda.</div>'; return; }
  rolls.forEach((r) => log.appendChild(rollEl(r)));   // desc + column-reverse => mais recente embaixo
}
function addRollToLog(r) {
  const log = $('dice-log'); if (!log) return;
  if (log.querySelector(`[data-id="${r.id}"]`)) return;   // evita duplicar (realtime + eco local)
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  log.insertBefore(rollEl(r, true), log.firstChild);
  markRailTabUnread('rolls');
}

/* ============================ CHAT DA MESA (aba "Conversa" ao lado das rolagens) ============================ */
window.sendChatMsg = (ev) => {
  ev.preventDefault();
  const input = $('chat-input'); const text = input.value.trim();
  if (!text) return false;
  input.value = '';
  db.addMessage(campaignId, text).then(addMsgToLog).then(() => selectRailTab('chat')).catch((e) => showMsg(e.message));
  return false;
};
function msgEl(m, justLanded) {
  const mine = m.user_id === myId;
  const when = new Date(m.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'chat-msg' + (mine ? ' mine' : '') + (justLanded ? ' landing' : '');
  div.setAttribute('data-id', m.id);
  div.innerHTML = `<div class="ctop"><span class="who">${esc(m.sender_name || '—')}</span><span class="cwhen">${when}</span></div>
    <div class="cbody">${esc(m.body)}</div>`;
  if (justLanded) div.addEventListener('animationend', () => div.classList.remove('landing'), { once: true });
  return div;
}
function renderChat(msgs) {
  const log = $('chat-log'); if (!log) return; log.innerHTML = '';
  if (!msgs.length) { log.innerHTML = '<div class="empty" style="border:0">Sem mensagens ainda.</div>'; return; }
  msgs.forEach((m) => log.appendChild(msgEl(m)));   // desc + column-reverse => mais recente embaixo
}
function addMsgToLog(m) {
  const log = $('chat-log'); if (!log) return;
  if (log.querySelector(`[data-id="${m.id}"]`)) return;   // evita duplicar (realtime + eco local)
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  log.insertBefore(msgEl(m, true), log.firstChild);
  markRailTabUnread('chat');
}

</script>
