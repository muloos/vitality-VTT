<!DOCTYPE html>
<html lang="pt-BR">
<head>

<body class="mesa-page">

    <div class="drop glass" role="menu">
      <button role="menuitem" onclick="openProfile()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 3.6-6.5 7.5-6.5s6.7 2.5 7.5 6.5"/></svg></span>Meu perfil</button>
      <button role="menuitem" onclick="openSettings()"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.6M12 17.9v2.6M20.5 12h-2.6M6.1 12H3.5M17.7 6.3l-1.8 1.8M8.1 15.9l-1.8 1.8M17.7 17.7l-1.8-1.8M8.1 8.1 6.3 6.3"/></svg></span>Configurações</button>

    </div>

</div>

<div class="mesa-body">
  <aside class="mesa-rail-left"><div id="party" class="party-list"></div><div id="mesa-extra" class="mesa-extra"></div></aside>
  <main class="mesa-main">
    <div id="msg" class="msg"></div>
    <div id="content"></div>
  </main>
</div>

<script type="module">
import * as db from './lib/db.js?v=24';
import { mountHelp, mountThemeToggle, openHelpGuide, openProfileModal, openSettingsModal, toggleTheme, getTheme } from './lib/ui.js?v=3';
import { mountYtPlayer } from './lib/ytplayer.js?v=3';

mountHelp('mesa');
mountThemeToggle();
const $ = (id) => document.getElementById(id);
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>';
function paintThemeMenuItem() {
  const icon = $('theme-menu-icon'), label = $('theme-menu-label'); if (!icon || !label) return;
  const light = getTheme() === 'light';
  icon.innerHTML = light ? ICON_SUN : ICON_MOON;
  label.textContent = light ? 'Tema: claro' : 'Tema: escuro';
}
paintThemeMenuItem();
const esc = (s) => (s == null ? '' : String(s)).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
// ícones de linha (svgrepo-style, 24x24, stroke) reutilizados nesta página — sem emoji em nenhuma opção
const ic = (paths, attrs = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${attrs}>${paths}</svg>`;
// modal de confirmação estilizado (mesmo padrão visual do guia) — substitui confirm() nativo
function confirmModal({ title, desc, confirmLabel = 'Confirmar', danger = true } = {}) {
  return new Promise((resolve) => {
    const trigger = document.activeElement;
    const w = document.createElement('div');
    w.className = 'ui-modal';
    w.setAttribute('role', 'alertdialog');
    w.setAttribute('aria-modal', 'true');
    w.setAttribute('aria-labelledby', 'confirm-title');
    w.innerHTML = `<div class="box guide">
      <div class="ghead"><h3 id="confirm-title">${esc(title)}</h3><button class="x" aria-label="Fechar">×</button></div>
      <p class="gintro">${esc(desc)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn auto" id="cm-cancel">Cancelar</button>
        <button class="btn auto ${danger ? 'danger' : 'go'}" id="cm-ok">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    const finish = (result) => { w.remove(); document.removeEventListener('keydown', onEsc); if (trigger && trigger.focus) trigger.focus(); resolve(result); };
    const onEsc = (e) => { if (e.key === 'Escape') finish(false); };
    w.addEventListener('click', (e) => { if (e.target === w) finish(false); });
    w.querySelector('.x').onclick = () => finish(false);
    w.querySelector('#cm-cancel').onclick = () => finish(false);
    w.querySelector('#cm-ok').onclick = () => finish(true);
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(w);
    w.querySelector('#cm-ok').focus();
  });
}
const ICONS = {
  pencil: ic('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  x: ic('<path d="M6 6l12 12M18 6 6 18"/>', 'stroke-width="1.8"'),
  check: ic('<path d="M5 12.5l4.5 4.5L19 7"/>', 'stroke-width="1.8"'),
  dice: ic('<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="8" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/>'),
  warning: ic('<path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".4" fill="currentColor" stroke="none"/>'),
  cornerDownRight: ic('<path d="M6 4v8a4 4 0 0 0 4 4h9"/><path d="M15 12l4 4-4 4"/>'),
  sparkle: ic('<path d="M12 3v3M12 18v3M3 12h3M18 12h3M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/><circle cx="12" cy="12" r="2.4"/>'),
  image: ic('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5.5-5.5a2 2 0 0 0-2.8 0L4 19"/>'),
  dna: ic('<path d="M6 3c0 6 12 12 12 18M18 3c0 6-12 12-12 18"/><path d="M7.5 7h9M7.5 17h9M6.5 12h11"/>'),
  star: ic('<path d="M12 3.5l2.6 5.6 6 .7-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.8l6-.7Z"/>'),
  bag: ic('<path d="M8 8c0-2.8 1.8-5 4-5s4 2.2 4 5"/><path d="M6 8h12l1.4 11.2a2 2 0 0 1-2 2.3H6.6a2 2 0 0 1-2-2.3L6 8Z"/>'),
  lock: ic('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  calc: ic('<rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M8 6.5h8"/><path d="M8 11h1.5M8 14.5h1.5M8 18h1.5M12.3 11h1.5M12.3 14.5h1.5M12.3 18h1.5M16.5 11v7"/>'),
  chat: ic('<path d="M4 5h16v11H8l-4 4V5Z"/>'),
  tree: ic('<path d="M12 3 6 12h3l-4 6h4v3h6v-3h4l-4-6h3L12 3Z"/>'),
  externalLink: ic('<path d="M9 6H5.8A1.8 1.8 0 0 0 4 7.8v10.4A1.8 1.8 0 0 0 5.8 20h10.4A1.8 1.8 0 0 0 18 18.2V15"/><path d="M13.5 4H20v6.5"/><path d="M10.5 13.5 20 4"/>'),
  dagger: ic('<path d="M12 2v14"/><path d="M8 6h8"/><path d="M12 16l-3 3 3 3 3-3-3-3Z"/>'),
  shield: ic('<path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6l7-3Z"/>'),
  heart: ic('<path d="M12 20.2 4.6 13c-2-2-2-5 0-6.8 1.9-1.8 4.7-1.6 6.4.4l1 1.2 1-1.2c1.7-2 4.5-2.2 6.4-.4 2 1.8 2 4.8 0 6.8L12 20.2Z"/>'),
  hammer: ic('<path d="M15 4l5 5-2 2-5-5Z"/><path d="M12.5 6.5l5 5-2.5 2.5-5-5Z"/><path d="M3 21l7.5-7.5"/>'),
  checklist: ic('<path d="M4.5 6.5l1.3 1.3L8 5.5"/><path d="M4.5 12.5l1.3 1.3 2.2-2.3"/><path d="M4.5 18.5l1.3 1.3 2.2-2.3"/><path d="M11.5 6.5h8M11.5 12.5h8M11.5 18.5h8"/>'),
};
const emptyState = (icon, title, desc, cta) => `<div class="empty-cta"><div class="ec-icon">${icon}</div>
  <div class="ec-title">${title}</div><div class="ec-desc">${desc}</div>${cta || ''}</div>`;
const campaignId = new URLSearchParams(location.search).get('id');

let role = null, mesa = null, character = null, currentTab = null, sys = null, myId = null, _statMap = null, _unsub = null, _unsubChat = null;
let myName = null, myEmail = null;
let inOnboarding = false;

function showMsg(t, kind) { const m = $('msg'); m.textContent = t; m.className = 'msg show ' + (kind || 'err'); setTimeout(() => { if (m.textContent === t) m.className = 'msg'; }, 4000); }

function tabsFor() {
  const hasSys = !!(mesa && mesa.system_id);
  const icGroup = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M2.8 20c.5-3.2 3-5.5 6.2-5.5s5.7 2.3 6.2 5.5"/><path d="M16.2 6.2a3.2 3.2 0 0 1 0 6.2"/><path d="M18.5 14.6c2.3.6 4 2.6 4.4 5.2"/></svg></span>';
  const icGear = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.6M12 17.9v2.6M20.5 12h-2.6M6.1 12H3.5M17.7 6.3l-1.8 1.8M8.1 15.9l-1.8 1.8M17.7 17.7l-1.8-1.8M8.1 8.1 6.3 6.3"/></svg></span>';
  const icChart = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span>';
  const icTree = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 6 12h3l-4 6h4v3h6v-3h4l-4-6h3L12 3Z"/></svg></span>';
  const icScroll = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h9a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a3 3 0 0 1 3-3Z"/><path d="M9 8h6M9 12h6"/></svg></span>';
  const icDna = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3c0 6 12 12 12 18M18 3c0 6-12 12-12 18"/><path d="M7.5 7h9M7.5 17h9M6.5 12h11"/></svg></span>';
  const icBag = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 8c0-2.8 1.8-5 4-5s4 2.2 4 5"/><path d="M6 8h12l1.4 11.2a2 2 0 0 1-2 2.3H6.6a2 2 0 0 1-2-2.3L6 8Z"/></svg></span>';
  const icPencil = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>';
  if (role === 'gm') return [['jogadores', icGroup + 'Jogadores'], ['atributos', (hasSys ? icGear : icChart) + (hasSys ? 'Sistema' : 'Atributos')], ['arvores', icTree + 'Árvores']];
  return [['ficha', icScroll + 'Ficha'], ['biografia', icDna + 'Biografia'], ['inventario', icBag + 'Inventário'], ['anotacoes', icPencil + 'Anotações'], ['arvores', icTree + 'Árvores']];
}

(async () => {
  if (!campaignId) { location.href = 'app.html'; return; }
  const session = await db.requireSession();
  if (!session) return;

  const [profile, user] = await Promise.all([db.getMyProfile(), db.getUser()]);
  myId = user?.id || null;
  myEmail = user?.email || null;
  myName = profile?.display_name || user?.email?.split('@')[0] || '—';
  $('who').textContent = myName;
  $('nav-av').textContent = myName.trim().charAt(0).toUpperCase() || '?';

  try {
    mesa = await db.getCampaign(campaignId);
    role = await db.getMyRole(campaignId);
  } catch (e) { $('content').innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; return; }

  if (!mesa || !role) { // não é membro / mesa inexistente
    document.querySelector('.mesa-main').innerHTML = '<div class="empty">Mesa não encontrada ou você não faz parte dela. <a href="app.html" style="color:var(--brass)">Voltar</a></div>';
    return;
  }

  if (mesa.system_id) { try { sys = await db.getSystemBundle(mesa.system_id); } catch (_) { sys = null; } }

  const sysName = sys?.system?.name;
  $('mesa-name').innerHTML = esc(mesa.name) + '<small>' + (role === 'gm' ? 'MESTRE' : 'JOGADOR') + (sysName ? ' · SISTEMA: ' + esc(sysName).toUpperCase() : '') + '</small>';
  paintMesaAvatar();

  if (role === 'player') {
    character = await db.ensureCharacter(campaignId);
    if (!character.onboarding_done) {
      inOnboarding = true;
      $('mesa-menu').style.display = 'none';
      renderCharSetup($('content'), true).catch((e) => { $('content').innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; });
      return; // só entra na mesa de verdade depois de concluir a criação do personagem
    }
  }

  enterMesa();
})();

function enterMesa() {
  buildTabs();
  renderParty();
  openTab(tabsFor()[0][0]);
  mountDice();
  mountYtPlayer({ campaignId, role, db });
}

function buildTabs() {
  $('tabs').innerHTML = tabsFor().map(([id, label]) =>
    `<button role="menuitem" data-tab="${id}" onclick="selectTab('${id}')">${label}</button>`).join('');
  const extra = $('mesa-extra');
  if (extra) {
    const icKey = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg></span>';
    const icLogout = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>';
    const icBack = '<span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></span>';
    const act = role === 'gm'
      ? `<button onclick="copyCode()">${icKey}Código ${esc(mesa.join_code)}</button>`
      : `<button onclick="leaveMesa()">${icLogout}Sair desta mesa</button>`;
    extra.innerHTML = act + `<a href="app.html">${icBack}Voltar à plataforma</a>`;
  }
}
async function renderParty() {
  const box = $('party'); if (!box) return;
  let members = [];
  try { members = await db.listMembers(campaignId); } catch (_) { box.innerHTML = ''; return; }
  if (!members.length) { box.innerHTML = ''; return; }
  const ord = { gm: 0, player: 1 };
  members.sort((a, b) => (ord[a.role] ?? 9) - (ord[b.role] ?? 9));
  box.innerHTML = `<div class="party-label">Grupo · ${members.length}</div>` + members.map((m) => {
    const nm = m.profile?.display_name || '—';
    const initial = (nm.trim().charAt(0) || '?').toUpperCase();
    const me = m.user_id === myId;
    return `<div class="party-row${me ? ' me' : ''}">
      <div class="party-av">${esc(initial)}</div>
      <div class="party-info"><div class="party-name">${esc(nm)}${me ? ' · você' : ''}</div>
      <div class="party-role">${m.role === 'gm' ? 'Mestre' : 'Jogador'}</div></div>
    </div>`;
  }).join('');
}
window.selectTab = (id) => { closeMesaMenu(); openTab(id); };

window.openTab = (name) => {
  currentTab = name;
  [...$('tabs').children].forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  const c = $('content');
  c.innerHTML = '<div class="empty">Carregando…</div>';
  const fn = { jogadores: renderJogadores, atributos: renderAtributos, arvores: renderArvores,
               ficha: renderFicha, biografia: renderBiografia, inventario: renderInventario, anotacoes: renderAnotacoes }[name];
  fn(c).catch((e) => { c.innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; });
};

window.copyCode = () => { navigator.clipboard?.writeText(mesa.join_code); showMsg('Código copiado.', 'ok'); };
window.openProfile = () => {
  closeUserMenu();
  openProfileModal({
    email: myEmail,
    displayName: myName,
    onSave: async (name) => {
      await db.updateDisplayName(name);
      myName = name;
      $('who').textContent = myName;
      $('nav-av').textContent = myName.trim().charAt(0).toUpperCase() || '?';
      showMsg('Nome atualizado.', 'ok');
    },
  });
};
window.openSettings = () => {
  closeUserMenu();
  openSettingsModal({
    onChangePassword: async (pw) => {
      await db.updatePassword(pw);
      showMsg('Senha atualizada.', 'ok');
    },
  });
};
window.openHelp = () => { closeUserMenu(); openHelpGuide('mesa'); };
window.doToggleTheme = () => { toggleTheme(); paintThemeMenuItem(); };
window.logout = () => { db.signOut().then(() => { location.href = 'login.html'; }); };

// menu combinado do topo: capa/hamburguer (esquerda, navegação da mesa) + conta (direita) — só um aberto por vez
function closeMesaMenu() { $('mesa-menu')?.classList.remove('open'); $('mesa-menu-btn')?.setAttribute('aria-expanded', 'false'); }
function closeUserMenu() { $('nav-user')?.classList.remove('open'); $('nav-user-btn')?.setAttribute('aria-expanded', 'false'); }
window.toggleMesaMenu = () => {
  const el = $('mesa-menu'); if (!el) return;
  const open = el.classList.toggle('open');
  $('mesa-menu-btn')?.setAttribute('aria-expanded', String(open));
  if (open) { closeUserMenu(); el.querySelector('.drop [role="menuitem"]')?.focus(); }
};
window.toggleUserMenu = () => {
  const el = $('nav-user'); if (!el) return;
  const open = el.classList.toggle('open');
  $('nav-user-btn')?.setAttribute('aria-expanded', String(open));
  if (open) { closeMesaMenu(); el.querySelector('.drop [role="menuitem"]')?.focus(); }
};
document.addEventListener('click', (e) => {
  if (!e.target.closest('#mesa-menu')) closeMesaMenu();
  if (!e.target.closest('#nav-user')) closeUserMenu();
});

// Avatar da mesa no topo: foto se houver, senão a inicial do nome.
function paintMesaAvatar() {
  const el = $('mesa-av'); if (!el || !mesa) return;
  el.style.display = '';
  if (mesa.image_url) {
    el.innerHTML = `<img src="${esc(mesa.image_url)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">`;
  } else {
    el.textContent = (mesa.name || '?').trim().charAt(0).toUpperCase() || '?';
  }
}
// Foto de perfil da mesa (só o Mestre altera — botões estão na aba Jogadores).
window.onMesaImg = (input) => {
  const file = input.files && input.files[0]; if (!file) return;
  if (!file.type.startsWith('image/')) { showMsg('Selecione um arquivo de imagem.'); input.value = ''; return; }
  if (file.size > 3 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 3 MB).'); input.value = ''; return; }
  showMsg('Enviando foto…', 'ok');
  db.uploadImage(file, 'campaigns')
    .then((url) => db.updateCampaign(campaignId, { image_url: url }).then(() => {
      mesa.image_url = url;
      const prev = $('mesa-img-prev'); if (prev) { prev.src = url; prev.style.display = ''; }
      const rm = $('mesa-img-rm'); if (rm) rm.style.display = '';
      paintMesaAvatar(); showMsg('Foto da mesa atualizada.', 'ok');
    }))
    .catch((e) => showMsg(e.message));
};
window.removeMesaImg = () => {
  db.updateCampaign(campaignId, { image_url: null }).then(() => {
    mesa.image_url = null;
    const prev = $('mesa-img-prev'); if (prev) { prev.removeAttribute('src'); prev.style.display = 'none'; }
    const rm = $('mesa-img-rm'); if (rm) rm.style.display = 'none';
    paintMesaAvatar(); showMsg('Foto da mesa removida.', 'ok');
  }).catch((e) => showMsg(e.message));
};
window.leaveMesa = async () => {
  const ok = await confirmModal({ title: 'Sair da mesa', desc: `Sua ficha em "${mesa.name}" será apagada. Não dá pra desfazer.`, confirmLabel: 'Sair' });
  if (!ok) return;
  db.leaveCampaign(campaignId).then(() => { location.href = 'app.html'; }).catch((e) => showMsg(e.message));
};

// Ficha de um jogador, somente leitura (visão do Mestre — sem anotações)
let _gmViewUserId = null, _gmViewName = '';
async function viewPlayer(userId, name) {
  const c = $('content');
  c.innerHTML = '<div class="empty">Carregando ficha…</div>';
  _gmViewUserId = userId; _gmViewName = name;
  try {
    let sheet = await db.loadPlayerSheet(campaignId, userId);
    let gmChanged = sheet.character
      ? await resyncClassDefaults(sheet.character.id, sheet.character.char_class, sheet.character.subclass) : false;
    if (sheet.character) { try { const r = await db.applyLevelRewards(sheet.character.id); if (r.stat_points || r.tree_points) gmChanged = true; } catch (_) {} }
    if (gmChanged) sheet = await db.loadPlayerSheet(campaignId, userId); // busca de novo com os valores já atualizados
    const { character, attributes, values, resources, proficiencies, inventory, systemId } = sheet;
    _gmViewChar = character; _gmViewAttrs = attributes; _gmViewValues = { ...values }; _gmViewProficiencies = { ...(proficiencies || {}) }; _gmViewProfCtx = profCtxFrom(_gmViewProficiencies);
    if (!character) { c.innerHTML = `<button class="btn auto sm" onclick="openTab('jogadores')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></span>Voltar aos jogadores</button>
      <div class="empty" style="margin-top:14px">Este jogador ainda não montou a ficha.</div>`; return; }
    try { _gmViewSkillBonus = mergeBonusMaps(bonusMapFrom(await db.getSkillBonuses(campaignId, userId)), equipBonusMap(inventory, attributes)); }
    catch (_) { _gmViewSkillBonus = equipBonusMap(inventory, attributes); }
    const trees = systemId ? await db.listSystemTrees(systemId).catch(() => []) : [];
    const treeRows = await Promise.all(trees.map(async (t) => {
      let pts = 0;
      try { pts = await db.getTreePoints(t.id, userId); } catch (_) {}
      return { tree: t, pts };
    }));

    const gmResBar = (a) => {
      const max = evalStatIn(attributes, values, a, _gmViewSkillBonus, new Set(), _gmViewProfCtx) ?? 0;
      let cur = resources?.[a.id]; if (cur == null || cur === '') cur = max; cur = Number(cur);
      return `<div class="res-row" style="--res-color:${esc(a.color || '#35c6d4')}">
        <div class="res-head">
          <span class="res-label"><i class="res-dot"></i>${esc(a.name)}</span>
          <span class="res-amt-line"><b>${cur}</b>&nbsp;/&nbsp;${max}</span>
        </div>
        <div class="res-bar-row"><div class="res-track">${resBarHtml(cur, max)}</div></div>
      </div>`;
    };
    const primaries = attributes.filter((a) => a.is_resource);
    const gmSkills = sys?.system?.skills_enabled ? attributes.filter((a) => a.is_skill) : [];
    const secondary = attributes.filter((a) => !a.is_resource && !a.is_skill);
    const hasBaseSec = secondary.some((a) => a.kind === 'base');

    c.innerHTML = `
      <button class="btn auto sm" onclick="openTab('jogadores')"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></svg></span>Voltar aos jogadores</button>
      <div class="section-title" style="margin-top:18px">Ficha de ${esc(name)}</div>
      <div class="char-card">
        ${character.avatar_url ? `<img class="char-portrait" src="${esc(character.avatar_url)}" alt="">`
          : `<div class="char-portrait ph">${esc((character.name || '?').trim().charAt(0).toUpperCase() || '?')}</div>`}
        <div class="char-info"><h2>${esc(character.name) || 'Sem nome'}</h2>
          <div class="char-meta">${[character.age && ('Idade: ' + esc(character.age)), character.gender && esc(character.gender),
            character.char_class && (esc(character.char_class) + (character.subclass ? ' · ' + esc(character.subclass) : ''))].filter(Boolean).join(' &nbsp;·&nbsp; ') || '—'}</div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
            <span class="badge" style="border-color:var(--brass);color:var(--brass)">Nível ${character.level || 1}</span>
            <button class="plus" title="Tira 1 nível" onclick="gmAdjustLevel(-1)">−</button>
            <button class="plus" title="Sobe 1 nível (concede os pontos configurados)" onclick="gmAdjustLevel(1)">+</button>
          </div>
        </div>
      </div>
      ${(() => {
        const prose = (label, val) => val ? `<div class="fld"><label>${label}</label><p style="font-size:14px;color:var(--ink-dim);line-height:1.6;margin:0">${esc(val)}</p></div>` : '';
        return prose('Bio', character.bio) + prose('Aparência física', character.appearance) + prose('Naturalidade / origem', character.origin)
          + prose('Traços de personalidade', character.personality) + prose('Ideais e motivações', character.ideals)
          + prose('Vínculos', character.bonds) + prose('Defeitos e medos', character.flaws);
      })()}

      <div class="status-hud">
        ${primaries.length ? `<div class="hud-sec-label">Recursos<span class="ln"></span></div>
          <div class="hud-bars">${primaries.map(gmResBar).join('')}</div>` : ''}
        <div class="hud-sec-label">Status${secondary.length ? '' : ' — o sistema não tem'}<span class="ln"></span></div>
        <div class="stat-grid">
          ${secondary.map((a) => gmStatRow(a)).join('')}
          ${secondary.length ? '' : '<div class="empty" style="grid-column:1/-1">Sem status secundários.</div>'}
        </div>
        ${hasBaseSec ? `<div class="points-card" style="margin-top:14px">
          <div class="hud-sec-label">Pontos de status do jogador<span class="ln"></span></div>
          <div style="display:flex;align-items:center;gap:14px;margin-top:4px">
            <button class="plus" title="Tirar 1 ponto" onclick="gmAdjustPoints(-1)">−</button>
            <span class="points-value" id="gm-points-badge" style="margin:0">${character.stat_points || 0}</span>
            <button class="plus" title="Dar 1 ponto" onclick="gmAdjustPoints(1)">+</button>
          </div>
        </div>` : ''}
        ${gmSkills.length ? `<div class="hud-sec-label" style="margin-top:18px">Perícias<span class="ln"></span></div>
        <div class="skill-grid">${gmSkills.map(gmSkillChip).join('')}</div>` : ''}
        ${sys?.proficiencies?.length ? `<div class="hud-sec-label" style="margin-top:18px">Proficiências <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(clique pra conceder/revogar)</span><span class="ln"></span></div>
        <div class="prof-groups">${profChipsHtml(_gmViewProficiencies, true)}</div>` : ''}
      </div>

      ${trees.length ? `
      <div class="section-title">Pontos de árvore de habilidade</div>
      <div class="list">${treeRows.map(({ tree, pts }) => `
        <div class="list-row"><div class="grow"><div class="nm">${esc(tree.name)}</div></div>
          <input type="number" min="0" id="gm-treepts-${tree.id}" value="${pts}" style="max-width:70px;background:var(--field);border:1px solid var(--line2);border-radius:9px;color:var(--ink);font-family:var(--mono);padding:7px">
          <button class="btn sm auto" onclick="gmSetTreePoints('${tree.id}','${userId}')">Definir</button>
        </div>`).join('')}</div>` : ''}

      <div class="section-title">Mochila</div>
      <div class="list">${inventory.length ? inventory.map((it) => `
        <div class="list-row"><div class="grow"><div class="nm">${esc(it.name)}${it.equipped ? ' <span class="badge" style="border-color:var(--maq);color:var(--maq)">equipado</span>' : ''}</div>
          ${it.description ? `<div class="sub">${esc(it.description)}</div>` : ''}
          ${(it.modifiers || []).length ? `<div class="mods" style="margin-top:5px">${it.modifiers.map((m) => `<span class="badge mod">${esc(m.name)} ${esc(m.value)}</span>`).join('')}</div>` : ''}</div>
          <div class="sub">x${it.qty}</div></div>`).join('')
        : '<div class="empty">Mochila vazia.</div>'}</div>
      <p style="font-family:var(--mono);font-size:10px;color:var(--ink-faint);margin:16px 2px 0">As anotações do jogador são privadas e não aparecem aqui.</p>`;
  } catch (e) { c.innerHTML = '<div class="empty">Erro: ' + esc(e.message) + '</div>'; }
}
window.viewPlayer = viewPlayer;

function gmStatRow(a) {
  if (a.kind === 'computed') {
    const v = evalStatIn(_gmViewAttrs, _gmViewValues, a, _gmViewSkillBonus, new Set(), _gmViewProfCtx);
    return `<div class="stat-tile computed" style="--stc:${esc(a.color || '#7ee6dc')}"><div class="stat-val calc">${v == null ? ICONS.warning : v}</div><div class="stat-name">${esc(a.name)}</div></div>`;
  }
  const val = _gmViewValues[a.id] ?? a.default_value ?? 0;
  const bonus = _gmViewSkillBonus[a.id];
  return `<div class="stat-tile" style="--stc:${esc(a.color || '#7ee6dc')}">
    ${bonus ? `<span class="mod-badge" title="${esc(bonusTitle(bonus))}">+${bonus.total}</span>` : ''}
    <div class="stat-val" id="gmval-${a.id}">${esc(val)}</div>
    <div class="stat-name">${esc(a.name)}</div>
    <div class="stat-ctl">
      <button class="plus" title="Tira 1 e devolve o ponto pro jogador" onclick="gmAdjustStat('${a.id}', -1, true)">−</button>
      <button class="plus" title="Sobe 1 direto (não gasta ponto)" onclick="gmAdjustStat('${a.id}', 1, false)">+</button>
    </div>
  </div>`;
}
function gmSkillChip(a) {
  const v = evalStatIn(_gmViewAttrs, _gmViewValues, a, _gmViewSkillBonus, new Set(), _gmViewProfCtx);
  return `<div class="skill-chip" style="--skc:${esc(a.color || '#7ee6dc')}">
    <span class="skc-name">${esc(a.name)}</span>
    <span class="skc-val">${v == null ? ICONS.warning : v}</span>
  </div>`;
}
window.gmSetTreePoints = (treeId, userId) => {
  const el = $('gm-treepts-' + treeId); if (!el) return;
  const val = Math.max(0, parseInt(el.value) || 0);
  db.setTreePoints(treeId, userId, val).then(() => showMsg('Pontos atualizados.')).catch((e) => showMsg(e.message));
};
window.gmAdjustPoints = (delta) => {
  if (!_gmViewChar) return;
  const next = Math.max(0, (_gmViewChar.stat_points || 0) + delta);
  db.updateCharacter(_gmViewChar.id, { stat_points: next }).then(() => {
    _gmViewChar.stat_points = next;
    const b = $('gm-points-badge'); if (b) b.textContent = next;
    showMsg('Pontos de status atualizados.', 'ok');
  }).catch((e) => showMsg(e.message));
};
// subir de nível concede (via RPC) os pontos de status + de árvore configurados na Progressão de
// nível do sistema — nunca retroage se o nível cair (só corrige o número, não tira pontos já dados).
window.gmAdjustLevel = (delta) => {
  if (!_gmViewChar) return;
  const next = Math.max(1, (_gmViewChar.level || 1) + delta);
  db.updateCharacter(_gmViewChar.id, { level: next }).then(async () => {
    _gmViewChar.level = next;
    let r = { stat_points: 0, tree_points: 0 };
    if (delta > 0) { try { r = await db.applyLevelRewards(_gmViewChar.id); } catch (_) {} }
    const parts = [];
    if (r.stat_points) parts.push(`+${r.stat_points} ponto(s) de status`);
    if (r.tree_points) parts.push(`+${r.tree_points} ponto(s) de árvore`);
    showMsg(parts.length ? `Nível ${next}! ${parts.join(', ')}.` : `Nível atualizado para ${next}.`, 'ok');
    viewPlayer(_gmViewUserId, _gmViewName);
  }).catch((e) => showMsg(e.message));
};
window.gmAdjustStat = (statId, delta, giveBackPoint) => {
  if (!_gmViewChar) return;
  const stat = _gmViewAttrs.find((a) => a.id === statId); if (!stat) return;
  const cur = Number(_gmViewValues[statId] ?? stat.default_value ?? 0) || 0;
  const next = Math.max(0, cur + delta);
  const ops = [db.setCharacterAttribute(_gmViewChar.id, statId, next)];
  if (giveBackPoint) ops.push(db.updateCharacter(_gmViewChar.id, { stat_points: (_gmViewChar.stat_points || 0) + 1 }));
  Promise.all(ops).then(() => {
    _gmViewValues[statId] = next;
    const el = $('gmval-' + statId); if (el) el.textContent = next;
    if (giveBackPoint) {
      _gmViewChar.stat_points = (_gmViewChar.stat_points || 0) + 1;
      const b = $('gm-points-badge'); if (b) b.textContent = _gmViewChar.stat_points;
    }
    showMsg('Status ajustado.', 'ok');
  }).catch((e) => showMsg(e.message));
};
window.gmToggleProficiency = (proficiencyId, granted) => {
  if (!_gmViewChar) return;
  db.gmSetProficiency(_gmViewChar.id, proficiencyId, granted).then(() => {
    _gmViewProficiencies[proficiencyId] = granted;
    viewPlayer(_gmViewUserId, _gmViewName);
    showMsg(granted ? 'Proficiência concedida.' : 'Proficiência revogada.', 'ok');
  }).catch((e) => showMsg(e.message));
};

// Visão do sistema usado pela mesa (Mestre): status, classes, árvores e itens — vindos do sistema.

        <div class="sub">${s.kind === 'computed' ? 'calculado: ' + esc(s.formula || '') : 'base' + (s.default_value ? ' · padrão ' + esc(s.default_value) : '')}</div></div></div>`).join('') : '<div class="empty">Sem status.</div>'}</div>

function profCategoryIcon(cat) {
  const s = (cat || '').toLowerCase();
  if (/armadura|armor|escudo|shield/.test(s)) return ICONS.shield;
  if (/arma\b|armas|weapon|espada|arco|machado|lança|adaga/.test(s)) return ICONS.dagger;

  if (/medicina|cura|heal|medic|primeiros socorros/.test(s)) return ICONS.heart;

// arrastar a foto de capa pra escolher qual parte fica visível (salva o foco vertical em % no solto)
function wireCoverDrag() {
  const img = $('char-cover-img'); if (!img) return;
  const box = img.closest('.char-cover'); if (!box) return;
  let dragging = false, startY = 0, startFocal = 50, boxHeight = 1;
  const onMove = (e) => {
    if (!dragging) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const next = Math.max(0, Math.min(100, startFocal - ((y - startY) / boxHeight) * 100));
    img.style.objectPosition = `center ${next.toFixed(1)}%`;
    img.dataset.focal = next;
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    img.classList.remove('dragging');
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    const finalFocal = Number(img.dataset.focal);
    if (!Number.isNaN(finalFocal) && character) {
      db.updateCharacter(character.id, { cover_focal_y: finalFocal })
        .then((updated) => { character = { ...character, ...updated }; showMsg('Posição da capa salva.', 'ok'); })
        .catch((e) => showMsg(e.message));
    }
  };
  img.addEventListener('pointerdown', (e) => {
    if (!box.classList.contains('editing')) return; // reposicionar só é permitido depois de "Editar capa"
    dragging = true;
    startY = e.clientY;
    startFocal = Number(img.dataset.focal) || 50;
    boxHeight = box.getBoundingClientRect().height || 1;
    img.classList.add('dragging');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    e.preventDefault();
  });
}

    _statMap = map;
    _diceStats = attributes.filter((a) => a.formula_key).map((a) => ({ name: a.name, key: a.formula_key.trim(), value: map[a.formula_key.trim()] }));
    const formulas = await db.listCharacterFormulas(ch.id);

  sel.style.display = '';
  sel.innerHTML = type === 'stat'
    ? (_diceStats.map((s) => `<option value="${esc(s.key)}">${esc(s.name)} (${s.value})</option>`).join('') || '<option value="">— sem status —</option>')
    : (_diceFormulas.map((f) => `<option value="${f.id}">${esc(f.name)} (${f.total})</option>`).join('') || '<option value="">— sem fórmulas —</option>');
};
window.rollBuilder = () => {
  const qty = Math.min(20, Math.max(1, parseInt($('dice-qty').value) || 1));
  const die = $('dice-die').value;
  const modType = $('dice-mod-type')?.value || '';
  const modRef = $('dice-mod-ref')?.value;
  let formula = qty + die, label = null;
  if (modType === 'stat' && modRef) {
    formula += '+' + modRef;
    const s = _diceStats.find((x) => x.key === modRef); label = s ? s.name : null;
  } else if (modType === 'formula' && modRef) {
    const f = _diceFormulas.find((x) => x.id === modRef);
    if (f) { formula += '+' + f.total; label = f.name; }
  }
  doRoll(formula, label);
};

function rollFormula(input, statMap) {
  const f = (input || '').trim(); if (!f) throw new Error('Digite uma fórmula (ex.: 1d20+3).');
  const re = /([+\-]?)\s*(\d*d\d+|\d+\.?\d*|[A-Za-zÀ-ú_][A-Za-zÀ-ú0-9_]*)/gi;
  let m, total = 0, parts = [], count = 0;
  while ((m = re.exec(f))) {
    count++; const sign = m[1] === '-' ? -1 : 1; const term = m[2];
    const dm = /^(\d*)d(\d+)$/i.exec(term);
    if (dm) {
      const n = Math.min(Math.max(parseInt(dm[1] || '1'), 1), 100), faces = parseInt(dm[2]);
      if (faces < 1) throw new Error('Dado inválido: ' + term);
      const rolls = []; for (let i = 0; i < n; i++) rolls.push(1 + Math.floor(Math.random() * faces));
      total += sign * rolls.reduce((a, b) => a + b, 0);
      parts.push({ sign, text: `${n}d${faces}[${rolls.join(', ')}]` });
    } else if (/^[A-Za-zÀ-ú_]/.test(term)) {
      const v = Number(statMap[term.trim()]); if (isNaN(v)) throw new Error(`"${term}" não é um status seu`);
      total += sign * v; parts.push({ sign, text: `${term}(${v})` });
    } else { const v = Number(term); total += sign * v; parts.push({ sign, text: `${v}` }); }
  }
  if (!count) throw new Error('Fórmula inválida.');
  const detail = parts.map((p, i) => (i === 0 ? (p.sign < 0 ? '−' : '') : (p.sign < 0 ? ' − ' : ' + ')) + p.text).join('');
  return { total: Math.round(total * 100) / 100, detail };
}
function doRoll(f, label) {
  try { const { total, detail } = rollFormula(f, _statMap || {});
    const finalDetail = label ? `${detail} (${label})` : detail;
    // no bloco da rolagem quem aparece é o personagem, não a conta — o Mestre não tem
    // personagem nesta mesa, então continua caindo no nome de perfil (fallback do addRoll)
    const rollerName = (role === 'player' && character && character.name) ? character.name : undefined;
    db.addRoll(campaignId, { formula: f, detail: finalDetail, total, is_private: false, rollerName }).then(addRollToLog).catch((e) => showMsg(e.message));
  } catch (e) { showMsg(e.message); }
}

// pillar III (§4.3): heurística visual pra nat-max/nat-min — lê os grupos de dado embutidos no
// `detail` (ex.: "1d20[20]") sem precisar de coluna nova no banco; não afeta o total, só a ênfase
function rollExtremity(detail) {
  const re = /(\d+)d(\d+)\[([\d,\s]+)\]/g;
  let m, sawDie = false, allMax = true, allMin = true;
  while ((m = re.exec(detail || ''))) {
    const faces = parseInt(m[2]);
    m[3].split(',').forEach((s) => { const v = parseInt(s.trim()); sawDie = true; if (v !== faces) allMax = false; if (v !== 1) allMin = false; });
  }
  if (!sawDie) return null;
  if (allMax) return 'max';
  if (allMin) return 'min';
  return null;
}
function rollEl(r, justLanded) {
  const mine = r.user_id === myId;
  const when = new Date(r.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const extremity = rollExtremity(r.detail);
  const critClass = extremity === 'max' ? ' crit-max' : extremity === 'min' ? ' crit-min' : '';
  const critLabel = extremity === 'max' ? 'Crítico natural' : extremity === 'min' ? 'Falha crítica' : '';
  const critTagHtml = critLabel ? `<span class="crit-tag ${extremity}">${critLabel}</span>` : '';
  const div = document.createElement('div');
  // .mine (§3.2) é persistente; .landing (§4.3) é um tier-2 único aplicado só quando a rolagem
  // acabou de chegar — renderRolls (carga inicial do log) não passa justLanded de propósito
  div.className = 'roll' + (mine ? ' mine' : '') + (r.is_private ? ' secret' : '') + (justLanded ? ' landing' : '');
  div.setAttribute('data-id', r.id);
  div.innerHTML = `<div class="rtop"><span class="who">${esc(r.roller_name || '—')}${r.is_private ? ` <span class="ic">${ICONS.lock}</span>` : ''}</span><span class="ftxt">${esc(r.formula)} · ${when}</span></div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><span class="tot${critClass}">${r.total ?? '—'}</span>${critTagHtml}<span class="det">${esc(r.detail || '')}</span></div>`;
  if (justLanded) div.addEventListener('animationend', () => div.classList.remove('landing'), { once: true });
  return div;
}
function renderRolls(rolls) {
  const log = $('dice-log'); if (!log) return; log.innerHTML = '';
  if (!rolls.length) { log.innerHTML = '<div class="empty" style="border:0">Sem rolagens ainda.</div>'; return; }
  rolls.forEach((r) => log.appendChild(rollEl(r)));   // desc + column-reverse => mais recente embaixo
}
function addRollToLog(r) {
  const log = $('dice-log'); if (!log) return;
  if (log.querySelector(`[data-id="${r.id}"]`)) return;   // evita duplicar (realtime + eco local)
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  log.insertBefore(rollEl(r, true), log.firstChild);
}

/* ============================ CHAT DA MESA (aba "Conversa" ao lado das rolagens) ============================ */
window.sendChatMsg = (ev) => {
  ev.preventDefault();
  const input = $('chat-input'); const text = input.value.trim();
  if (!text) return false;
  input.value = '';
  db.addMessage(campaignId, text).then(addMsgToLog).then(() => selectRailTab('chat')).catch((e) => showMsg(e.message));
  return false;
};
function msgEl(m, justLanded) {
  const mine = m.user_id === myId;
  const when = new Date(m.created_at).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'chat-msg' + (mine ? ' mine' : '') + (justLanded ? ' landing' : '');
  div.setAttribute('data-id', m.id);
  div.innerHTML = `<div class="ctop"><span class="who">${esc(m.sender_name || '—')}</span><span class="cwhen">${when}</span></div>
    <div class="cbody">${esc(m.body)}</div>`;
  if (justLanded) div.addEventListener('animationend', () => div.classList.remove('landing'), { once: true });
  return div;
}
function renderChat(msgs) {
  const log = $('chat-log'); if (!log) return; log.innerHTML = '';
  if (!msgs.length) { log.innerHTML = '<div class="empty" style="border:0">Sem mensagens ainda.</div>'; return; }
  msgs.forEach((m) => log.appendChild(msgEl(m)));   // desc + column-reverse => mais recente embaixo
}
function addMsgToLog(m) {
  const log = $('chat-log'); if (!log) return;
  if (log.querySelector(`[data-id="${m.id}"]`)) return;   // evita duplicar (realtime + eco local)
  const empty = log.querySelector('.empty'); if (empty) empty.remove();
  log.insertBefore(msgEl(m, true), log.firstChild);
}
