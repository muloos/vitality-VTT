// modal de confirmação estilizado (mesmo padrão visual do guia) — substitui confirm() nativo
function confirmModal({ title, desc, confirmLabel = 'Confirmar', danger = true } = {}) {
  return new Promise((resolve) => {
    const trigger = document.activeElement;
    const w = document.createElement('div');
    w.className = 'ui-modal';
    w.setAttribute('role', 'alertdialog');
    w.setAttribute('aria-modal', 'true');
    w.setAttribute('aria-labelledby', 'confirm-title');
    w.innerHTML = `<div class="box guide">
      <div class="ghead"><h3 id="confirm-title">${esc(title)}</h3><button class="x" aria-label="Fechar">×</button></div>
      <p class="gintro">${esc(desc)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn auto" id="cm-cancel">Cancelar</button>
        <button class="btn auto ${danger ? 'danger' : 'go'}" id="cm-ok">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    const finish = (result) => { w.remove(); document.removeEventListener('keydown', onEsc); if (trigger && trigger.focus) trigger.focus(); resolve(result); };
    const onEsc = (e) => { if (e.key === 'Escape') finish(false); };
    w.addEventListener('click', (e) => { if (e.target === w) finish(false); });
    w.querySelector('.x').onclick = () => finish(false);
    w.querySelector('#cm-cancel').onclick = () => finish(false);
    w.querySelector('#cm-ok').onclick = () => finish(true);
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(w);
    w.querySelector('#cm-ok').focus();
  });
}
// seletor de cor próprio — um color picker de verdade (quadrado de saturação/brilho + barra de
// matiz arrastáveis + hex + atalhos de paleta), substitui <input type="color"> nativo do navegador.
// openColorPicker(botãoGatilho, corAtual, (novaCor)=>...) — chama onPick a cada mudança (igual o
// oninput do color picker nativo), pro chamador poder ter preview ao vivo se quiser.
const COLOR_PRESETS = ['#f2585e','#fb923c','#f5b93d','#eab308','#84cc16','#22c55e','#3ecf7e','#10b981',
  '#14b8a6','#35c6d4','#18b5c6','#0ea5e9','#3b82f6','#6366f1','#8b5cf6','#a855f7',
  '#d946ef','#ec4899','#e9edf1','#93a0ab','#5c6771','#7ee6dc'];
function hexToHsv(hex) {
  hex = (hex || '#7ee6dc').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
  const r = parseInt(hex.slice(0, 2), 16) / 255 || 0, g = parseInt(hex.slice(2, 4), 16) / 255 || 0, b = parseInt(hex.slice(4, 6), 16) / 255 || 0;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: max === 0 ? 0 : d / max, v: max };
}
function hsvToHex(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}
let _colorPop = null;
function closeColorPicker() {

  document.removeEventListener('mousedown', _cpOutside, true);
  document.removeEventListener('keydown', _cpEsc);
}
function _cpOutside(e) { if (_colorPop && !_colorPop.contains(e.target)) closeColorPicker(); }
function _cpEsc(e) { if (e.key === 'Escape') closeColorPicker(); }
window.openColorPicker = (trigger, current, onPick) => {
  closeColorPicker();
  const state = hexToHsv(current);
  const pop = document.createElement('div');
  pop.className = 'color-pop';
  pop.innerHTML = `
    <div class="cp-sv" id="cp-sv"><div class="cp-sv-cursor" id="cp-sv-cursor"></div></div>
    <div class="cp-hue" id="cp-hue"><div class="cp-hue-cursor" id="cp-hue-cursor"></div></div>
    <div class="cp-bottom">
      <span class="cp-preview" id="cp-preview"></span>
      <input type="text" class="cp-hex" id="cp-hex" maxlength="7">
    </div>
    <div class="cp-grid">${COLOR_PRESETS.map((c) => `<button type="button" class="cp-swatch" style="--sw:${c}" data-c="${c}" title="${c}"></button>`).join('')}</div>`;
  document.body.appendChild(pop);

  const svEl = pop.querySelector('#cp-sv'), svCur = pop.querySelector('#cp-sv-cursor');
  const hueEl = pop.querySelector('#cp-hue'), hueCur = pop.querySelector('#cp-hue-cursor');
  const preview = pop.querySelector('#cp-preview'), hexInput = pop.querySelector('#cp-hex');

  function render() {
    svEl.style.setProperty('--h', state.h);
    svCur.style.left = (state.s * svEl.clientWidth) + 'px';
    svCur.style.top = ((1 - state.v) * svEl.clientHeight) + 'px';
    hueCur.style.left = (state.h / 360 * hueEl.clientWidth) + 'px';
    const hex = hsvToHex(state.h, state.s, state.v);
    preview.style.setProperty('--sw', hex);
    hexInput.value = hex;
    trigger.style.setProperty('--sw', hex);
    onPick(hex);
  }
  function dragSV(e) {
    const r = svEl.getBoundingClientRect();
    state.s = Math.min(Math.max(0, e.clientX - r.left), r.width) / r.width;
    state.v = 1 - Math.min(Math.max(0, e.clientY - r.top), r.height) / r.height;
    render();
  }
  function dragHue(e) {
    const r = hueEl.getBoundingClientRect();
    state.h = Math.min(Math.max(0, e.clientX - r.left), r.width) / r.width * 360;
    render();
  }
  svEl.addEventListener('pointerdown', (e) => {
    svEl.setPointerCapture(e.pointerId); dragSV(e);
    const mv = (ev) => dragSV(ev), up = () => { svEl.removeEventListener('pointermove', mv); svEl.removeEventListener('pointerup', up); };
    svEl.addEventListener('pointermove', mv); svEl.addEventListener('pointerup', up);
  });
  hueEl.addEventListener('pointerdown', (e) => {
    hueEl.setPointerCapture(e.pointerId); dragHue(e);
    const mv = (ev) => dragHue(ev), up = () => { hueEl.removeEventListener('pointermove', mv); hueEl.removeEventListener('pointerup', up); };
    hueEl.addEventListener('pointermove', mv); hueEl.addEventListener('pointerup', up);
  });
  pop.querySelectorAll('.cp-swatch').forEach((b) => {
    b.onclick = () => { const hsv = hexToHsv(b.dataset.c); state.h = hsv.h; state.s = hsv.s; state.v = hsv.v; render(); };
  });
  hexInput.addEventListener('change', () => {
    const v = hexInput.value.trim();
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { const hsv = hexToHsv(v); state.h = hsv.h; state.s = hsv.s; state.v = hsv.v; render(); }
  });

  const r = trigger.getBoundingClientRect();
  let left = r.left, top = r.bottom + 6;
  if (left + pop.offsetWidth > window.innerWidth - 8) left = window.innerWidth - pop.offsetWidth - 8;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = r.top - pop.offsetHeight - 6;
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = Math.max(8, top) + 'px';
  _colorPop = pop;
  render();
  setTimeout(() => {
    document.addEventListener('mousedown', _cpOutside, true);
    document.addEventListener('keydown', _cpEsc);
  }, 0);
};

// deriva ícone + cor de uma categoria de proficiência a partir do texto — sem precisar de campo
// novo no banco (categoria continua sendo texto livre). Cobre os tipos mais comuns por palavra-
// chave; qualquer nome fora disso cai num ícone genérico + cor gerada por hash do próprio texto
// (estável pra cada categoria, sem precisar o Mestre escolher uma cor manualmente).
function profCategoryIcon(cat) {
  const s = (cat || '').toLowerCase();
  if (/armadura|armor|escudo|shield/.test(s)) return ICONS.shield;
  if (/arma\b|armas|weapon|espada|arco|machado|lança|adaga/.test(s)) return ICONS.dagger;
  if (/idioma|língua|lingua|language/.test(s)) return ICONS.chat;
  if (/ofício|oficio|ferramenta|tool|craft|artesanato/.test(s)) return ICONS.hammer;
  if (/medicina|cura|heal|medic|primeiros socorros/.test(s)) return ICONS.heart;
  if (/perícia|pericia|skill|saving|resistência|resistencia/.test(s)) return ICONS.target;
  return ICONS.checklist;
}
function profCategoryColor(cat) {
  if (!cat) return '#8a95a1';
  let h = 0; for (let i = 0; i < cat.length; i++) h = (h * 31 + cat.charCodeAt(i)) >>> 0;
  return `hsl(${h % 360} 58% 58%)`;
}

/* ---------- avaliador de fórmula ---------- */
// procura primeiro nos Status/Perícias; se não achar, procura nas Proficiências com nome na
// fórmula (vira um pseudo-status "base" fixo em 1/0 — é assim que uma fórmula pode checar
// "o personagem tem essa proficiência?" sem precisar de um caminho de avaliação separado)
const statByKey = (key) => {
  const k = key.trim();
  const s = _statusStats.find((x) => (x.formula_key || '').trim() === k);
  if (s) return s;
  const p = _profsCache.find((x) => (x.formula_key || '').trim() === k);
  return p ? { id: 'prof:' + p.id, name: p.name, kind: 'base', formula_key: p.formula_key, default_value: '0', is_proficiency: true } : undefined;
};
// calcula o valor de um status; base = usa o valor de teste; calculado = resolve a fórmula
function computeStat(stat, baseVals, seen = new Set()) {
  if (stat.kind !== 'computed') {
    const raw = baseVals[(stat.formula_key || '').trim()];
    const n = Number(raw);
    if (raw === undefined || raw === '' || isNaN(n)) throw new Error(`"${stat.formula_key || stat.name}" sem valor`);
    return n;
  }
  if (seen.has(stat.id)) throw new Error('referência circular');
  const seen2 = new Set(seen); seen2.add(stat.id);
  const tokens = (stat.formula || '').match(/[A-Za-zÀ-ú_][A-Za-zÀ-ú0-9_]*|\d+\.?\d*|[+\-*/()]/g) || [];
  if (!tokens.length) throw new Error('fórmula vazia');
  const expr = tokens.map((tok) => {
    if (/^[\d.]/.test(tok) || /^[+\-*/()]$/.test(tok)) return tok;
    const ref = statByKey(tok);
    if (!ref) throw new Error(`"${tok}" não é um status`);
    return '(' + computeStat(ref, baseVals, seen2) + ')';
  }).join(' ');
  if (!/^[\d+\-*/().\s]*$/.test(expr)) throw new Error('fórmula inválida');
  let r; try { r = Function('"use strict";return (' + expr + ')')(); } catch (_) { throw new Error('fórmula inválida'); }
  if (!isFinite(r)) throw new Error('divisão por zero?');
  return Math.round(r * 1000) / 1000;
}

/* ===================== ITENS ===================== */
let _sysItems = [];
let _sysStats = []; // status do sistema — alimenta os seletores "Escala com" (só existe aqui dentro)
let _siImgUrl = null, _siImgFile = null; // imagem do item do sistema em edição
const statKey = (s) => s.formula_key || s.name;
const statLabel = (key) => _sysStats.find((s) => statKey(s) === key)?.name || key;
function statOptionsHtml(selected) {
  return '<option value="">— nenhum —</option>' + _sysStats.map((s) => {
    const key = statKey(s);
    return `<option value="${esc(key)}" ${selected === key ? 'selected' : ''}>${esc(s.name)}</option>`;
  }).join('');
}
let _sysProfs = [];
const profLabel = (id) => _sysProfs.find((p) => p.id === id)?.name || '';
function profOptionsHtml(selected) {
  return '<option value="">— nenhuma —</option>' + _sysProfs.map((p) =>
    `<option value="${esc(p.id)}" ${selected === p.id ? 'selected' : ''}>${esc(p.name)}${p.category ? ' (' + esc(p.category) + ')' : ''}</option>`
  ).join('');
}
async function renderItens(c) {
  const [inSystem, library, stats, profs] = await Promise.all([db.listSystemItems(systemId), db.listItems(), db.listStats(systemId), db.listProficiencies(systemId)]);
  _sysItems = inSystem;
  _sysStats = stats;
  _sysProfs = profs;
  const usedSources = new Set(inSystem.map((i) => i.source_item_id).filter(Boolean));
  const avail = library.filter((i) => !usedSources.has(i.id));
  const badges = (it) => `${it.rarity ? `<span class="badge r-${esc((it.rarity||'').toLowerCase())}">${esc(it.rarity)}</span>` : ''}${it.category ? `<span class="badge cat">${esc(it.category)}</span>` : ''}${it.weapon_damage ? `<span class="badge mod">Dano ${esc(it.weapon_damage)}${it.damage_scale ? ' · ' + esc(statLabel(it.damage_scale)) : ''}</span>` : ''}${(it.protection != null && it.protection !== '') ? `<span class="badge mod">Proteção ${esc(String(it.protection))}${it.protection_scale ? ' · ' + esc(statLabel(it.protection_scale)) : ''}</span>` : ''}${it.proficiency_id ? `<span class="badge" style="border-color:var(--brass);color:var(--brass)"><span class="ic">${ICONS.checklist}</span>${esc(profLabel(it.proficiency_id))}</span>` : ''}`;
  c.innerHTML = `
    <div class="section-title">Itens do sistema (${inSystem.length})</div>
    <p style="font-family:var(--mono);font-size:10px;color:var(--ink-faint);line-height:1.6;margin:0 0 12px">
      Itens aqui são <b>cópias do sistema</b> — editá-los NÃO altera o item original da sua biblioteca.</p>
    <button class="btn go auto sm" onclick="openSysItem()">+ Criar item no sistema</button>

    <div id="sysitem-editor" class="surface" style="display:none;margin-top:14px"></div>

    <div class="list" style="margin-top:14px">${inSystem.length ? inSystem.map((it) => `
      <div class="list-row">
        ${it.image_url ? `<img class="item-thumb" src="${esc(it.image_url)}" alt="" loading="lazy">` : ''}
        <div class="grow"><div class="nm">${esc(it.name)}</div>
          <div class="sub" style="display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:4px">${badges(it)}
            ${(it.modifiers||[]).map((m)=>`<span class="badge mod">${esc(m.name)} ${esc(m.value)}</span>`).join('')}
            ${it.source_item_id ? '<span class="badge" style="color:var(--ink-faint)">da biblioteca</span>' : ''}</div></div>
        <button class="btn sm auto" onclick="openSysItem('${it.id}')">Editar</button>
        <button class="btn sm danger auto" onclick="rmSysItem('${it.id}')"><span class="ic">${ICONS.x}</span></button>
      </div>`).join('') : emptyState(ICONS.bag, 'Nenhum item no sistema',
        'Crie itens direto no sistema ou copie da sua biblioteca — eles ficam disponíveis pros jogadores das mesas.',
        '<button class="btn go auto sm" onclick="openSysItem()">+ Criar item no sistema</button>')}</div>

    <div class="section-title">Adicionar da sua biblioteca</div>
    <div class="list">${avail.length ? avail.map((it) => `
      <div class="list-row"><div class="grow"><div class="nm">${esc(it.name)}</div>
        <div class="sub">${[it.category,it.rarity].filter(Boolean).map(esc).join(' · ')}</div></div>
        <button class="btn sm auto" onclick="addLibItem('${it.id}')">Copiar p/ sistema</button></div>`).join('')
      : '<div class="empty">Nada novo na biblioteca (ou tudo já foi copiado).</div>'}</div>

    <datalist id="stat-keys">${stats.map((s)=>`<option value="${esc(s.formula_key||s.name)}">${esc(s.name)}</option>`).join('')}</datalist>`;
}
window.openSysItem = (id = null) => {
  const it = id ? _sysItems.find((x) => x.id === id) : null;
  const box = $('sysitem-editor'); box.dataset.editing = id || '';
  box.innerHTML = `
    <h4 style="font-family:var(--disp);font-size:15px;color:var(--bone);margin:0 0 14px">${id ? 'Editar item do sistema' : 'Novo item do sistema'}</h4>
    <div class="item-form">
      <div class="fld"><label>Nome</label><input id="si-name" maxlength="80" value="${esc(it?.name||'')}"></div>
      <div class="fld"><label>Categoria</label><select id="si-cat" class="fld-input" onchange="updateSiCategoryFields()">${CATEGORIES.map((x)=>`<option ${it&&it.category===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="fld"><label>Raridade</label><select id="si-rar" class="fld-input">${RARITIES.map((x)=>`<option ${it&&it.rarity===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="fld"><label>Proficiência necessária <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(opcional)</span></label>
        <select id="si-prof" class="fld-input">${profOptionsHtml(it?.proficiency_id || '')}</select></div>

      <div class="fld" id="si-damage-fld" style="display:none">
        <label>Dano <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(fórmula, ex.: 1d8+2)</span></label>
        <input id="si-damage" value="${esc(it?.weapon_damage||'')}" placeholder="Ex.: 1d8+2" aria-describedby="si-damage-err">
        <div class="fld-err" id="si-damage-err"></div>
      </div>
      <div class="fld" id="si-damage-scale-fld" style="display:none">
        <label>Escala com <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(opcional — status deste sistema)</span></label>
        <select id="si-damage-scale" class="fld-input">${statOptionsHtml(it?.damage_scale || '')}</select>
      </div>
      <div class="fld" id="si-protection-fld" style="display:none">
        <label>Proteção</label>
        <input id="si-protection" type="number" min="0" step="1" value="${it?.protection ?? ''}" placeholder="Ex.: 5" aria-describedby="si-protection-err">
        <div class="fld-err" id="si-protection-err"></div>
      </div>
      <div class="fld" id="si-protection-scale-fld" style="display:none">
        <label>Escala com <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(opcional — status deste sistema)</span></label>
        <select id="si-protection-scale" class="fld-input">${statOptionsHtml(it?.protection_scale || '')}</select>
      </div>

      <div class="fld full"><label>Descrição</label><input id="si-desc" value="${esc(it?.description||'')}" placeholder="O que o item faz..."></div>
      <div class="fld full"><label>Imagem do item <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(opcional — até 3 MB)</span></label>
        <div class="img-picker">
          <img id="si-img-prev" class="img-thumb" alt="" ${it?.image_url ? `src="${esc(it.image_url)}"` : 'style="display:none"'}>
          <div class="img-actions">
            <input type="file" id="si-img-file" accept="image/*" style="display:none" onchange="onSiImg(this)">
            <button type="button" class="btn auto sm" onclick="document.getElementById('si-img-file').click()">Escolher imagem</button>
            <button type="button" class="btn auto sm" id="si-img-rm" ${it?.image_url ? '' : 'style="display:none"'} onclick="clearSiImg()">Remover</button>
          </div>
        </div></div>
      <div class="fld full"><label>Modificadores de status <span id="si-mods-hint" style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(usa os status deste sistema)</span></label>
        <div id="si-mods"></div>
        <button type="button" class="btn auto sm" id="si-mods-add" onclick="addSiMod()">+ Modificador</button>
        <div class="fld-err" id="si-mods-err"></div></div>
      <div class="full actions"><button class="btn" onclick="closeSysItem()">Cancelar</button>
        <button class="btn go" onclick="saveSysItem()">Salvar</button></div>
    </div>`;
  _siImgUrl = it?.image_url || null; _siImgFile = null;
  $('si-mods').innerHTML = '';
  (it?.modifiers || []).forEach((m) => addSiMod(m.name, m.value));
  clearSiFieldErrors();
  updateSiCategoryFields();
  box.style.display = ''; $('si-name').focus();
};
window.updateSiCategoryFields = () => {
  const cat = $('si-cat').value;
  const isWeapon = cat === 'Arma';
  const isProtective = cat === 'Armadura' || cat === 'Escudo';
  const needsModifier = cat === 'Acessório' || cat === 'Artefato';
  $('si-damage-fld').style.display = isWeapon ? '' : 'none';
  $('si-damage-scale-fld').style.display = isWeapon ? '' : 'none';
  $('si-protection-fld').style.display = isProtective ? '' : 'none';
  $('si-protection-scale-fld').style.display = isProtective ? '' : 'none';
  $('si-mods-hint').textContent = needsModifier
    ? '(obrigatório nesta categoria — adicione pelo menos 1)'
    : '(usa os status deste sistema)';
  if (!isWeapon) { $('si-damage').value = ''; $('si-damage-scale').value = ''; }
  if (!isProtective) { $('si-protection').value = ''; $('si-protection-scale').value = ''; }
};
function setSiFieldError(fieldId, errId, msg) {
  const el = $(fieldId);
  if (el && (el.tagName === 'INPUT' || el.tagName === 'SELECT')) { el.classList.add('invalid'); el.setAttribute('aria-invalid', 'true'); }
  const err = $(errId);
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearSiFieldErrors() {
  const box = $('sysitem-editor'); if (!box) return;
  box.querySelectorAll('.invalid').forEach((el) => { el.classList.remove('invalid'); el.removeAttribute('aria-invalid'); });
  box.querySelectorAll('.fld-err.show').forEach((el) => el.classList.remove('show'));
}
window.closeSysItem = () => { const b = $('sysitem-editor'); b.style.display = 'none'; b.innerHTML = ''; _siImgUrl = null; _siImgFile = null; };
window.onSiImg = (input) => {
  const f = input.files && input.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { showMsg('Selecione um arquivo de imagem.'); input.value = ''; return; }
  if (f.size > 3 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 3 MB).'); input.value = ''; return; }
  _siImgFile = f;
  const p = $('si-img-prev'); p.src = URL.createObjectURL(f); p.style.display = ''; $('si-img-rm').style.display = '';
};
window.clearSiImg = () => {
  _siImgFile = null; _siImgUrl = null; $('si-img-file').value = '';
  const p = $('si-img-prev'); p.removeAttribute('src'); p.style.display = 'none'; $('si-img-rm').style.display = 'none';
};
window.addSiMod = (name = '', value = '') => {
  const row = document.createElement('div'); row.className = 'mod-row';
  row.innerHTML = `<input class="mn" list="stat-keys" placeholder="Status (ex.: HP)" value="${esc(name)}">
    <input class="mv" placeholder="+/-" value="${esc(value)}"><button type="button" onclick="this.parentElement.remove()"><span class="ic">${ICONS.x}</span></button>`;
  $('si-mods').appendChild(row);
};
window.saveSysItem = async () => {
  clearSiFieldErrors();
  const name = $('si-name').value.trim(); if (!name) { showMsg('Dê um nome ao item.'); return; }
  const modifiers = [...document.querySelectorAll('#si-mods .mod-row')].map((r) => ({ name: r.querySelector('.mn').value.trim(), value: r.querySelector('.mv').value.trim() })).filter((m) => m.name);
  const category = $('si-cat').value;
  const weaponDamage = $('si-damage').value.trim();
  const protectionRaw = $('si-protection').value;
  let firstInvalid = null;
  if (category === 'Arma') {
    if (!weaponDamage) { setSiFieldError('si-damage', 'si-damage-err', 'Informe o dano (ex.: 1d8+2).'); firstInvalid = firstInvalid || 'si-damage'; }
  } else if (category === 'Armadura' || category === 'Escudo') {
    if (protectionRaw === '') { setSiFieldError('si-protection', 'si-protection-err', 'Informe o valor de proteção.'); firstInvalid = firstInvalid || 'si-protection'; }
  } else if (category === 'Acessório' || category === 'Artefato') {
    if (!modifiers.length) { $('si-mods-err').textContent = 'Adicione pelo menos 1 modificador pra esta categoria.'; $('si-mods-err').classList.add('show'); firstInvalid = firstInvalid || 'si-mods-add'; }
  }
  if (firstInvalid) { $(firstInvalid).focus(); return; }
  try {
    if (_siImgFile) { showMsg('Enviando imagem…', 'ok'); _siImgUrl = await db.uploadImage(_siImgFile, 'items'); }
    const isProtective = category === 'Armadura' || category === 'Escudo';
    const payload = {
      name, category, rarity: $('si-rar').value, description: $('si-desc').value.trim(), modifiers, image_url: _siImgUrl,
      weapon_damage: category === 'Arma' ? weaponDamage : null,
      damage_scale: category === 'Arma' ? ($('si-damage-scale').value || null) : null,
      protection: isProtective ? Number(protectionRaw) : null,
      protection_scale: isProtective ? ($('si-protection-scale').value || null) : null,
      proficiency_id: $('si-prof').value || null,
    };
    const editing = $('sysitem-editor').dataset.editing;
    await (editing ? db.updateSystemItem(editing, payload) : db.createSystemItem(systemId, payload));
    openTab('itens');
  } catch (e) { showMsg(e.message); }
};
window.rmSysItem = async (id) => {
  const ok = await confirmModal({ title: 'Remover item do sistema', desc: 'Isso não afeta o item na sua biblioteca — só remove a cópia deste sistema.', confirmLabel: 'Remover' });
  if (!ok) return;
  db.deleteSystemItem(id).then(() => openTab('itens')).catch((e) => showMsg(e.message));
};
window.addLibItem = (libId) => db.addSystemItemFromLibrary(systemId, libId).then(() => openTab('itens')).catch((e) => showMsg(e.message));
</script>
</body>
</html>
