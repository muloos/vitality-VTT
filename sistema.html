// modal de confirmação estilizado (mesmo padrão visual do guia) — substitui confirm() nativo
function confirmModal({ title, desc, confirmLabel = 'Confirmar', danger = true } = {}) {
  return new Promise((resolve) => {
    const trigger = document.activeElement;
    const w = document.createElement('div');
    w.className = 'ui-modal';
    w.setAttribute('role', 'alertdialog');
    w.setAttribute('aria-modal', 'true');
    w.setAttribute('aria-labelledby', 'confirm-title');
    w.innerHTML = `<div class="box guide">
      <div class="ghead"><h3 id="confirm-title">${esc(title)}</h3><button class="x" aria-label="Fechar">×</button></div>
      <p class="gintro">${esc(desc)}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn auto" id="cm-cancel">Cancelar</button>
        <button class="btn auto ${danger ? 'danger' : 'go'}" id="cm-ok">${esc(confirmLabel)}</button>
      </div>
    </div>`;
    const untrap = trapFocus(w);
    const finish = (result) => { untrap(); w.remove(); document.removeEventListener('keydown', onEsc); if (trigger && trigger.focus) trigger.focus(); resolve(result); };
    const onEsc = (e) => { if (e.key === 'Escape') finish(false); };
    w.addEventListener('click', (e) => { if (e.target === w) finish(false); });
    w.querySelector('.x').onclick = () => finish(false);
    w.querySelector('#cm-cancel').onclick = () => finish(false);
    w.querySelector('#cm-ok').onclick = () => finish(true);
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(w);
    w.querySelector('#cm-ok').focus();
  });

// seletor de cor próprio — um color picker de verdade (quadrado de saturação/brilho + barra de
// matiz arrastáveis + hex + atalhos de paleta), substitui <input type="color"> nativo do navegador.
// openColorPicker(botãoGatilho, corAtual, (novaCor)=>...) — chama onPick a cada mudança (igual o
// oninput do color picker nativo), pro chamador poder ter preview ao vivo se quiser.
const COLOR_PRESETS = ['#f2585e','#fb923c','#f5b93d','#eab308','#84cc16','#22c55e','#3ecf7e','#10b981',

function hexToHsv(hex) {
  hex = (hex || '#7ee6dc').replace('#', '');
  if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
  const r = parseInt(hex.slice(0, 2), 16) / 255 || 0, g = parseInt(hex.slice(2, 4), 16) / 255 || 0, b = parseInt(hex.slice(4, 6), 16) / 255 || 0;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;

  return { h, s: max === 0 ? 0 : d / max, v: max };
}
function hsvToHex(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60) [r, g, b] = [c, x, 0]; else if (h < 120) [r, g, b] = [x, c, 0]; else if (h < 180) [r, g, b] = [0, c, x];
  else if (h < 240) [r, g, b] = [0, x, c]; else if (h < 300) [r, g, b] = [x, 0, c]; else [r, g, b] = [c, 0, x];
  const toHex = (n) => Math.round((n + m) * 255).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

  closeColorPicker();

  const pop = document.createElement('div');
  pop.className = 'color-pop';
  pop.innerHTML = `
    <div class="cp-sv" id="cp-sv"><div class="cp-sv-cursor" id="cp-sv-cursor"></div></div>
    <div class="cp-hue" id="cp-hue"><div class="cp-hue-cursor" id="cp-hue-cursor"></div></div>

      <input type="text" class="cp-hex" id="cp-hex" maxlength="7">
    </div>
    <div class="cp-grid">${COLOR_PRESETS.map((c) => `<button type="button" class="cp-swatch" style="--sw:${c}" data-c="${c}" title="${c}"></button>`).join('')}</div>`;
  document.body.appendChild(pop);

  const svEl = pop.querySelector('#cp-sv'), svCur = pop.querySelector('#cp-sv-cursor');
  const hueEl = pop.querySelector('#cp-hue'), hueCur = pop.querySelector('#cp-hue-cursor');
  const preview = pop.querySelector('#cp-preview'), hexInput = pop.querySelector('#cp-hex');

  function render() {
    svEl.style.setProperty('--h', state.h);
    svCur.style.left = (state.s * svEl.clientWidth) + 'px';
    svCur.style.top = ((1 - state.v) * svEl.clientHeight) + 'px';
    hueCur.style.left = (state.h / 360 * hueEl.clientWidth) + 'px';
    const hex = hsvToHex(state.h, state.s, state.v);
    preview.style.setProperty('--sw', hex);
    hexInput.value = hex;
    trigger.style.setProperty('--sw', hex);
    onPick(hex);
  }
  function dragSV(e) {
    const r = svEl.getBoundingClientRect();
    state.s = Math.min(Math.max(0, e.clientX - r.left), r.width) / r.width;
    state.v = 1 - Math.min(Math.max(0, e.clientY - r.top), r.height) / r.height;

  function dragHue(e) {

  });

  let left = r.left, top = r.bottom + 6;
  if (left + pop.offsetWidth > window.innerWidth - 8) left = window.innerWidth - pop.offsetWidth - 8;
  if (top + pop.offsetHeight > window.innerHeight - 8) top = r.top - pop.offsetHeight - 6;
  pop.style.left = Math.max(8, left) + 'px';
  pop.style.top = Math.max(8, top) + 'px';

    document.addEventListener('mousedown', _cpOutside, true);
    document.addEventListener('keydown', _cpEsc);
  }, 0);
};

  const s = (cat || '').toLowerCase();
  if (/armadura|armor|escudo|shield/.test(s)) return ICONS.shield;

  const guide = [
    [`<span class="ic">${ICONS.bolt}</span>Status`, 'Crie os atributos e fórmulas do jogo.', 'status'],
    [`<span class="ic">${ICONS.target}</span>Perícias`, 'Habilidades calculadas a partir dos status.', 'pericias'],
    [`<span class="ic">${ICONS.checklist}</span>Proficiências`, 'Liga/desliga: sabe usar ou não.', 'proficiencias'],
    [`<span class="ic">${ICONS.shield}</span>Classes`, 'Classes, subclasses e status base.', 'classes'],
    [`<span class="ic">${ICONS.levelUp}</span>Nível`, 'Pontos de status concedidos por nível.', 'nivel'],
    [`<span class="ic">${ICONS.tree}</span>Árvores`, 'Desenhe as árvores de habilidade.', 'arvores'],
    [`<span class="ic">${ICONS.bag}</span>Itens`, 'Itens do sistema com modificadores.', 'itens'],
    [`<span class="ic">${ICONS.equip}</span>Equipamento`, 'Monte a tela visual de equipamentos (paper doll).', 'equipamento'],
  ];
  c.innerHTML = `
    <div class="section-title">Identidade do sistema</div>
    <div class="fld"><label>Nome</label><input id="g-name" value="${esc(system.name)}" oninput="markGeralDirty()"></div>
    <div class="fld"><label>Descrição</label>
      <textarea id="g-desc" oninput="markGeralDirty()" placeholder="Sobre o que é este sistema..."
        style="width:100%;min-height:80px;background:var(--field);border:1px solid var(--line2);border-radius:10px;color:var(--ink);font-family:var(--serif);font-size:14px;padding:11px 12px;line-height:1.55">${esc(system.description)}</textarea></div>
    <div class="fld">
      <label class="check-row" for="g-published">
        <input type="checkbox" id="g-published" ${system.is_published ? 'checked' : ''} onchange="markGeralDirty()">
        <span>Publicar na loja — outros usuários podem ver este sistema e favoritá-lo</span>
      </label>
    </div>
    <button class="btn go sm" id="geral-save-btn" style="display:none" onclick="saveGeral()"><span class="spin"></span>Salvar alterações</button>

    <div class="section-title">Monte seu sistema — ordem recomendada</div>
    <div class="onboard" style="margin-bottom:22px"><div class="steps" style="margin-top:0">
      ${guide.map((g, i) => `<div class="ostep"><div class="n">${i + 1}</div>
        <div><b>${g[0]}</b><p>${g[1]}</p><button class="btn sm auto" onclick="openTab('${g[2]}')">Abrir</button></div></div>`).join('')}
    </div></div>

    <div class="section-title">Zona de perigo</div>
    <button class="btn danger auto sm" onclick="delSys()">Excluir sistema</button>`;
}
window.markGeralDirty = () => { const b = $('geral-save-btn'); if (b) b.style.display = ''; };
window.saveGeral = () => {
  const btn = $('geral-save-btn'); if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  const name = $('g-name').value.trim(), description = $('g-desc').value.trim(), is_published = $('g-published').checked;
  db.updateSystem(systemId, { name, description, is_published }).then(() => {
    system.name = name; system.description = description; system.is_published = is_published;
    const nm = $('sys-name'); if (nm && nm.firstChild) nm.firstChild.textContent = name;
    if (btn) btn.style.display = 'none';
    showMsg('Salvo.', 'ok');
  }).catch((e) => showMsg(e.message))
    .finally(() => { if (btn) { btn.classList.remove('loading'); btn.disabled = false; } });
};
window.delSys = async () => {
  const ok = await confirmModal({ title: 'Excluir sistema', desc: `Excluir "${system.name}"? Apaga status, classes, árvores e vínculos. Não dá pra desfazer.`, confirmLabel: 'Excluir' });
  if (!ok) return;
  db.deleteSystem(systemId).then(() => location.href='app.html').catch((e) => showMsg(e.message));
};

/* ===================== STATUS ===================== */
let _statusStats = [];
let _profsCache = []; // proficiências com "nome na fórmula" — pro testador de fórmula reconhecer
async function renderStatus(c) {
  const [stats, profs] = await Promise.all([db.listStats(systemId), db.listProficiencies(systemId)]);
  _statusStats = stats; _profsCache = profs;
  const recursos = stats.filter((s) => s.is_resource);
  const status = stats.filter((s) => !s.is_resource && !s.is_skill);
  c.innerHTML = `
    <div class="section-title">Status do sistema</div>
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.6;margin:0 0 14px">
      <b style="color:var(--maq)">Recurso</b> (ex.: HP, Mana, Sanidade) tem destaque na ficha com barra de atual/máximo e pode ser um valor fixo ou uma fórmula.
      <b style="color:var(--brass)">Status</b> (ex.: Força, Destreza) não tem valor na criação — você define o valor de cada um por classe, na aba Classes.
      O <b style="color:var(--maq)">nome na fórmula</b> é o apelido usado pra referenciar o status nas fórmulas. A <b>cor</b> pinta a caixinha dele na ficha.</p>

    <div class="section-title"><span class="ic">${ICONS.bolt}</span>Recursos <span style="color:var(--ink-faint);text-transform:none;letter-spacing:0">(atual/máximo, com destaque)</span></div>
    <div class="list">${recursos.length ? recursos.map(statRow).join('') : '<div class="empty">Nenhum recurso ainda.</div>'}</div>

    <div class="section-title"><span class="ic">${ICONS.dagger}</span>Status <span style="color:var(--ink-faint);text-transform:none;letter-spacing:0">(valor por classe + pontos de status)</span></div>
    <div class="list">${status.length ? status.map(statRow).join('') : '<div class="empty">Nenhum status ainda.</div>'}</div>

    <div class="surface" style="margin-top:16px">
      <form class="item-form" onsubmit="return addStat(event)">
        <div class="fld"><label for="st-name">Nome</label><input id="st-name" placeholder="Ex.: Pontos de Vida" maxlength="40" required></div>
        <div class="fld"><label for="st-formkey">Nome na fórmula</label><input id="st-formkey" placeholder="Ex.: HP" maxlength="20"></div>
        <div class="fld"><label for="st-type">Tipo</label>
          <select id="st-type" class="fld-input" onchange="onStatTypeChange()">
            <option value="status">Status (valor definido depois, por classe)</option>
            <option value="resource-fixed">Recurso — valor fixo</option>
            <option value="resource-formula">Recurso — fórmula</option>
          </select></div>
        <div class="fld"><label>Cor</label>
          <button type="button" class="color-swatch full" style="--sw:#7ee6dc" onclick="openColorPicker(this, '#7ee6dc', (v)=>{ document.getElementById('st-color').value = v; })"></button>
          <input type="hidden" id="st-color" value="#7ee6dc"></div>
        <div class="fld" id="st-extra-wrap" style="display:none"></div>
        <div class="full"><button class="btn go auto" type="submit">+ Adicionar status</button></div>
      </form>
    </div>

    ${formulaTutorial(stats)}`;
}
window.onStatTypeChange = () => {
  const v = $('st-type').value;
  const wrap = $('st-extra-wrap');
  if (v === 'status') { wrap.style.display = 'none'; wrap.innerHTML = ''; return; }
  wrap.style.display = '';
  wrap.innerHTML = v === 'resource-formula' ? extraFormula() : extraDefault();
};
window.extraDefault = () => `<label>Valor máximo (fixo)</label><input id="st-extra" placeholder="Ex.: 30">`;
window.extraFormula = () => `<label>Fórmula do máximo</label><input id="st-extra" placeholder="Ex.: CON*10">`;
function statRow(s) {
  const isC = s.kind === 'computed';
  return `<div class="list-row" style="flex-wrap:wrap">
    <div class="grow"><input class="nm" style="background:transparent;border:0;color:var(--ink);font-family:var(--serif);font-size:15px;width:100%" value="${esc(s.name)}" onchange="onStatFieldChange('${s.id}','name',this.value)">
      <div class="sub" style="display:flex;align-items:center;gap:6px;margin-top:3px">${isC ? 'calculado' : 'base'} · na fórmula:
        <input value="${esc(s.formula_key)}" placeholder="apelido" onchange="onStatFieldChange('${s.id}','formula_key',this.value)"
          style="width:100px;background:var(--field);border:1px solid var(--line2);border-radius:6px;color:var(--maq);font-family:var(--mono);font-size:11px;padding:3px 7px"></div></div>
    <input value="${esc(isC ? s.formula : s.default_value)}" placeholder="${isC ? 'fórmula (ex.: FORCA*5 + 10)' : 'valor padrão'}"
      style="flex:1 1 180px;min-width:140px;background:var(--field);border:1px solid var(--line2);border-radius:8px;color:${isC?'var(--maq)':'var(--ink)'};font-family:var(--mono);font-size:12px;padding:8px 10px"
      onchange="onStatFieldChange('${s.id}','${isC?'formula':'default_value'}',this.value)">
    <button type="button" class="color-swatch" style="--sw:${esc(s.color || '#7ee6dc')}" title="Cor da caixa na ficha" onclick="openColorPicker(this, '${esc(s.color || '#7ee6dc')}', (v)=>onStatFieldChange('${s.id}','color',v))"></button>
    <button class="btn sm go auto" id="stat-save-${s.id}" style="display:none" onclick="saveStatRow('${s.id}')"><span class="spin"></span>Salvar</button>
    <button class="btn sm auto" style="${s.is_resource ? 'border-color:var(--maq);color:var(--maq)' : ''}" onclick="toggleResource('${s.id}', ${!s.is_resource})" title="Recurso: mostra atual/máximo na ficha (ex.: HP)">${s.is_resource ? `<span class="ic">${ICONS.heart}</span>recurso` : 'recurso?'}</button>
    ${isC ? `<button class="btn sm auto" onclick="toggleTest('${s.id}')" title="Testar a fórmula"><span class="ic">${ICONS.flask}</span>Testar</button>` : ''}
    <button class="btn sm danger auto" onclick="delStat('${s.id}')"><span class="ic">${ICONS.x}</span></button>
  </div>
  ${isC ? `<div id="test-${s.id}" class="surface" style="display:none;margin:-2px 0 8px;padding:14px"></div>` : ''}`;
}
window.toggleResource = (id, val) => {
  const s = _statusStats.find((x) => x.id === id); if (s) s.is_resource = val;
  const patch = { is_resource: val };
  if (val && s && !s.color) patch.color = '#7ee6dc'; // cor padrão ao virar recurso
  db.updateStat(id, patch).then(() => openTab('status')).catch((e) => showMsg(e.message));
};
window.formulaTutorial = (stats) => {
  const exemplos = stats.filter((s) => s.formula_key).slice(0, 3).map((s) => s.formula_key);
  const ex = exemplos.length >= 2 ? `${exemplos[0]} * 5 + ${exemplos[1] || '10'}` : 'FORCA * 5 + 10';
  return `<div class="surface" style="margin-top:16px">
    <h4 style="font-family:var(--disp);font-size:15px;color:var(--bone);margin:0 0 12px"><span class="ic">${ICONS.book}</span>Como criar fórmulas</h4>
    <div style="font-family:var(--serif);font-size:13.5px;color:var(--ink-dim);line-height:1.75">
      <p style="margin:0 0 10px">Um status <b>Calculado</b> não é preenchido pelo jogador — ele é calculado a partir de outros status usando uma <b>fórmula</b>.</p>
      <p style="margin:0 0 6px">Na fórmula você referencia outros status pelo <b style="color:var(--maq)">nome na fórmula</b> (o apelido). Pode usar:</p>
      <ul style="margin:0 0 10px;padding-left:20px;font-family:var(--mono);font-size:12px;color:var(--ink)">
        <li>Números: <code>10</code>, <code>2.5</code></li>
        <li>Operações: <code>+</code>  <code>-</code>  <code>*</code>  <code>/</code></li>
        <li>Parênteses: <code>( )</code> para agrupar</li>
        <li>Os apelidos dos seus status: <code>${esc(stats.map((s)=>s.formula_key).filter(Boolean).join(', ') || 'HP, FORCA, DES')}</code></li>
      </ul>
      <p style="margin:0 0 6px"><b>Exemplo:</b></p>
      <div style="font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--bone)">
        Ataque (calculado) = <span style="color:var(--maq)">${esc(ex)}</span></div>
      <p style="margin:10px 0 0;font-size:12px;color:var(--ink-faint)">Dica: use apelidos curtos, sem espaços nem acentos (ex.: <code>HP</code>, <code>MANA</code>, <code>FORCA</code>, <code>DES</code>). Assim fica fácil escrever as fórmulas.</p>
    </div></div>`;
};
// dependentes de um "nome na fórmula" — varre as fórmulas dos outros status/perícias já
// carregados; não cobre fórmulas de itens (escala de dano/proteção), que vivem noutra aba
function statDependents(key, excludeId) {
  const k = (key || '').trim(); if (!k) return [];
  const re = new RegExp('(^|[^A-Za-zÀ-ú0-9_])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^A-Za-zÀ-ú0-9_])');
  return _statusStats.filter((s) => s.id !== excludeId && s.kind === 'computed' && re.test(s.formula || '')).map((s) => s.name);
}
function formulaKeyTaken(key, excludeId) {
  const k = (key || '').trim().toLowerCase(); if (!k) return false;
  return _statusStats.some((s) => s.id !== excludeId && (s.formula_key || '').trim().toLowerCase() === k);
}
window.addStat = (ev) => {
  ev.preventDefault();
  const name = $('st-name').value.trim(); if (!name) { showMsg('Dê um nome ao status.'); return false; }
  const formKey = $('st-formkey').value.trim();
  if (formKey && formulaKeyTaken(formKey)) { showMsg(`Já existe um status com o "nome na fórmula" "${formKey}" — escolha outro apelido.`); return false; }
  const type = $('st-type').value;
  const extra = $('st-extra')?.value.trim() || '';
  const stat = { name, formula_key: formKey || null, sort_order: Date.now() % 100000, color: $('st-color')?.value || '#7ee6dc' };
  if (type === 'status') {
    stat.kind = 'base'; stat.is_resource = false; stat.default_value = null;
  } else {
    stat.is_resource = true;
    if (type === 'resource-formula') { stat.kind = 'computed'; stat.formula = extra; }
    else { stat.kind = 'base'; stat.default_value = extra; }
  }
  db.createStat(systemId, stat).then(() => openTab('status')).catch((e) => showMsg(e.message));
  return false;
};
// não grava mais no banco a cada campo — só atualiza o rascunho em memória (mantém o painel de
// "Testar" com valores frescos) e mostra o botão Salvar dessa linha. saveStatRow() grava tudo
// de uma vez quando o usuário decide confirmar.
window.onStatFieldChange = (id, k, v) => {
  const s = _statusStats.find((x) => x.id === id); if (s) s[k] = v.trim();
  const b = $('stat-save-' + id);
  if (b && b.style.display === 'none') markDirty();
  if (b) b.style.display = '';
};
window.saveStatRow = (id) => {
  const s = _statusStats.find((x) => x.id === id); if (!s) return;
  const key = (s.formula_key || '').trim();
  if (key && formulaKeyTaken(key, id)) { showMsg(`Já existe outro status com o "nome na fórmula" "${key}".`); return; }
  // valida a fórmula com os valores padrão dos status base ANTES de gravar — sem isso, uma
  // fórmula incompleta (ex.: "FORCA +") só dava erro se alguém lembrasse de clicar em "Testar"
  if (s.kind === 'computed') {
    const baseVals = {};
    _statusStats.forEach((b) => { if (b.kind !== 'computed' && (b.formula_key || '').trim()) baseVals[b.formula_key.trim()] = b.default_value || '0'; });
    try { computeStat(s, baseVals); } catch (e) { showMsg('Fórmula inválida: ' + e.message); return; }
  }
  const btn = $('stat-save-' + id); if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  const patch = { name: (s.name || '').trim(), formula_key: key };
  if (s.kind === 'computed') patch.formula = (s.formula || '').trim(); else patch.default_value = (s.default_value || '').trim();
  patch.color = s.color || null;
  db.updateStat(id, patch).then(() => { if (btn) btn.style.display = 'none'; clearDirty(); showMsg('Salvo.', 'ok'); })
    .catch((e) => showMsg(e.message))
    .finally(() => { if (btn) { btn.classList.remove('loading'); btn.disabled = false; } });
};
window.delStat = async (id) => {
  const s = _statusStats.find((x) => x.id === id);
  const deps = s ? statDependents(s.formula_key, id) : [];
  const ok = await confirmModal({
    title: 'Excluir status',
    desc: deps.length
      ? `A fórmula de "${deps.join('", "')}" usa este status — vai passar a dar erro ao calcular. Excluir mesmo assim?`
      : 'Não dá pra desfazer.',
    confirmLabel: 'Excluir',
  });
  if (!ok) return;
  db.deleteStat(id).then(() => openTab('status')).catch((e) => showMsg(e.message));
};

/* ===================== PERÍCIAS ===================== */
// perícia = um status "computed" com a etiqueta is_skill: sempre calculada por fórmula (nunca

// por isso reaproveita toda a infra de fórmula/teste dos Status (_statusStats, computeStat etc.)
async function renderPericias(c) {
  const [stats, profs] = await Promise.all([db.listStats(systemId), db.listProficiencies(systemId)]);
  _statusStats = stats; _profsCache = profs;
  const pericias = stats.filter((s) => s.is_skill);
  c.innerHTML = `
    <div class="section-title">Perícias do sistema</div>
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.6;margin:0 0 14px">
      Uma <b style="color:var(--brass)">Perícia</b> é sempre calculada por <b>fórmula</b> (ex.: DES + PROF) — o jogador nunca digita o valor dela, só vê o resultado.
      Use o <b style="color:var(--maq)">nome na fórmula</b> dos Status (aba Status) pra montar a conta. Na ficha ela aparece como uma caixinha pequena, com a cor escolhida, só com nome e valor.</p>

    <div class="surface" style="margin-bottom:16px">
      <label class="check-row" for="pe-enabled">
        <input type="checkbox" id="pe-enabled" ${system.skills_enabled ? 'checked' : ''} onchange="toggleSkillsEnabled(this.checked)">
        <span>Usar perícias nesta mesa — desativado, a seção de Perícias nem aparece na ficha do jogador (mas o que você montar aqui fica salvo pra quando ativar).</span>
      </label>
    </div>

    <div class="list">${pericias.length ? pericias.map(periciaRow).join('') : '<div class="empty">Nenhuma perícia ainda.</div>'}</div>

    <div class="surface" style="margin-top:16px">
      <form class="item-form" onsubmit="return addPericia(event)">
        <div class="fld"><label for="pe-name">Nome</label><input id="pe-name" placeholder="Ex.: Furtividade" maxlength="40" required></div>
        <div class="fld"><label for="pe-formkey">Nome na fórmula</label><input id="pe-formkey" placeholder="Ex.: FURTIVIDADE" maxlength="20"></div>
        <div class="fld"><label for="pe-formula">Fórmula</label><input id="pe-formula" placeholder="Ex.: DES + PROF"></div>
        <div class="fld"><label>Cor</label>
          <button type="button" class="color-swatch full" style="--sw:#7ee6dc" onclick="openColorPicker(this, '#7ee6dc', (v)=>{ document.getElementById('pe-color').value = v; })"></button>
          <input type="hidden" id="pe-color" value="#7ee6dc"></div>
        <div class="full"><button class="btn go auto" type="submit">+ Adicionar perícia</button></div>
      </form>
    </div>

    ${formulaTutorial(stats)}`;
}
function periciaRow(s) {
  return `<div class="list-row" style="flex-wrap:wrap">
    <button type="button" class="color-swatch" style="--sw:${esc(s.color || '#7ee6dc')}" title="Cor da caixinha na ficha" onclick="openColorPicker(this, '${esc(s.color || '#7ee6dc')}', (v)=>onStatFieldChange('${s.id}','color',v))"></button>
    <div class="grow"><input class="nm" style="background:transparent;border:0;color:var(--ink);font-family:var(--serif);font-size:15px;width:100%" value="${esc(s.name)}" onchange="onStatFieldChange('${s.id}','name',this.value)">
      <div class="sub" style="display:flex;align-items:center;gap:6px;margin-top:3px">na fórmula:
        <input value="${esc(s.formula_key)}" placeholder="apelido" onchange="onStatFieldChange('${s.id}','formula_key',this.value)"
          style="width:100px;background:var(--field);border:1px solid var(--line2);border-radius:6px;color:var(--maq);font-family:var(--mono);font-size:11px;padding:3px 7px"></div></div>
    <input value="${esc(s.formula)}" placeholder="fórmula (ex.: DES + PROF)"
      style="flex:1 1 180px;min-width:140px;background:var(--field);border:1px solid var(--line2);border-radius:8px;color:var(--maq);font-family:var(--mono);font-size:12px;padding:8px 10px"
      onchange="onStatFieldChange('${s.id}','formula',this.value)">
    <button class="btn sm go auto" id="stat-save-${s.id}" style="display:none" onclick="saveStatRow('${s.id}')"><span class="spin"></span>Salvar</button>
    <button class="btn sm auto" onclick="toggleTest('${s.id}')" title="Testar a fórmula"><span class="ic">${ICONS.flask}</span>Testar</button>
    <button class="btn sm danger auto" onclick="delStat('${s.id}')"><span class="ic">${ICONS.x}</span></button>
  </div>
  <div id="test-${s.id}" class="surface" style="display:none;margin:-2px 0 8px;padding:14px"></div>`;

window.addPericia = (ev) => {
  ev.preventDefault();
  const name = $('pe-name').value.trim(); if (!name) { showMsg('Dê um nome à perícia.'); return false; }
  const formKey = $('pe-formkey').value.trim();
  if (formKey && formulaKeyTaken(formKey)) { showMsg(`Já existe um status/perícia com o "nome na fórmula" "${formKey}" — escolha outro apelido.`); return false; }
  const stat = {
    name, formula_key: formKey || null,
    formula: $('pe-formula').value.trim(),
    kind: 'computed', is_resource: false, is_skill: true,
    color: $('pe-color').value || '#7ee6dc',
    sort_order: Date.now() % 100000,
  };
  db.createStat(systemId, stat).then(() => openTab('pericias')).catch((e) => showMsg(e.message));
  return false;
};
window.toggleSkillsEnabled = (val) => {
  system.skills_enabled = val;
  db.updateSystem(systemId, { skills_enabled: val })
    .then(() => showMsg(val ? 'Perícias ativadas — já aparecem na ficha do jogador.' : 'Perícias desativadas — sumiram da ficha do jogador.', 'ok'))
    .catch((e) => showMsg(e.message));
};

/* ===================== PROFICIÊNCIAS ===================== */
// diferente da Perícia (sempre numérica/fórmula), a Proficiência é liga/desliga — "sabe usar" ou
// não (arma, armadura, ferramenta, idioma...). Sem valor, sem fórmula. Concedida por Classe (aba
// Classes, botão "Proficiências ▾") e, pontualmente, pelo Mestre direto na ficha de um jogador.
let _profsList = [];
// pacotes prontos — nomes genéricos de fantasia (não amarrados a nenhum sistema comercial
// específico), só pra o Mestre não digitar um por um. addProfPreset() pula o que já existe.

/* ---------- avaliador de fórmula ---------- */
// procura primeiro nos Status/Perícias; se não achar, procura nas Proficiências com nome na
// fórmula (vira um pseudo-status "base" fixo em 1/0 — é assim que uma fórmula pode checar
// "o personagem tem essa proficiência?" sem precisar de um caminho de avaliação separado)
const statByKey = (key) => {
  const k = key.trim();
  const s = _statusStats.find((x) => (x.formula_key || '').trim() === k);
  if (s) return s;
  const p = _profsCache.find((x) => (x.formula_key || '').trim() === k);
  return p ? { id: 'prof:' + p.id, name: p.name, kind: 'base', formula_key: p.formula_key, default_value: '0', is_proficiency: true } : undefined;
};
// calcula o valor de um status; base = usa o valor de teste; calculado = resolve a fórmula
function computeStat(stat, baseVals, seen = new Set()) {
  if (stat.kind !== 'computed') {
    const raw = baseVals[(stat.formula_key || '').trim()];
    const n = Number(raw);
    if (raw === undefined || raw === '' || isNaN(n)) throw new Error(`"${stat.formula_key || stat.name}" sem valor`);
    return n;
  }
  if (seen.has(stat.id)) throw new Error('referência circular');
  const seen2 = new Set(seen); seen2.add(stat.id);
  const tokens = (stat.formula || '').match(/[A-Za-zÀ-ú_][A-Za-zÀ-ú0-9_]*|\d+\.?\d*|[+\-*/()]/g) || [];
  if (!tokens.length) throw new Error('fórmula vazia');
  const expr = tokens.map((tok) => {
    if (/^[\d.]/.test(tok) || /^[+\-*/()]$/.test(tok)) return tok;
    const ref = statByKey(tok);
    if (!ref) throw new Error(`"${tok}" não é um status`);
    return '(' + computeStat(ref, baseVals, seen2) + ')';
  }).join(' ');
  if (!/^[\d+\-*/().\s]*$/.test(expr)) throw new Error('fórmula inválida');
  let r; try { r = Function('"use strict";return (' + expr + ')')(); } catch (_) { throw new Error('fórmula inválida'); }
  if (!isFinite(r)) throw new Error('divisão por zero?');
  return Math.round(r * 1000) / 1000;
}

window.runTest = (statId) => {
  const stat = _statusStats.find((s) => s.id === statId);
  const box = $('test-' + statId), out = $('result-' + statId);
  const baseVals = {};
  box.querySelectorAll('.tv').forEach((inp) => { baseVals[inp.dataset.key] = inp.dataset.bool ? (inp.checked ? '1' : '0') : inp.value; });
  try { const r = computeStat(stat, baseVals); out.style.color = 'var(--maq)'; out.textContent = '= ' + r; }
  catch (e) { out.style.color = 'var(--escarlate)'; out.innerHTML = `<span class="ic">${ICONS.warning}</span>${esc(e.message)}`; }
};

/* ===================== NÍVEL ===================== */
// progressão automática em duas camadas:
// 1) um PADRÃO por nível (pontos de status + pontos por árvore) que vale pra todo nível daí pra
//    frente — não precisa mais criar uma linha por nível um a um.
// 2) EXCEÇÕES pontuais: um nível específico pode substituir o padrão (ex.: "nível 10 dá o dobro").
// O personagem começa no nível 1 (sem concessão); ao subir de nível na ficha, o resync soma o
// padrão (ou a exceção, se houver) de cada nível pulado desde o último já pago — nunca retroage,
// nunca sobrescreve o que já foi dado.
let _nivelTrees = [];
async function renderNivel(c) {
  const [levels, levelTrees, trees] = await Promise.all([
    db.listSystemLevels(systemId), db.listSystemLevelTrees(systemId), db.listSystemTrees(systemId),

  // uma linha de exceção por nível que apareça em QUALQUER uma das duas tabelas — um nível pode
  // existir só pra mexer numa árvore, sem tocar no status, ou vice-versa
  const nums = [...new Set([...levels.map((l) => l.level), ...levelTrees.map((l) => l.level)])].sort((a, b) => a - b);
  const statByLevel = {}; levels.forEach((l) => { statByLevel[l.level] = l.stat_points; });
  const treeByLevel = {};
  levelTrees.forEach((l) => { (treeByLevel[l.level] || (treeByLevel[l.level] = {}))[l.tree_id] = l.points; });
  c.innerHTML = `
    <div class="section-title">Progressão de nível</div>
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.6;margin:0 0 16px">
      Todo personagem começa no <b>nível 1</b>, sem concessão. Configure um <b style="color:var(--brass)">padrão por nível</b> — vale pra todo nível seguinte, sem precisar cadastrar um por um — e, se algum nível específico precisar fugir da regra, adicione uma <b>exceção</b> só pra ele.</p>

    <div class="section-title" style="font-size:12px;margin-bottom:10px">Padrão por nível</div>

    <div class="sub" style="margin:0 0 8px;color:var(--brass);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-family:var(--mono)">Pontos de status</div>
    <div class="item-form" style="margin-bottom:20px">
      <div class="fld full"><label>Pontos de status concedidos por nível</label>
        <input type="number" min="0" value="${system.level_stat_points_default || 0}" onchange="updateLevelDefault(this.value)"></div>
    </div>

    ${trees.length ? `
    <div class="sub" style="margin:0 0 8px;color:var(--maq);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-family:var(--mono)">Pontos de árvore de habilidade</div>

// moldura de raridade "premium" (mesmo padrão de app.html, duplicado aqui de propósito —
// convenção do projeto de não compartilhar helpers de UI entre páginas): decorações internas
// pra dentro do .poster-card/.list-row, que é envolvido por um .rar-frame (borda em degradê animado).
function posterRarityLayers(rarity) {
  const glintSpots = {
    'Épico': [[16, 22]],
    'Lendário': [[18, 18], [80, 28], [14, 66], [84, 86]],
    'Único': [[12, 14], [82, 20], [6, 36], [90, 46], [16, 64], [86, 78], [24, 94], [72, 90], [48, 10], [46, 56], [66, 48]],
  };
  const spots = glintSpots[rarity] || [];
  let glints = '';
  spots.forEach((p, i) => {
    const delay = (i * 0.28).toFixed(2);
    const dur = (2.1 + (i % 4) * 0.3).toFixed(2);
    const size = 8 + (i % 3) * 2;
    glints += `<i class="pc-glint" style="left:${p[0]}%;top:${p[1]}%;width:${size}px;height:${size}px;animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  });
  let extra = '';
  if (rarity === 'Épico' || rarity === 'Único') extra += `<span class="pc-sweep"></span>`;
  if (rarity === 'Lendário' || rarity === 'Único') extra += `<span class="pc-highlight"></span><span class="pc-topline"></span><span class="pc-core"></span>`;
  if (rarity === 'Único') extra += `<span class="pc-sweep pc-sweep2"></span><span class="pc-ring"></span><span class="pc-ring pc-ring2"></span>`;
  return extra + glints;
}

  const bgUrl = system.equipment_bg_url || null;

    // insere só o slot novo (e seleciona ele) em vez de re-renderizar a aba inteira — evita o
    // "piscar" de tela e mantém os outros slots intactos

// arrastar reposiciona (pointer events, mesmo padrão do editor de árvore) — só conta como clique
// de seleção se o ponteiro não se moveu (senão todo arraste também trocaria a seleção)
// mesmo tamanho da grade desenhada em .eq-board::before (theme.css) — precisa bater certinho pra
// o slot encaixar exatamente nos cruzamentos das linhas
const EQ_GRID_PX = 32;
// a grade é centralizada no quadro (background-position:center), então os cruzamentos ficam em
// "centro ± múltiplo de 32px", não em "0, 32, 64..." — encaixa relativo ao centro do eixo
function eqSnapPx(px, dim) {
  const center = dim / 2;
  return center + Math.round((px - center) / EQ_GRID_PX) * EQ_GRID_PX;
}
window.onEqSlotPointerDown = (ev, id) => {
  const board = $('eq-board'); const el = ev.currentTarget;
  ev.preventDefault(); el.setPointerCapture(ev.pointerId);
  _eqDragMoved = false;
  const boardRect = board.getBoundingClientRect();
  const startX = ev.clientX, startY = ev.clientY;
  const slot = _eqSlots.find((s) => s.id === id); if (!slot) return;
  const startPx = Number(slot.pos_x), startPy = Number(slot.pos_y);
  let pendingX = startPx, pendingY = startPy;
  const mv = (e) => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) + Math.abs(dy) > 4) _eqDragMoved = true;
    const rawX = Math.min(100, Math.max(0, startPx + (dx / boardRect.width) * 100));
    const rawY = Math.min(100, Math.max(0, startPy + (dy / boardRect.height) * 100));
    // encaixa nos cruzamentos da grade de fundo — assim os slots ficam sempre alinhados entre si
    // em vez de depender de precisão de olho no arraste
    pendingX = Math.min(100, Math.max(0, (eqSnapPx((rawX / 100) * boardRect.width, boardRect.width) / boardRect.width) * 100));
    pendingY = Math.min(100, Math.max(0, (eqSnapPx((rawY / 100) * boardRect.height, boardRect.height) / boardRect.height) * 100));
    el.style.left = pendingX + '%'; el.style.top = pendingY + '%';
  };
  const up = () => {
    el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up);
    if (_eqDragMoved) {
      slot.pos_x = pendingX; slot.pos_y = pendingY;
      db.updateEquipmentSlot(id, { pos_x: pendingX, pos_y: pendingY }).catch((e) => showMsg(e.message));
    }
  };
  el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
};
window.onEqSlotClick = (ev, id) => {

    if (_eqSelected.has(id)) { if (_eqSelected.size > 1) _eqSelected.delete(id); } // nunca fica sem nenhum selecionado

  } else {

  document.querySelectorAll('#eq-board .eq-slot').forEach((el) => el.classList.toggle('selected', _eqSelected.has(el.dataset.id)));

};

            <button class="btn go auto" onclick="saveEqSlot('${s.id}')">Salvar</button>
          </div>
        </div>
      </div>`;
    return;
  }
  const list = ids.map((id) => _eqSlots.find((s) => s.id === id)).filter(Boolean);
  panel.innerHTML = `
    <div class="surface">
      <h4 style="font-family:var(--disp);font-size:15px;color:var(--bone);margin:0 0 14px">${list.length} slots selecionados</h4>
      <div class="list" style="margin-bottom:14px">${list.map((s) => `<div class="list-row"><div class="grow"><div class="nm">${esc(s.name)}</div></div>
        <button class="btn sm auto" onclick="eqDeselect('${s.id}')" title="Tirar da seleção"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join('')}</div>
      <div class="item-form">
        <div class="fld full"><label>Tipo de item aceito <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(aplica a todos)</span></label>
          <select id="eqb-type" class="fld-input">
            <option value="">— não alterar —</option>
            <option value="__none__">Qualquer item (remove a restrição)</option>
            ${EQUIP_TYPES.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
          </select>
        </div>
        <div class="fld"><label>Largura (px) <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(vazio não altera)</span></label><input id="eqb-w" type="number" min="32" max="220" placeholder="—"></div>
        <div class="fld"><label>Altura (px) <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(vazio não altera)</span></label><input id="eqb-h" type="number" min="32" max="220" placeholder="—"></div>
        <div class="full actions">
          <button class="btn danger auto" onclick="delEqSlotsBatch()">Excluir selecionados</button>
          <button class="btn go auto" onclick="saveEqSlotsBatch()">Aplicar a todos</button>
        </div>
      </div>
    </div>`;
}
window.onEqsImg = (input) => {
  const f = input.files && input.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { showMsg('Selecione um arquivo de imagem.'); input.value = ''; return; }
  if (f.size > 3 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 3 MB).'); input.value = ''; return; }
  _eqsImgFile = f;
  const p = $('eqs-img-prev'); p.src = URL.createObjectURL(f); p.style.display = ''; $('eqs-img-rm').style.display = '';
};
window.clearEqsImg = () => {
  _eqsImgFile = null; _eqsImgUrl = null; $('eqs-img-file').value = '';
  const p = $('eqs-img-prev'); p.removeAttribute('src'); p.style.display = 'none'; $('eqs-img-rm').style.display = 'none';
};
window.saveEqSlot = async (id) => {
  const name = $('eqs-name').value.trim(); if (!name) { showMsg('Dê um nome ao slot.'); return; }
  try {
    if (_eqsImgFile) { showMsg('Enviando imagem…', 'ok'); _eqsImgUrl = await db.uploadImage(_eqsImgFile, 'slots'); }
    const clampPct = (v, fallback) => { const n = parseFloat(v); return isNaN(n) ? fallback : Math.max(0, Math.min(100, n)); };
    const patch = {
      name, accepts_type: $('eqs-type').value.trim() || null,
      width: parseInt($('eqs-w').value) || 72, height: parseInt($('eqs-h').value) || 72,
      pos_x: clampPct($('eqs-x')?.value, 50), pos_y: clampPct($('eqs-y')?.value, 50),
      silhouette_url: _eqsImgUrl,
    };
    await db.updateEquipmentSlot(id, patch);
    const s = _eqSlots.find((x) => x.id === id); if (s) Object.assign(s, patch);
    redrawEqBoard();
    renderEqEditorPanel(true);
    showMsg('Slot salvo.', 'ok');
  } catch (e) { showMsg(e.message); }
};
window.delEqSlot = async (id) => {
  const ok = await confirmModal({ title: 'Excluir slot', desc: 'Itens equipados nesse slot voltam pra mochila do jogador. Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;
  try {
    await db.deleteEquipmentSlot(id);
    _eqSlots = _eqSlots.filter((s) => s.id !== id);
    _eqSelected.delete(id);
    if (!_eqSelected.size && _eqSlots.length) _eqSelected = new Set([_eqSlots[0].id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
  } catch (e) { showMsg(e.message); }
};
// duplica um slot inteiro (nome, tipo, tamanho, silhueta) num offset pequeno — paper dolls quase
// sempre têm pares simétricos (anéis, botas, luvas), então repetir tipo/tamanho na mão toda vez
// era o gargalo mais bobo de montar um quadro de equipamentos
window.duplicateEqSlot = async (id) => {
  const s = _eqSlots.find((x) => x.id === id); if (!s) return;
  try {
    const copy = await db.createEquipmentSlot(systemId, {
      name: s.name + ' (cópia)', accepts_type: s.accepts_type || null,
      width: s.width, height: s.height, silhouette_url: s.silhouette_url || null,
      pos_x: Math.min(96, (s.pos_x || 50) + 6), pos_y: Math.min(96, (s.pos_y || 50) + 6),
      sort_order: Date.now() % 100000,
    });
    _eqSlots.push(copy);
    _eqSelected = new Set([copy.id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
    showMsg('Slot duplicado.', 'ok');
  } catch (e) { showMsg(e.message); }
};
window.saveEqSlotsBatch = async () => {
  const ids = [..._eqSelected];
  const type = $('eqb-type').value;
  const w = parseInt($('eqb-w').value), h = parseInt($('eqb-h').value);
  const patch = {};
  if (type === '__none__') patch.accepts_type = null;
  else if (type) patch.accepts_type = type;
  if (!isNaN(w)) patch.width = w;
  if (!isNaN(h)) patch.height = h;
  if (!Object.keys(patch).length) { showMsg('Preencha ao menos um campo pra aplicar.'); return; }
  try {
    await Promise.all(ids.map((id) => db.updateEquipmentSlot(id, patch)));
    ids.forEach((id) => { const s = _eqSlots.find((x) => x.id === id); if (s) Object.assign(s, patch); });
    redrawEqBoard();
    renderEqEditorPanel(true);
    showMsg(`${ids.length} slots atualizados.`, 'ok');
  } catch (e) { showMsg(e.message); }
};
window.delEqSlotsBatch = async () => {
  const ids = [..._eqSelected];
  const ok = await confirmModal({ title: `Excluir ${ids.length} slots`, desc: 'Itens equipados neles voltam pra mochila do jogador. Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;
  try {
    await Promise.all(ids.map((id) => db.deleteEquipmentSlot(id)));
    _eqSlots = _eqSlots.filter((s) => !ids.includes(s.id));
    _eqSelected.clear();
    if (_eqSlots.length) _eqSelected = new Set([_eqSlots[0].id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
  } catch (e) { showMsg(e.message); }
};
</script>
</body>
</html>
