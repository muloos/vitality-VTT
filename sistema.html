  return new Promise((resolve) => {
    const trigger = document.activeElement;
    const w = document.createElement('div');

    w.setAttribute('role', 'alertdialog');
    w.setAttribute('aria-modal', 'true');
    w.setAttribute('aria-labelledby', 'confirm-title');
    w.innerHTML = `<div class="box guide">
      <div class="ghead"><h3 id="confirm-title">${esc(title)}</h3><button class="x" aria-label="Fechar">×</button></div>
      <p class="gintro">${esc(desc)}</p>
      ${confirmText ? `<div class="fld full" style="margin-top:2px">
        <label for="cm-confirm-text">Digite <b style="color:var(--ink)">${esc(confirmText)}</b> pra confirmar</label>
        <input id="cm-confirm-text" autocomplete="off" spellcheck="false"></div>` : ''}
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button class="btn auto" id="cm-cancel">Cancelar</button>
        <button class="btn auto ${danger ? 'danger' : 'go'}" id="cm-ok" ${confirmText ? 'disabled' : ''}>${esc(confirmLabel)}</button>
      </div>

    const onEsc = (e) => { if (e.key === 'Escape') finish(false); };

      const input = w.querySelector('#cm-confirm-text'), ok = w.querySelector('#cm-ok');
      input.addEventListener('input', () => { ok.disabled = input.value !== confirmText; });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !ok.disabled) finish(true); });
      input.focus();

  const r = parseInt(hex.slice(0, 2), 16) / 255 || 0, g = parseInt(hex.slice(2, 4), 16) / 255 || 0, b = parseInt(hex.slice(4, 6), 16) / 255 || 0;

/* ===================== REORDENAR POR ARRASTAR ===================== */
// Utilitário genérico usado por Status/Perícias/Proficiências/Classes/Itens — cada lista chama
// wireDragReorder(container, seletor-das-unidades-arrastáveis, tabela) depois de desenhar seu
// HTML. Diferente do arraste de slot de equipamento (posição 2D livre em pixels): aqui só a ORDEM
// entre irmãos importa, então funciona tanto pra uma lista vertical simples quanto pra uma grade
// que quebra linha (itens) — a cada movimento acha o vizinho mais próximo do ponteiro e decide
// "antes" ou "depois" dele pela posição de leitura (linha primeiro, depois coluna).
const DRAG_HANDLE_SVG = `<span class="drag-handle" title="Arrastar ou usar as setas ↑↓ para reordenar" onclick="event.stopPropagation()">
  <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></span>`;
function wireDragReorder(container, unitSelector, table) {
  if (!container) return;
  const units = () => [...container.querySelectorAll(unitSelector)];
  units().forEach((unit) => {
    const handle = unit.querySelector('.drag-handle');
    if (!handle) return;
    handle.tabIndex = 0;
    handle.setAttribute('role', 'button');
    handle.setAttribute('aria-label', 'Reordenar — arraste ou use as setas para cima/baixo');
    // reordenar por teclado: move a unidade um passo pro vizinho lógico (mesma lista que o
    // arrasto respeita, nunca cruza pra painéis irmãos) e persiste do mesmo jeito que soltar o
    // mouse já fazia
    handle.onkeydown = (ev) => {
      if (ev.key !== 'ArrowUp' && ev.key !== 'ArrowDown') return;
      ev.preventDefault();
      const list = units();
      const idx = list.indexOf(unit);
      if (ev.key === 'ArrowUp') {
        if (idx <= 0) return;
        container.insertBefore(unit, list[idx - 1]);
      } else {
        if (idx < 0 || idx >= list.length - 1) return;
        container.insertBefore(unit, list[idx + 2] || null);
      }
      handle.focus();
      db.reorderRows(table, units().map((u) => u.dataset.id)).catch((e) => showMsg(e.message));
    };
    handle.onpointerdown = (ev) => {
      ev.preventDefault();
      unit.classList.add('dragging');
      // compara só com o vizinho lógico imediato (anterior/próximo NA LISTA, pulando painéis
      // irmãos como o de "Testar") e só troca quando o ponteiro cruza o meio dele — a versão
      // antiga comparava com TODOS os irmãos por distância euclidiana e reinseria a cada
      // pointermove, o que oscilava (e piscava) perto da fronteira entre duas posições
      const move = (e) => {
        const list = units();
        const idx = list.indexOf(unit);
        const prev = list[idx - 1];
        const next = list[idx + 1];
        if (prev) {
          const r = prev.getBoundingClientRect();
          if (e.clientY < r.top + r.height / 2) { container.insertBefore(unit, prev); return; }
        }
        if (next) {
          const r = next.getBoundingClientRect();
          if (e.clientY > r.top + r.height / 2) { container.insertBefore(unit, next.nextSibling); return; }
        }
      };
      const up = () => {
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        unit.classList.remove('dragging');
        db.reorderRows(table, units().map((u) => u.dataset.id)).catch((e) => showMsg(e.message));
      };
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    };
  });
}

let _statusDrafts = {}; // id -> {campo: valor} — nada grava no banco até "Salvar alterações"
window.onStatFieldChange = (id, k, v) => {
  const s = _statusStats.find((x) => x.id === id); if (s) s[k] = v.trim();
  if (!_statusDrafts[id]) { _statusDrafts[id] = {}; markDirty(); }
  _statusDrafts[id][k] = v.trim();
  const bar = $('status-save-bar'); if (bar) bar.style.display = 'flex';

window.saveAllStats = async () => {
  const ids = Object.keys(_statusDrafts);
  if (!ids.length) return;
  const btn = $('status-save-all'); if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  const ops = [];
  for (const id of ids) {
    const s = _statusStats.find((x) => x.id === id); if (!s) continue;
    const draft = _statusDrafts[id];
    const key = (s.formula_key || '').trim();
    if (draft.formula_key !== undefined && key && await isFormulaTokenTaken(key, { excludeStatId: id })) {
      showMsg(`"${key}" já é usado por outra coisa na fórmula (status, perícia, proficiência ou palavra reservada) — escolha outro apelido.`);
      if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
      return;
    }
    // mesma validação de sempre: nível 1 é só uma sonda pra checar sintaxe/referências antes de
    // gravar (o valor de verdade vem do personagem em tempo real na mesa)
    if (s.kind === 'computed' && draft.formula !== undefined) {
      const baseVals = {};
      _statusStats.forEach((b) => { if (b.kind !== 'computed' && (b.formula_key || '').trim()) baseVals[b.formula_key.trim()] = b.default_value || '0'; });
      try { computeStat(s, baseVals, undefined, 1); }
      catch (e) { showMsg(`Fórmula inválida em "${s.name}": ${e.message}`); if (btn) { btn.classList.remove('loading'); btn.disabled = false; } return; }
    }
    const patch = {};
    if (draft.name !== undefined) patch.name = s.name;
    if (draft.formula_key !== undefined) patch.formula_key = key;
    if (draft.color !== undefined) patch.color = s.color;
    if (draft.category !== undefined) patch.category = s.category.trim() || null;
    if (s.kind === 'computed') { if (draft.formula !== undefined) patch.formula = s.formula; }
    else if (draft.default_value !== undefined) patch.default_value = s.default_value;
    ops.push(db.updateStat(id, patch));
  }
  Promise.all(ops).then(() => {
    ids.forEach(() => clearDirty());
    _statusDrafts = {};
    const bar = $('status-save-bar'); if (bar) bar.style.display = 'none';
    showMsg('Salvo.', 'ok');
  }).catch((e) => showMsg(e.message))
    .finally(() => { if (btn) { btn.classList.remove('loading'); btn.disabled = false; } });
};

// dependentes de um "nome na fórmula" — varre as fórmulas dos outros status/perícias já
// carregados; não cobre fórmulas de itens (escala de dano/proteção), que vivem noutra aba
function statDependents(key, excludeId) {
  const k = (key || '').trim(); if (!k) return [];
  const re = new RegExp('(^|[^A-Za-zÀ-ú0-9_])' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^A-Za-zÀ-ú0-9_])');
  return _statusStats.filter((s) => s.id !== excludeId && s.kind === 'computed' && re.test(s.formula || '')).map((s) => s.name);
}
// checa se um "nome na fórmula" já está em uso — por palavra reservada (nivel, funções), por outro
// Status/Perícia ou por outra Proficiência. Busca status/proficiências direto do banco (não confia
// em _statusStats/_profsList — podem estar vazios/desatualizados se a aba dona deles ainda não foi
// visitada nesta sessão) pra validar contra dado de verdade. Usado por todo lugar que grava um
// alias de fórmula, pra nunca deixar dois tokens colidirem silenciosamente (um vira inalcançável —
// statByKey sempre resolve pro primeiro que achar).
async function isFormulaTokenTaken(key, { excludeStatId, excludeProfId } = {}) {
  const k = (key || '').trim(); if (!k) return false;
  const kl = k.toLowerCase();
  if (kl === 'nivel' || Object.prototype.hasOwnProperty.call(FORMULA_FUNCS, kl)) return true;
  const [stats, profs] = await Promise.all([db.listStats(systemId), db.listProficiencies(systemId)]);
  if (stats.some((s) => s.id !== excludeStatId && (s.formula_key || '').trim().toLowerCase() === kl)) return true;
  if (profs.some((p) => p.id !== excludeProfId && (p.formula_key || '').trim().toLowerCase() === kl)) return true;
  return false;
}
function formulaKeyTaken(key, excludeId) { return isFormulaTokenTaken(key, { excludeStatId: excludeId }); }
window.addStat = async (ev) => {

  if (formKey && await isFormulaTokenTaken(formKey)) { showMsg(`"${formKey}" já é usado por outra coisa na fórmula (status, perícia, proficiência ou palavra reservada) — escolha outro apelido.`); return false; }
  const type = $('st-type').value;

  const stat = { name, formula_key: formKey || null, sort_order: Date.now() % 100000, color: $('st-color')?.value || '#7ee6dc' };

    stat.kind = 'base'; stat.is_resource = false; stat.default_value = null;
  } else {
    stat.is_resource = true;
    if (type === 'resource-formula') { stat.kind = 'computed'; stat.formula = extra; }
    else { stat.kind = 'base'; stat.default_value = extra; }
  }
  db.createStat(systemId, stat).then(() => openTab('status')).catch((e) => showMsg(e.message));
  return false;
};
window.delStat = async (id) => {
  const s = _statusStats.find((x) => x.id === id);
  const deps = s ? statDependents(s.formula_key, id) : [];
  const ok = await confirmModal({
    title: 'Excluir status',
    desc: deps.length
      ? `A fórmula de "${deps.join('", "')}" usa este status — vai passar a dar erro ao calcular. Excluir mesmo assim?`
      : 'Não dá pra desfazer.',
    confirmLabel: 'Excluir',
  });
  if (!ok) return;
  db.deleteStat(id).then(() => openTab('status')).catch((e) => showMsg(e.message));
};

window.saveAllProfs = async () => {
  const ids = Object.keys(_profDrafts);
  if (!ids.length) return;
  const btn = $('prof-save-all'); if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  for (const id of ids) {
    const p = _profsList.find((x) => x.id === id); if (!p) continue;
    const draft = _profDrafts[id];
    const key = (p.formula_key || '').trim();
    if (draft.formula_key !== undefined && key && await isFormulaTokenTaken(key, { excludeProfId: id })) {
      showMsg(`"${key}" já é usado por outra coisa na fórmula (status, perícia, proficiência ou palavra reservada) — escolha outro apelido.`);
      if (btn) { btn.classList.remove('loading'); btn.disabled = false; }
      return;
    }
  }
  const ops = ids.map((id) => {
    const p = _profsList.find((x) => x.id === id); if (!p) return Promise.resolve();
    const draft = _profDrafts[id];
    const patch = {};
    if (draft.name !== undefined) patch.name = p.name;
    if (draft.formula_key !== undefined) patch.formula_key = p.formula_key.trim() || null;
    if (draft.category !== undefined) patch.category = p.category.trim() || null;
    return db.updateProficiency(id, patch);
  });
  Promise.all(ops).then(() => {
    ids.forEach(() => clearDirty());
    _profDrafts = {};
    showMsg('Salvo.', 'ok');
    openTab('proficiencias'); // pode ter mudado categoria — reagrupa as linhas

// insere um apelido puro (sem parênteses) na posição do cursor
function insertFuncToken(input, token) {
  const start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? input.value.length;
  input.setRangeText(token, start, end, 'end');
  input.focus();
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
// insere o esqueleto de uma função no cursor — se houver texto selecionado, vira o 1º argumento;
// funções de 2 argumentos deixam o próximo argumento a preencher pré-selecionado
function insertFuncSkeleton(input, info) {
  const start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? input.value.length;
  const hasSel = start !== end;
  const sel = hasSel ? input.value.slice(start, end) : '';
  let text, selStart, selEnd;
  if (info.args === 1) {
    text = `${info.key}(${sel})`;
    selStart = selEnd = hasSel ? start + text.length : start + info.key.length + 1;
  } else {
    const firstArg = hasSel ? sel : 'a';
    text = `${info.key}(${firstArg}, b)`;
    if (hasSel) { selStart = start + info.key.length + 1 + firstArg.length + 2; selEnd = selStart + 1; }
    else { selStart = start + info.key.length + 1; selEnd = selStart + 1; }
  }
  input.setRangeText(text, start, end, 'end');
  input.focus();
  input.setSelectionRange(selStart, selEnd);
  input.dispatchEvent(new Event('input', { bubbles: true }));
  input.dispatchEvent(new Event('change', { bubbles: true }));
}
function computeStat(stat, baseVals, seen = new Set(), level) {
  if (stat.kind !== 'computed') {
    const raw = baseVals[(stat.formula_key || '').trim()];
    const n = Number(raw);
    if (raw === undefined || raw === '' || isNaN(n)) throw new Error(`"${stat.formula_key || stat.name}" sem valor`);
    return n;
  }
  if (seen.has(stat.id)) throw new Error('referência circular');
  const seen2 = new Set(seen); seen2.add(stat.id);
  const tokens = (stat.formula || '').match(/[A-Za-zÀ-ú_][A-Za-zÀ-ú0-9_]*|\d+\.?\d*|[+\-*/(),]/g) || [];
  if (!tokens.length) throw new Error('fórmula vazia');
  const expr = tokens.map((tok, i) => {
    if (/^[\d.]/.test(tok) || /^[+\-*/(),]$/.test(tok)) return tok;
    const fn = FORMULA_FUNCS[tok.toLowerCase()];
    if (fn && tokens[i + 1] === '(') return fn;
    if (tok.toLowerCase() === 'nivel') {
      const lv = Number(level);
      if (level === undefined || level === null || level === '' || isNaN(lv)) throw new Error('"nivel" sem valor de teste');
      return '(' + lv + ')';
    }
    if (system.proficiency_bonus_formula_key && tok === system.proficiency_bonus_formula_key.trim()) {
      return '(' + computeStat({ id: '__prof_bonus__', kind: 'computed', formula: system.proficiency_bonus_formula || '0' }, baseVals, seen2, level) + ')';
    }
    const ref = statByKey(tok);
    if (!ref) throw new Error(`"${tok}" não é um status`);
    return '(' + computeStat(ref, baseVals, seen2, level) + ')';
  }).join(' ');
  const safetyProbe = expr.replace(/Math\.(round|floor|ceil|max|min)/g, '').replace(/\(function\(v,p\)\{return v\*p\/100;\}\)/g, '');
  if (!/^[\d+\-*/(),.\s]*$/.test(safetyProbe)) {
    const bad = safetyProbe.match(/[^\d+\-*/(),.\s]+/);
    throw new Error(`fórmula usa algo não permitido: "${bad ? bad[0] : safetyProbe.trim()}"`);
  }
  let r; try { r = Function('"use strict";return (' + expr + ')')(); } catch (e) { throw new Error('fórmula com erro de sintaxe (confira parênteses e operadores): ' + e.message); }
  if (!isFinite(r)) throw new Error('divisão por zero?');
  return Math.round(r * 1000) / 1000;
}

// ---------- editor em modal (igual ao de Classes) — status base, proficiências e resistências

window.openOriginEditor = (originId) => {
  const o = _originsFlat.find((x) => x.id === originId); if (!o) return;
  const isVariant = !!o.parent_id;
  const trigger = document.activeElement;
  const w = document.createElement('div');
  w.className = 'ui-modal';
  w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-labelledby', 'origin-editor-title');
  w.innerHTML = `<div class="box editor guide">
    <div class="ghead"><h3 id="origin-editor-title">${isVariant ? 'Editar variação' : 'Editar raça'} — ${esc(o.name)}</h3><button class="x" aria-label="Fechar">×</button></div>
    <div id="origin-editor-body">Carregando…</div>
    <p style="font-family:var(--mono);font-size:10.5px;color:var(--ink-faint);margin:14px 2px 0">
      Proficiências e resistências salvam na hora — só nome/descrição/cor/status base dependem do Salvar.</p>
    <div class="full actions" style="margin-top:10px">
      <button class="btn auto" id="origin-editor-cancel">Fechar</button>
      <button class="btn go auto" id="origin-editor-save"><span class="spin"></span>Salvar</button>
    </div>
  </div>`;
  const untrap = trapFocus(w);
  const close = () => { untrap(); w.remove(); document.removeEventListener('keydown', onEsc); window._closeOriginEditor = null; if (trigger && trigger.focus) trigger.focus(); };
  const onEsc = (e) => { if (e.key === 'Escape') close(); };
  w.addEventListener('click', (e) => { if (e.target === w) close(); });
  w.querySelector('.x').onclick = close;
  w.querySelector('#origin-editor-cancel').onclick = close;
  w.querySelector('#origin-editor-save').onclick = () => saveOriginEditor(originId);
  document.addEventListener('keydown', onEsc);
  document.body.appendChild(w);
  window._closeOriginEditor = close;
  renderOriginEditorBody(originId, isVariant);
};

window.saveOriginEditor = (originId) => {
  const o = _originsFlat.find((x) => x.id === originId); if (!o) return;
  const isVariant = !!o.parent_id;

  if (!isVariant) patch.color = $('oe-color')?.value || o.color;

function originFeatureRow(originId, f) {

window.addOriginFeature = (ev, originId) => {
  ev.preventDefault();

  db.createOriginFeature(originId, { name, sort_order: Date.now() % 100000 }).then(() => renderOriginFeaturesPanel(originId)).catch((e) => showMsg(e.message));
  return false;
};
window.updateOriginFeatureField = (originId, id, k, v) => {
  const val = k === 'level' ? (v.trim() === '' ? null : Number(v)) : (v.trim() || null);
  db.updateOriginFeature(id, { [k]: val }).catch((e) => showMsg(e.message));
};
window.delOriginFeature = async (originId, id) => {
  const ok = await confirmModal({ title: 'Excluir traço', desc: 'Remove esse traço de todo personagem que tenha essa raça. Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;
  db.deleteOriginFeature(id).then(() => renderOriginFeaturesPanel(originId)).catch((e) => showMsg(e.message));
};
window.toggleOriginFeatureMods = async (originId, featureId) => {
  const panel = $('ofeat-mods-' + featureId);
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }

  panel.innerHTML = `<div id="ofeat-mods-list-${featureId}"></div>
    <button type="button" class="btn auto sm" onclick="addOriginFeatureMod('${featureId}')">+ Modificador</button>
    <button type="button" class="btn go sm auto" style="margin-left:8px" onclick="saveOriginFeatureMods('${featureId}')">Salvar modificadores</button>`;

window.addOriginFeatureMod = (featureId, statId = '', amount = '') => {
  const list = $('ofeat-mods-list-' + featureId);
  const opts = JSON.parse($('ofeat-mods-' + featureId).dataset.statsJson || '[]');
  const row = document.createElement('div'); row.className = 'mod-row';
  row.innerHTML = `<select class="fld-input ofm-stat" style="flex:1">
      <option value="">— status —</option>
      ${opts.map((s) => `<option value="${s.id}" ${s.id === statId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
    </select>
    <input class="mv ofm-amount" placeholder="+/-, ex.: 2, piso(nivel/2)" value="${esc(amount)}">
    <button type="button" class="btn sm auto" style="flex-shrink:0" title="Inserir função ou apelido" onclick="openFuncPicker(this, this.previousElementSibling)">ƒ(x)</button>

};
window.saveOriginFeatureMods = (featureId) => {
  const modifiers = [...document.querySelectorAll('#ofeat-mods-list-' + featureId + ' .mod-row')]
    .map((r) => ({ stat_id: r.querySelector('.ofm-stat').value, amount: r.querySelector('.ofm-amount').value.trim() }))
    .filter((m) => m.stat_id && m.amount);

/* ===================== CONDIÇÕES / EFEITOS DE STATUS ===================== */
// catálogo + aplicação manual (na ficha, via mesa.html) — de propósito SEM duração/contador de
// turno: o Mestre aplica e remove na hora que achar que faz sentido, nada automático. Modificadores
// (opcionais) usam o mesmo formato {stat_id, amount} dos nós de árvore, pra entrar no mesmo
// pipeline de bônus que árvore/equipamento já alimentam (mesa.html soma tudo junto).
let _conditions = [];
let _condStats = [];
async function renderCondicoes(c) {
  const [conditions, stats] = await Promise.all([db.listConditions(systemId), db.listStats(systemId)]);
  _conditions = conditions; _condStats = stats; _condDrafts = {};
  c.innerHTML = `
    <div class="section-title" role="heading" aria-level="2">Condições e efeitos de status</div>
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.6;margin:0 0 14px">
      Envenenado, Atordoado, Amedrontado... o Mestre aplica e remove direto na ficha do jogador — sem duração automática,
      sem contador de turno, 100% interpretativo. Modificadores (opcionais) somam num status quando a condição está ativa.</p>
    ${condSaveBarHtml()}
    <div class="list" id="conditions-list">${conditions.length ? conditions.map(conditionRow).join('') : emptyState(ICONS.warning, 'Nenhuma condição ainda',
      'Crie a primeira condição no campo abaixo ↓')}</div>
    <form class="inline-form" style="margin-top:14px" onsubmit="return addCondition(event)">
      <input id="cond-name" placeholder="Nova condição (ex.: Envenenado)" required maxlength="40">
      <button class="btn go auto" type="submit">+ Criar condição</button>
    </form>`;
  wireDragReorder($('conditions-list'), '.list-row[data-id]', 'system_conditions');
}
function conditionRow(cond) {
  return `<div class="list-row" data-id="${cond.id}" style="flex-direction:column;align-items:stretch;gap:8px">
    <div style="display:flex;gap:8px;align-items:center">
      ${DRAG_HANDLE_SVG}
      <input value="${esc(cond.icon || '')}" placeholder="🩸" maxlength="4" onchange="onCondFieldChange('${cond.id}','icon',this.value)" id="cond-icon-${cond.id}"
        style="width:44px;text-align:center;background:var(--field);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-size:15px;padding:8px 4px">
      <button type="button" class="btn sm auto" style="flex-shrink:0;padding:8px 8px" title="Escolher emoji" aria-label="Escolher emoji para o ícone" onclick="openIconPicker(this, document.getElementById('cond-icon-${cond.id}'))">▾</button>
      <input class="nm" value="${esc(cond.name)}" onchange="onCondFieldChange('${cond.id}','name',this.value)"
        style="flex:1;background:transparent;border:0;color:var(--bone);font-family:var(--disp);font-size:16px">
      <button type="button" class="color-swatch" style="--sw:${esc(cond.color || '#f2585e')}" title="Cor do selo na ficha" onclick="openColorPicker(this, '${esc(cond.color || '#f2585e')}', (v)=>updateConditionColor('${cond.id}',v))"></button>
      <button class="btn sm auto" onclick="toggleConditionMods('${cond.id}')">Modificadores ▾</button>
      <button class="btn sm danger auto" title="Excluir condição" aria-label="Excluir condição ${esc(cond.name)}" onclick="delCondition('${cond.id}')"><span class="ic">${ICONS.x}</span></button>
    </div>
    <input value="${esc(cond.description || '')}" placeholder="Descrição (opcional) — o que essa condição significa..."
      onchange="onCondFieldChange('${cond.id}','description',this.value)"
      style="background:transparent;border:0;color:var(--ink-dim);font-family:var(--serif);font-size:12.5px;width:100%;padding:0 2px">
    <div class="base-panel" id="cond-mods-${cond.id}" style="display:none"></div>
  </div>`;
}
window.addCondition = (ev) => {
  ev.preventDefault();
  const name = $('cond-name').value.trim(); if (!name) return false;
  db.createCondition(systemId, { name, sort_order: Date.now() % 100000 }).then(() => openTab('condicoes')).catch((e) => showMsg(e.message));
  return false;
};
// mesma barra única de salvar de Status/Perícias/Proficiências — campos livres (nome, ícone,
// descrição) só gravam ao clicar "Salvar alterações"; a cor continua salvando na hora (controle
// discreto, não texto livre)
function condSaveBarHtml() {
  return `<div class="surface" id="cond-save-bar" style="display:none;margin-bottom:16px;align-items:center;gap:12px;border-color:var(--brass)">
    <span style="font-family:var(--mono);font-size:11.5px;color:var(--brass)">Você tem alterações não salvas nesta aba.</span>
    <button class="btn go auto sm" style="margin-left:auto;width:auto" id="cond-save-all" onclick="saveAllConds()"><span class="spin"></span>Salvar alterações</button>
  </div>`;
}
let _condDrafts = {}; // id -> {campo: valor} — nada grava no banco até "Salvar alterações"
window.onCondFieldChange = (id, k, v) => {
  const cond = _conditions.find((x) => x.id === id); if (cond) cond[k] = v.trim();
  if (!_condDrafts[id]) { _condDrafts[id] = {}; markDirty(); }
  _condDrafts[id][k] = v.trim();
  const bar = $('cond-save-bar'); if (bar) bar.style.display = 'flex';
};
window.updateConditionColor = (id, v) => {
  const cond = _conditions.find((x) => x.id === id); if (cond) cond.color = v;
  db.updateCondition(id, { color: v || null }).catch((e) => showMsg(e.message));
};
window.saveAllConds = () => {
  const ids = Object.keys(_condDrafts);
  if (!ids.length) return;
  const btn = $('cond-save-all'); if (btn) { btn.classList.add('loading'); btn.disabled = true; }
  const ops = ids.map((id) => {
    const cond = _conditions.find((x) => x.id === id); if (!cond) return Promise.resolve();
    const draft = _condDrafts[id];
    const patch = {};
    if (draft.name !== undefined) patch.name = cond.name;
    if (draft.icon !== undefined) patch.icon = cond.icon.trim() || null;
    if (draft.description !== undefined) patch.description = cond.description.trim() || null;
    return db.updateCondition(id, patch);
  });
  Promise.all(ops).then(() => {
    ids.forEach(() => clearDirty());
    _condDrafts = {};
    const bar = $('cond-save-bar'); if (bar) bar.style.display = 'none';
    showMsg('Salvo.', 'ok');
  }).catch((e) => showMsg(e.message))
    .finally(() => { if (btn) { btn.classList.remove('loading'); btn.disabled = false; } });
};
window.delCondition = async (id) => {
  const ok = await confirmModal({ title: 'Excluir condição', desc: 'Remove ela de qualquer personagem que a tenha ativa agora. Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;
  db.deleteCondition(id).then(() => openTab('condicoes')).catch((e) => showMsg(e.message));
};
window.toggleConditionMods = (condId) => {
  const panel = $('cond-mods-' + condId);
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }
  const cond = _conditions.find((x) => x.id === condId);
  const resStats = _condStats.filter((s) => !s.is_resource); // modificador soma num status/perícia, igual aos nós de árvore
  panel.innerHTML = `<div id="cond-mods-list-${condId}"></div>
    <button type="button" class="btn auto sm" onclick="addCondMod('${condId}')">+ Modificador</button>
    <button type="button" class="btn go sm auto" style="margin-left:8px" onclick="saveConditionMods('${condId}')">Salvar modificadores</button>`;
  panel.dataset.statsJson = JSON.stringify(resStats.map((s) => ({ id: s.id, name: s.name })));
  panel.style.display = '';
  (cond?.modifiers || []).forEach((m) => addCondMod(condId, m.stat_id, m.amount));
  if (!(cond?.modifiers || []).length) addCondMod(condId);
};
window.addCondMod = (condId, statId = '', amount = '') => {
  const list = $('cond-mods-list-' + condId);
  const opts = JSON.parse($('cond-mods-' + condId).dataset.statsJson || '[]');
  // um modificador salvo pode apontar pra um status que já foi excluído — em vez de cair calado
  // pro "— status —" (parece que nunca foi escolhido nada), avisa e força escolher de novo; como o
  // valor da opção fica vazio, salvar sem mexer descarta a linha (não perpetua a referência morta)
  const orphaned = statId && !opts.some((s) => s.id === statId);
  const row = document.createElement('div'); row.className = 'mod-row';
  row.innerHTML = `<select class="fld-input cm-stat" style="flex:1">
      <option value="" ${orphaned ? 'selected' : ''}>${orphaned ? '⚠ status excluído — escolha outro (some ao salvar)' : '— status —'}</option>
      ${opts.map((s) => `<option value="${s.id}" ${s.id === statId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
    </select>
    <input class="mv cm-amount" placeholder="+/-, ex.: -2" value="${esc(amount)}">
    <button type="button" class="btn sm auto" style="flex-shrink:0" title="Inserir função ou apelido" onclick="openFuncPicker(this, this.previousElementSibling)">ƒ(x)</button>
    <button type="button" title="Remover modificador" aria-label="Remover modificador" onclick="this.parentElement.remove()"><span class="ic">${ICONS.x}</span></button>`;
  list.appendChild(row);
};
window.saveConditionMods = (condId) => {
  const modifiers = [...document.querySelectorAll('#cond-mods-list-' + condId + ' .mod-row')]
    .map((r) => ({ stat_id: r.querySelector('.cm-stat').value, amount: r.querySelector('.cm-amount').value.trim() }))
    .filter((m) => m.stat_id && m.amount);
  db.updateCondition(condId, { modifiers }).then(() => {
    const cond = _conditions.find((x) => x.id === condId); if (cond) cond.modifiers = modifiers;
    showMsg('Modificadores salvos.', 'ok');
  }).catch((e) => showMsg(e.message));
};

/* ===================== NÍVEL ===================== */
// progressão automática em duas camadas:
// 1) um PADRÃO por nível (pontos de status + pontos por árvore) que vale pra todo nível daí pra
//    frente — não precisa mais criar uma linha por nível um a um.
// 2) EXCEÇÕES pontuais: um nível específico pode substituir o padrão (ex.: "nível 10 dá o dobro").
// O personagem começa no nível 1 (sem concessão); ao subir de nível na ficha, o resync soma o
// padrão (ou a exceção, se houver) de cada nível pulado desde o último já pago — nunca retroage,
// nunca sobrescreve o que já foi dado.
let _nivelTrees = [];
async function renderNivel(c) {
  const [levels, levelTrees, trees] = await Promise.all([
    db.listSystemLevels(systemId), db.listSystemLevelTrees(systemId), db.listSystemTrees(systemId),
  ]);
  _nivelTrees = trees;
  // uma linha de exceção por nível que apareça em QUALQUER uma das duas tabelas — um nível pode
  // existir só pra mexer numa árvore, sem tocar no status, ou vice-versa
  const nums = [...new Set([...levels.map((l) => l.level), ...levelTrees.map((l) => l.level)])].sort((a, b) => a - b);
  const statByLevel = {}; levels.forEach((l) => { statByLevel[l.level] = l.stat_points; });
  const treeByLevel = {};
  levelTrees.forEach((l) => { (treeByLevel[l.level] || (treeByLevel[l.level] = {}))[l.tree_id] = l.points; });
  c.innerHTML = `
    <div class="section-title" role="heading" aria-level="2">Progressão de nível</div>
    <p style="font-family:var(--mono);font-size:11px;color:var(--ink-dim);line-height:1.6;margin:0 0 16px">
      Todo personagem começa no <b>nível 1</b>, sem concessão. Configure um <b style="color:var(--brass)">padrão por nível</b> — vale pra todo nível seguinte, sem precisar cadastrar um por um — e, se algum nível específico precisar fugir da regra, adicione uma <b>exceção</b> só pra ele.</p>

    <div class="section-title" role="heading" aria-level="2" style="font-size:12px;margin-bottom:10px">Padrão por nível</div>

    <div class="sub" style="margin:0 0 8px;color:var(--brass);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-family:var(--mono)">Pontos de status</div>
    <div class="item-form" style="margin-bottom:20px">
      <div class="fld full"><label>Pontos de status concedidos por nível</label>
        <input type="number" min="0" value="${system.level_stat_points_default || 0}" onchange="updateLevelDefault(this.value)"></div>
    </div>

    <div class="sub" style="margin:0 0 8px;color:var(--maq);text-transform:uppercase;letter-spacing:.1em;font-size:10px;font-family:var(--mono)">Pontos de árvore de habilidade</div>
    ${trees.length ? `
    <div class="item-form">
      ${trees.map((t) => `<div class="fld"><label>${esc(t.name)}</label>
        <input type="number" min="0" value="${t.level_points_default || 0}" onchange="updateTreeLevelDefault('${t.id}', this.value)"></div>`).join('')}
    </div>` : `<p style="font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin:0 0 20px">
      Este sistema ainda não tem nenhuma árvore de habilidade — crie uma na aba <b>Árvores</b> pra configurar quantos pontos ela concede por nível aqui.</p>`}

    <div class="section-title" role="heading" aria-level="2" style="font-size:12px;margin-top:24px;margin-bottom:10px">Exceções por nível <span style="color:var(--ink-faint);text-transform:none;letter-spacing:0">(substituem o padrão só naquele nível — deixe em branco pra voltar a usar o padrão)</span></div>
    <div class="list">${nums.length ? nums.map((n) => levelRow(n, statByLevel[n], treeByLevel[n] || {}, trees)).join('') : emptyState(ICONS.levelUp, 'Nenhuma exceção ainda',
      'Todo nível usa o padrão configurado acima. Crie uma exceção só quando um nível específico precisar fugir da regra.')}</div>

    <form class="inline-form" style="margin-top:14px" onsubmit="return addLevel(event)">
      <input id="lv-level" type="number" min="2" placeholder="Nível da exceção (ex.: 10)" required style="max-width:220px">
      <button class="btn go auto" type="submit">+ Adicionar exceção</button>
    </form>`;
}
function levelRow(level, statPoints, treeGrants, trees) {
  return `<div class="list-row" style="flex-direction:column;align-items:stretch;gap:12px">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="grow nm">Nível ${level}</div>
      <button class="btn sm danger auto" title="Excluir exceção de nível" aria-label="Excluir exceção do nível ${level}" onclick="delLevel(${level})"><span class="ic">${ICONS.x}</span></button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:18px">
      <div style="flex:1 1 150px;min-width:150px">
        <div class="sub" style="color:var(--brass);text-transform:uppercase;letter-spacing:.1em;font-size:9px;font-family:var(--mono);margin-bottom:6px">Pontos de status</div>
        <input type="number" min="0" value="${statPoints ?? ''}" placeholder="usa o padrão"
          style="width:100%;background:var(--field);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-family:var(--mono);padding:8px 10px"
          onchange="updateLevelPoints(${level}, this.value)">
      </div>
      ${trees.length ? `<div style="flex:2 1 240px;min-width:200px">
        <div class="sub" style="color:var(--maq);text-transform:uppercase;letter-spacing:.1em;font-size:9px;font-family:var(--mono);margin-bottom:6px">Pontos de árvore de habilidade</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${trees.map((t) => `<label style="display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;color:var(--ink-dim)">${esc(t.name)}
            <input type="number" min="0" value="${treeGrants[t.id] ?? ''}" placeholder="padrão"
              style="width:90px;background:var(--field);border:1px solid var(--line2);border-radius:8px;color:var(--ink);font-family:var(--mono);padding:7px 9px"
              onchange="updateLevelTreePoints(${level}, '${t.id}', this.value)"></label>`).join('')}
        </div>
      </div>` : ''}
    </div>
  </div>`;
}
window.addLevel = (ev) => {
  ev.preventDefault();
  const level = parseInt($('lv-level').value);
  if (!level || level < 2) { showMsg('O nível precisa ser 2 ou mais (o nível 1 é o inicial, sem concessão).'); return false; }
  db.setSystemLevel(systemId, level, null).then(() => openTab('nivel')).catch((e) => showMsg(e.message));
  return false;
};
window.updateLevelDefault = (v) => {
  const points = parseInt(v) || 0;
  db.updateSystem(systemId, { level_stat_points_default: points })
    .then(() => { system.level_stat_points_default = points; showMsg('Salvo.', 'ok'); }).catch((e) => showMsg(e.message));
};
window.updateTreeLevelDefault = (treeId, v) => {
  const points = parseInt(v) || 0;
  db.updateSystemTree(treeId, { level_points_default: points }).then(() => {
    const t = _nivelTrees.find((x) => x.id === treeId); if (t) t.level_points_default = points;
    showMsg('Salvo.', 'ok');
  }).catch((e) => showMsg(e.message));
};
window.updateLevelPoints = (level, v) => {
  const t = v.trim();
  db.setSystemLevel(systemId, level, t === '' ? null : (parseInt(t) || 0)).then(() => showMsg('Salvo.', 'ok')).catch((e) => showMsg(e.message));
};

window.toggleAssign = (treeId, classId, cb) => {

// moldura de raridade "premium" (mesmo padrão de app.html, duplicado aqui de propósito —
// convenção do projeto de não compartilhar helpers de UI entre páginas): decorações internas
// pra dentro do .poster-card/.list-row, que é envolvido por um .rar-frame (borda em degradê animado).
function posterRarityLayers(rarity) {
  const glintSpots = {
    'Épico': [[16, 22]],
    'Lendário': [[18, 18], [80, 28], [14, 66], [84, 86]],
    'Único': [[12, 14], [82, 20], [6, 36], [90, 46], [16, 64], [86, 78], [24, 94], [72, 90], [48, 10], [46, 56], [66, 48]],
  };
  const spots = glintSpots[rarity] || [];
  let glints = '';
  spots.forEach((p, i) => {
    const delay = (i * 0.28).toFixed(2);
    const dur = (2.1 + (i % 4) * 0.3).toFixed(2);
    const size = 8 + (i % 3) * 2;
    glints += `<i class="pc-glint" style="left:${p[0]}%;top:${p[1]}%;width:${size}px;height:${size}px;animation-delay:${delay}s;animation-duration:${dur}s"></i>`;
  });
  let extra = '';
  if (rarity === 'Épico' || rarity === 'Único') extra += `<span class="pc-sweep"></span>`;
  if (rarity === 'Lendário' || rarity === 'Único') extra += `<span class="pc-highlight"></span><span class="pc-topline"></span><span class="pc-core"></span>`;
  if (rarity === 'Único') extra += `<span class="pc-sweep pc-sweep2"></span><span class="pc-ring"></span><span class="pc-ring pc-ring2"></span>`;
  return extra + glints;
}

window.saveSysItem = async () => {
  clearSiFieldErrors();
  const name = $('si-name').value.trim(); if (!name) { showMsg('Dê um nome ao item.'); return; }
  const modifiers = [...document.querySelectorAll('#si-mods .mod-row')].map((r) => ({ stat_id: r.querySelector('.mn').value, value: r.querySelector('.mv').value.trim() })).filter((m) => m.stat_id && m.value);
  const consumeEffects = [...document.querySelectorAll('#si-consume-effects .mod-row')].map((r) => ({ stat_id: r.querySelector('.ce-stat').value, amount: r.querySelector('.ce-amount').value.trim() })).filter((e) => e.stat_id && e.amount);
  const category = $('si-cat').value;
  const weaponDamage = $('si-damage').value.trim();
  const protectionRaw = $('si-protection').value;
  let firstInvalid = null;
  if (category === 'Arma') {
    if (!weaponDamage) { setSiFieldError('si-damage', 'si-damage-err', 'Informe o dano (ex.: 1d8+2).'); firstInvalid = firstInvalid || 'si-damage'; }
  } else if (category === 'Armadura' || category === 'Escudo') {
    if (protectionRaw === '') { setSiFieldError('si-protection', 'si-protection-err', 'Informe o valor de proteção.'); firstInvalid = firstInvalid || 'si-protection'; }
  } else if (category === 'Acessório' || category === 'Artefato') {
    if (!modifiers.length) { $('si-mods-err').textContent = 'Adicione pelo menos 1 modificador pra esta categoria.'; $('si-mods-err').classList.add('show'); firstInvalid = firstInvalid || 'si-mods-add'; }
  }
  if (firstInvalid) { $(firstInvalid).focus(); return; }
  try {
    if (_siImgFile) { showMsg('Enviando imagem…', 'ok'); _siImgUrl = await db.uploadImage(_siImgFile, 'items'); }
    const isProtective = category === 'Armadura' || category === 'Escudo';
    const priceRaw = $('si-price').value;
    const weightEl = $('si-weight');
    const payload = {
      name, category, rarity: $('si-rar').value, description: $('si-desc').value.trim(), modifiers, image_url: _siImgUrl,
      weapon_damage: category === 'Arma' ? weaponDamage : null,
      damage_scale: category === 'Arma' ? ($('si-damage-scale').value || null) : null,
      protection: isProtective ? Number(protectionRaw) : null,
      protection_scale: isProtective ? ($('si-protection-scale').value || null) : null,
      proficiency_id: $('si-prof').value || null,
      equipment_type: $('si-eqtype').value.trim() || null,
      price: priceRaw === '' ? null : Number(priceRaw),
      currency_id: $('si-currency').value || null,
      weight: weightEl ? (weightEl.value === '' ? null : Number(weightEl.value)) : null,
      damage_type_id: category === 'Arma' ? ($('si-damage-type').value || null) : null,
      consume_effects: category === 'Consumível' ? consumeEffects : null,
    };
    const editing = $('sysitem-editor').dataset.editing;
    await (editing ? db.updateSystemItem(editing, payload) : db.createSystemItem(systemId, payload));
    openTab('itens');
  } catch (e) { showMsg(e.message); }
};

  const h = Math.max(200, Math.min(1000, parseInt(value) || 760));
  $('eq-board-h').value = h;
  system.equipment_board_h = h;
  const board = $('eq-board'); if (board) board.style.minHeight = h + 'px';
  db.updateSystem(systemId, { equipment_board_h: h }).catch((e) => showMsg(e.message));
};
// vazio = volta a preencher a largura disponível (auto, como era antes desse controle existir)
window.onEqBoardWidth = (value) => {
  const raw = (value || '').trim();
  const w = raw ? Math.max(300, Math.min(1500, parseInt(raw) || 0)) : 0;
  $('eq-board-w').value = w || '';
  system.equipment_board_w = w || null;
  const board = $('eq-board');
  if (board) { board.style.width = w ? w + 'px' : ''; board.style.flex = w ? '0 0 auto' : ''; }
  db.updateSystem(systemId, { equipment_board_w: w || null }).catch((e) => showMsg(e.message));
};
window.onEqBgImg = async (input) => {
  const f = input.files && input.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { showMsg('Selecione um arquivo de imagem.'); input.value = ''; return; }
  if (f.size > 5 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 5 MB).'); input.value = ''; return; }
  try {
    showMsg('Enviando imagem…', 'ok');
    const url = await db.uploadImage(f, 'equipment-bg');
    system.equipment_bg_url = url;
    await db.updateSystem(systemId, { equipment_bg_url: url });
    openTab('equipamento');
  } catch (e) { showMsg(e.message); }
};
window.clearEqBg = async () => {
  const ok = await confirmModal({ title: 'Remover imagem de fundo', desc: 'A tela de equipamentos volta a mostrar só a grade.', confirmLabel: 'Remover' });
  if (!ok) return;
  system.equipment_bg_url = null;
  db.updateSystem(systemId, { equipment_bg_url: null }).then(() => openTab('equipamento')).catch((e) => showMsg(e.message));
};
function eqSlotHtml(s) {
  return `<div class="eq-slot${_eqSelected.has(s.id) ? ' selected' : ''}" data-id="${s.id}" style="left:${s.pos_x}%;top:${s.pos_y}%;width:${s.width}px;height:${s.height}px;${s.silhouette_url ? `background-image:url('${esc(s.silhouette_url)}')` : ''}"
    onpointerdown="onEqSlotPointerDown(event,'${s.id}')" onclick="onEqSlotClick(event,'${s.id}')">
    <span class="eq-slot-label">${esc(s.name)}</span>
  </div>`;
}
// redesenha só o quadro (não a aba toda) — usado depois de criar/salvar/excluir slot(s), pra
// refletir posição/tamanho/seleção sem re-render geral
function redrawEqBoard() {
  const board = $('eq-board'); if (!board) return;
  const bgUrl = system.equipment_bg_url || null;
  board.innerHTML = `
    ${bgUrl ? `<div class="eq-board-bgimg" style="background-image:url('${esc(bgUrl)}')"></div>` : ''}
    ${_eqSlots.length ? _eqSlots.map(eqSlotHtml).join('') : ''}
    ${!_eqSlots.length ? '<div class="eq-board-empty">Nenhum slot ainda — clique em "+ Novo slot" pra começar.</div>' : ''}`;
}
window.addEqSlot = async () => {
  try {
    const s = await db.createEquipmentSlot(systemId, { name: 'Novo slot', pos_x: 50, pos_y: 50, width: 72, height: 72, sort_order: Date.now() % 100000 });
    // insere só o slot novo (e seleciona ele) em vez de re-renderizar a aba inteira — evita o
    // "piscar" de tela e mantém os outros slots intactos
    _eqSlots.push(s);
    _eqSelected = new Set([s.id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
  } catch (e) { showMsg(e.message); }
};
// arrastar reposiciona (pointer events, mesmo padrão do editor de árvore) — só conta como clique
// de seleção se o ponteiro não se moveu (senão todo arraste também trocaria a seleção)
// mesmo tamanho da grade desenhada em .eq-board::before (theme.css) — precisa bater certinho pra
// o slot encaixar exatamente nos cruzamentos das linhas
const EQ_GRID_PX = 32;
// a grade é centralizada no quadro (background-position:center), então os cruzamentos ficam em
// "centro ± múltiplo de 32px", não em "0, 32, 64..." — encaixa relativo ao centro do eixo
function eqSnapPx(px, dim) {
  const center = dim / 2;
  return center + Math.round((px - center) / EQ_GRID_PX) * EQ_GRID_PX;
}
window.onEqSlotPointerDown = (ev, id) => {
  const board = $('eq-board'); const el = ev.currentTarget;
  ev.preventDefault(); el.setPointerCapture(ev.pointerId);
  _eqDragMoved = false;
  const boardRect = board.getBoundingClientRect();
  const startX = ev.clientX, startY = ev.clientY;
  const slot = _eqSlots.find((s) => s.id === id); if (!slot) return;
  const startPx = Number(slot.pos_x), startPy = Number(slot.pos_y);
  let pendingX = startPx, pendingY = startPy;
  const mv = (e) => {
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) + Math.abs(dy) > 4) _eqDragMoved = true;
    const rawX = Math.min(100, Math.max(0, startPx + (dx / boardRect.width) * 100));
    const rawY = Math.min(100, Math.max(0, startPy + (dy / boardRect.height) * 100));
    // encaixa nos cruzamentos da grade de fundo — assim os slots ficam sempre alinhados entre si
    // em vez de depender de precisão de olho no arraste
    pendingX = Math.min(100, Math.max(0, (eqSnapPx((rawX / 100) * boardRect.width, boardRect.width) / boardRect.width) * 100));
    pendingY = Math.min(100, Math.max(0, (eqSnapPx((rawY / 100) * boardRect.height, boardRect.height) / boardRect.height) * 100));
    el.style.left = pendingX + '%'; el.style.top = pendingY + '%';
  };
  const up = () => {
    el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up);
    if (_eqDragMoved) {
      slot.pos_x = pendingX; slot.pos_y = pendingY;
      db.updateEquipmentSlot(id, { pos_x: pendingX, pos_y: pendingY }).catch((e) => showMsg(e.message));
      // painel lateral (X/Y) fica com o valor antigo até o próximo re-render se não sincronizar
      // aqui — o arraste já move o slot na hora, os campos numéricos ficavam desatualizados
      const xInp = $('eqs-x'), yInp = $('eqs-y');
      if (xInp && yInp && _eqSelected.size === 1 && _eqSelected.has(id)) { xInp.value = pendingX; yInp.value = pendingY; }
    }
  };
  el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
};
window.onEqSlotClick = (ev, id) => {
  if (_eqDragMoved) { _eqDragMoved = false; return; }
  const multi = ev.shiftKey || ev.ctrlKey || ev.metaKey;
  if (multi) {
    if (_eqSelected.has(id)) { if (_eqSelected.size > 1) _eqSelected.delete(id); } // nunca fica sem nenhum selecionado
    else _eqSelected.add(id);
  } else {
    _eqSelected = new Set([id]);
  }
  document.querySelectorAll('#eq-board .eq-slot').forEach((el) => el.classList.toggle('selected', _eqSelected.has(el.dataset.id)));
  renderEqEditorPanel();
};
// tira um slot da seleção múltipla a partir de um chip no painel de lote (mantém >=1 selecionado)
window.eqSelectAll = () => {
  _eqSelected = new Set(_eqSlots.map((s) => s.id));
  document.querySelectorAll('#eq-board .eq-slot').forEach((el) => el.classList.toggle('selected', _eqSelected.has(el.dataset.id)));
  renderEqEditorPanel(true);
};
window.eqDeselect = (id) => {
  if (_eqSelected.size <= 1) return;
  _eqSelected.delete(id);
  document.querySelectorAll('#eq-board .eq-slot').forEach((el) => el.classList.toggle('selected', _eqSelected.has(el.dataset.id)));
  renderEqEditorPanel(true);
};
// painel lateral — mostra o editor de 1 slot, ou um editor em lote quando há vários selecionados;
// "force" ignora o cache de chave (usado depois de salvar/criar/excluir, quando o conteúdo mudou
// mas o conjunto de ids selecionados pode ter ficado igual)
function renderEqEditorPanel(force = false) {
  const panel = $('eq-slot-editor'); if (!panel) return;
  const ids = [..._eqSelected].filter((id) => _eqSlots.some((s) => s.id === id));
  _eqSelected = new Set(ids);
  const key = ids.slice().sort().join(',');
  if (!force && key === _eqPanelKey) return; // evita resetar upload de imagem pendente ao re-selecionar o mesmo slot
  _eqPanelKey = key;
  if (!ids.length) { panel.innerHTML = '<div class="empty">Crie um slot pra começar a editar.</div>'; return; }
  if (ids.length === 1) {
    const s = _eqSlots.find((x) => x.id === ids[0]);
    _eqsImgUrl = s.silhouette_url || null; _eqsImgFile = null;
    panel.innerHTML = `
      <div class="surface">
        <h4 style="font-family:var(--disp);font-size:15px;color:var(--bone);margin:0 0 14px">Editar slot</h4>
        <div class="item-form">
          <div class="fld"><label for="eqs-name">Nome do slot</label><input id="eqs-name" maxlength="40" value="${esc(s.name)}"></div>
          <div class="fld"><label for="eqs-type">Tipo de item aceito</label>
            <select id="eqs-type" class="fld-input">${equipTypeOptionsHtml(s.accepts_type || '', 'Qualquer item')}</select>
          </div>
          <div class="fld"><label for="eqs-w">Largura (px)</label><input id="eqs-w" type="number" min="32" max="220" value="${s.width}"></div>
          <div class="fld"><label for="eqs-h">Altura (px)</label><input id="eqs-h" type="number" min="32" max="220" value="${s.height}"></div>
          <div class="fld"><label for="eqs-x">Posição X (%)</label><input id="eqs-x" type="number" min="0" max="100" step="0.5" value="${s.pos_x}"></div>
          <div class="fld"><label for="eqs-y">Posição Y (%)</label><input id="eqs-y" type="number" min="0" max="100" step="0.5" value="${s.pos_y}"></div>
          <div class="fld full"><label for="eqs-img-file">Silhueta <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(fundo mostrado quando o slot está vazio)</span></label>
            <div class="img-picker">
              <img id="eqs-img-prev" class="img-thumb" alt="" ${s.silhouette_url ? `src="${esc(s.silhouette_url)}"` : 'style="display:none"'}>
              <div class="img-actions">
                <input type="file" id="eqs-img-file" accept="image/*" style="display:none" onchange="onEqsImg(this)">
                <button type="button" class="btn auto sm" onclick="document.getElementById('eqs-img-file').click()">Escolher imagem</button>
                <button type="button" class="btn auto sm" id="eqs-img-rm" ${s.silhouette_url ? '' : 'style="display:none"'} onclick="clearEqsImg()">Remover</button>
              </div>
            </div>
          </div>
          <div class="full actions">
            <button class="btn danger auto" onclick="delEqSlot('${s.id}')">Excluir slot</button>
            <button class="btn auto" onclick="duplicateEqSlot('${s.id}')">Duplicar</button>
            <button class="btn go auto" onclick="saveEqSlot('${s.id}')">Salvar</button>
          </div>
        </div>
      </div>`;
    return;
  }
  const list = ids.map((id) => _eqSlots.find((s) => s.id === id)).filter(Boolean);
  panel.innerHTML = `
    <div class="surface">
      <h4 style="font-family:var(--disp);font-size:15px;color:var(--bone);margin:0 0 14px">${list.length} slots selecionados</h4>
      <div class="list" style="margin-bottom:14px">${list.map((s) => `<div class="list-row"><div class="grow"><div class="nm">${esc(s.name)}</div></div>
        <button class="btn sm auto" onclick="eqDeselect('${s.id}')" title="Tirar da seleção"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`).join('')}</div>
      <div class="item-form">
        <div class="fld full"><label>Tipo de item aceito <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(aplica a todos)</span></label>
          <select id="eqb-type" class="fld-input">
            <option value="">— não alterar —</option>
            <option value="__none__">Qualquer item (remove a restrição)</option>
            ${EQUIP_TYPES.map((t) => `<option value="${esc(t)}">${esc(t)}</option>`).join('')}
          </select>
        </div>
        <div class="fld"><label>Largura (px) <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(vazio não altera)</span></label><input id="eqb-w" type="number" min="32" max="220" placeholder="—"></div>
        <div class="fld"><label>Altura (px) <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(vazio não altera)</span></label><input id="eqb-h" type="number" min="32" max="220" placeholder="—"></div>
        <div class="full actions">
          <button class="btn danger auto" onclick="delEqSlotsBatch()">Excluir selecionados</button>
          <button class="btn go auto" onclick="saveEqSlotsBatch()">Aplicar a todos</button>
        </div>
      </div>
    </div>`;
}
window.onEqsImg = (input) => {
  const f = input.files && input.files[0]; if (!f) return;
  if (!f.type.startsWith('image/')) { showMsg('Selecione um arquivo de imagem.'); input.value = ''; return; }
  if (f.size > 3 * 1024 * 1024) { showMsg('Imagem muito grande (máx. 3 MB).'); input.value = ''; return; }
  _eqsImgFile = f;
  const p = $('eqs-img-prev'); p.src = URL.createObjectURL(f); p.style.display = ''; $('eqs-img-rm').style.display = '';
};
window.clearEqsImg = () => {
  _eqsImgFile = null; _eqsImgUrl = null; $('eqs-img-file').value = '';
  const p = $('eqs-img-prev'); p.removeAttribute('src'); p.style.display = 'none'; $('eqs-img-rm').style.display = 'none';
};
window.saveEqSlot = async (id) => {
  const name = $('eqs-name').value.trim(); if (!name) { showMsg('Dê um nome ao slot.'); return; }
  try {
    if (_eqsImgFile) { showMsg('Enviando imagem…', 'ok'); _eqsImgUrl = await db.uploadImage(_eqsImgFile, 'slots'); }
    const clampPct = (v, fallback) => { const n = parseFloat(v); return isNaN(n) ? fallback : Math.max(0, Math.min(100, n)); };
    const patch = {
      name, accepts_type: $('eqs-type').value.trim() || null,
      width: parseInt($('eqs-w').value) || 72, height: parseInt($('eqs-h').value) || 72,
      pos_x: clampPct($('eqs-x')?.value, 50), pos_y: clampPct($('eqs-y')?.value, 50),
      silhouette_url: _eqsImgUrl,
    };
    await db.updateEquipmentSlot(id, patch);
    const s = _eqSlots.find((x) => x.id === id); if (s) Object.assign(s, patch);
    redrawEqBoard();
    renderEqEditorPanel(true);
    showMsg('Slot salvo.', 'ok');
  } catch (e) { showMsg(e.message); }
};
window.delEqSlot = async (id) => {
  const ok = await confirmModal({ title: 'Excluir slot', desc: 'Itens equipados nesse slot voltam pra mochila do jogador. Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;
  try {
    await db.deleteEquipmentSlot(id);
    _eqSlots = _eqSlots.filter((s) => s.id !== id);
    _eqSelected.delete(id);
    if (!_eqSelected.size && _eqSlots.length) _eqSelected = new Set([_eqSlots[0].id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
  } catch (e) { showMsg(e.message); }
};
// duplica um slot inteiro (nome, tipo, tamanho, silhueta) num offset pequeno — paper dolls quase
// sempre têm pares simétricos (anéis, botas, luvas), então repetir tipo/tamanho na mão toda vez
// era o gargalo mais bobo de montar um quadro de equipamentos
window.duplicateEqSlot = async (id) => {
  const s = _eqSlots.find((x) => x.id === id); if (!s) return;
  try {
    const copy = await db.createEquipmentSlot(systemId, {
      name: s.name + ' (cópia)', accepts_type: s.accepts_type || null,
      width: s.width, height: s.height, silhouette_url: s.silhouette_url || null,
      pos_x: Math.min(96, (s.pos_x || 50) + 6), pos_y: Math.min(96, (s.pos_y || 50) + 6),
      sort_order: Date.now() % 100000,
    });
    _eqSlots.push(copy);
    _eqSelected = new Set([copy.id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
    showMsg('Slot duplicado.', 'ok');
  } catch (e) { showMsg(e.message); }
};
window.saveEqSlotsBatch = async () => {
  const ids = [..._eqSelected];
  const type = $('eqb-type').value;
  const w = parseInt($('eqb-w').value), h = parseInt($('eqb-h').value);
  const patch = {};
  if (type === '__none__') patch.accepts_type = null;
  else if (type) patch.accepts_type = type;
  if (!isNaN(w)) patch.width = w;
  if (!isNaN(h)) patch.height = h;
  if (!Object.keys(patch).length) { showMsg('Preencha ao menos um campo pra aplicar.'); return; }
  try {
    await Promise.all(ids.map((id) => db.updateEquipmentSlot(id, patch)));
    ids.forEach((id) => { const s = _eqSlots.find((x) => x.id === id); if (s) Object.assign(s, patch); });
    redrawEqBoard();
    renderEqEditorPanel(true);
    showMsg(`${ids.length} slots atualizados.`, 'ok');
  } catch (e) { showMsg(e.message); }
};
window.delEqSlotsBatch = async () => {
  const ids = [..._eqSelected];
  const ok = await confirmModal({ title: `Excluir ${ids.length} slots`, desc: 'Itens equipados neles voltam pra mochila do jogador. Não dá pra desfazer.', confirmLabel: 'Excluir' });
  if (!ok) return;
  try {
    await Promise.all(ids.map((id) => db.deleteEquipmentSlot(id)));
    _eqSlots = _eqSlots.filter((s) => !ids.includes(s.id));
    _eqSelected.clear();
    if (_eqSlots.length) _eqSelected = new Set([_eqSlots[0].id]);
    redrawEqBoard();
    renderEqEditorPanel(true);
  } catch (e) { showMsg(e.message); }
};
</script>
</body>
</html>
